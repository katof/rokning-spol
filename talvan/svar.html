<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Svara – Snar</title>
<!-- Næmingasíðan til livandi spurnarkanningar á Talvuni. Næmingurin skannar QR-kotuna (svar.html#KOTA) ella skrivar kotuna.
     Einki navn verður sent – bert svarið og eitt tilvildarligt tal fyri tólið, so tað sama tólið ikki svarar fleiri ferðir. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap">
<script>if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&/[?&]mock=1/.test(location.search))document.write('<script src="test/mt-mock.js"><\/script>');</script>
<style>
:root{--ink:#202124;--muted:#5f6368;--blue:#1559e8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:Inter,Arial,sans-serif;background:linear-gradient(160deg,#eff6ff,#fdf4ff);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:14px 18px}header img{height:26px}header b{font-weight:800}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-left)) 40px;text-align:center}
h1{font-size:clamp(1.4rem,6vw,2.4rem);line-height:1.2;margin:0 0 24px;max-width:22ch}
.code{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.code input{font:800 2rem Inter,Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;width:8ch;text-align:center;padding:10px;border:2px solid #cbd5e1;border-radius:14px}
.btn{font:800 1.1rem Inter,Arial,sans-serif;border:0;border-radius:14px;background:#ef2418;color:#fff;padding:14px 22px;cursor:pointer}
.opts{display:grid;gap:14px;width:min(560px,100%)}
.opts.faces{grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
.o{border:3px solid transparent;border-radius:20px;background:#fff;padding:16px;font:800 clamp(1.1rem,5vw,1.6rem) Inter,Arial,sans-serif;color:#fff;cursor:pointer;box-shadow:0 10px 24px -14px rgba(0,0,0,.45);transition:transform .12s}
.o:active{transform:scale(.97)}.o[aria-pressed=true]{border-color:#111827;box-shadow:0 0 0 4px #fff,0 0 0 8px #111827}
.faces .o{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(2.6rem,12vw,4rem);padding:0}
.msg{margin-top:22px;font-weight:700;color:var(--muted);min-height:1.4em}
.done{font-size:clamp(1.3rem,6vw,2rem);font-weight:800}
.err{color:#b91c1c}
</style>
</head>
<body>
<header><img src="https://snar.fo/fileadmin/user_upload/TEMA_-_KT/Logo_Snar/SnarLogoRed.png" alt="Snar" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'Snar'}))"></header>
<main id="m"></main>
<script>
(function(){
'use strict';
var API='https://script.google.com/macros/s/AKfycbzCXg4lWitSjUbpf8rYoEWBbdE3VRoJURthXZYP_OZlpE5U33ovlfk8Iw-L_hLilsB8eA/exec';
var M=document.getElementById('m'),K='',Q=null,mine=null,tm=null;
var sid;try{sid=localStorage.getItem('snar-svar-sid');if(!sid){sid=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('snar-svar-sid',sid);}}catch(e){sid=Math.random().toString(36).slice(2);}
var FACE={g:['😀','#22c55e'],lg:['🙂','#84cc16'],y:['😐','#facc15'],o:['🙁','#fb923c'],r:['😞','#ef4444']};
var COL=['#ef4444','#3b82f6','#f59e0b','#22c55e','#a855f7','#ec4899'];
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function api(b){if(window.MT_MOCK)return new Promise(function(res){setTimeout(function(){res(window.MT_MOCK(JSON.parse(JSON.stringify(b))));},120);});
  return fetch(API,{method:'POST',body:JSON.stringify(b)}).then(function(r){return r.json();});}
function askCode(err){M.innerHTML='<h1>Skriva kotuna, sum stendur á talvuni</h1><div class="code"><input id="k" maxlength="4" autocomplete="off" spellcheck="false" inputmode="text"><button class="btn" id="go">Byrja</button></div><p class="msg'+(err?' err':'')+'">'+(err||'')+'</p>';
  var i=document.getElementById('k');i.focus();i.addEventListener('input',function(){i.value=i.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);});
  function go(){if(i.value.length===4){location.hash=i.value;}}document.getElementById('go').addEventListener('click',go);i.addEventListener('keydown',function(e){if(e.key==='Enter')go();});}
function load(){clearTimeout(tm);K=(location.hash||'').slice(1).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);if(K.length!==4){askCode();return;}
  M.innerHTML='<p class="msg">Bíða eina løtu …</p>';try{mine=JSON.parse(sessionStorage.getItem('snar-svar-'+K));}catch(e){mine=null;}
  api({act:'kanningsiggj',kota:K}).then(function(r){if(!r.ok){askCode('Eingin kanning hevur kotuna „'+K+'“. Kanna, at tú hevur skrivað hana rætt.');return;}
    Q=r;if(!r.opin){done();return;}draw();watch();},function(){M.innerHTML='<p class="msg err">Einki samband. Royn aftur um eina løtu.</p>';tm=setTimeout(load,5000);});}
function draw(){var f=Q.t==='s',h='<h1>'+esc(Q.q||'Hvat heldur tú?')+'</h1><div class="opts'+(f?' faces':'')+'">';
  Q.o.forEach(function(x,i){var bg=f?(FACE[x]||FACE.y)[1]:Q.t==='j'?(i?'#ef4444':'#22c55e'):COL[i%COL.length];
    h+='<button class="o" type="button" data-i="'+i+'" aria-pressed="'+(mine===i)+'" style="background:'+bg+'"'+(f?' aria-label="Svar '+(i+1)+'"':'')+'>'+(f?(FACE[x]||FACE.y)[0]:esc(x))+'</button>';});
  h+='</div><p class="msg" id="msg">'+(mine!=null?'Takk! Tú kanst broyta svarið, so leingi kanningin er opin.':'')+'</p>';M.innerHTML=h;
  [].forEach.call(M.querySelectorAll('.o'),function(b){b.addEventListener('click',function(){var i=+b.dataset.i,msg=document.getElementById('msg');msg.textContent='Sendi …';
    api({act:'svara',kota:K,sid:sid,i:i}).then(function(r){if(r.ok){mine=i;try{sessionStorage.setItem('snar-svar-'+K,String(i));}catch(e){}
        [].forEach.call(M.querySelectorAll('.o'),function(x){x.setAttribute('aria-pressed',String(+x.dataset.i===i));});msg.textContent='Takk! Tú kanst broyta svarið, so leingi kanningin er opin.';}
      else if(r.villa==='lidug')done();else msg.textContent='Tað bar ikki til at senda svarið. Royn aftur.';},function(){msg.textContent='Einki samband. Royn aftur.';});});});}
function done(){clearTimeout(tm);M.innerHTML='<p class="done">Kanningin er liðug. Takk fyri!</p>';}
function watch(){tm=setTimeout(function(){api({act:'kanningsiggj',kota:K}).then(function(r){if(r.ok&&!r.opin){done();return;}watch();},function(){watch();});},6000);}
window.addEventListener('hashchange',load);load();
})();
</script>
</body>
</html>
