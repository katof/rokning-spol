<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morgunark – Snar</title>
<!-- Morgunark til Talvuna: eitt nýtt ark hvønn dag til 1.–3., 4.–6. og 7.–9. flokk.
     ?dl=g|m|h  (flokkur)   &d=ÁÁÁÁ-M-D (dagur, annars í dag)   &print=1 (prentar beinanvegin)
     Á skíggja (iPad) eru svarteigar og ein tekniflati; á pappíri eru linjur og kassar. -->
<style>
:root{--ink:#1f2937;--muted:#64748b;--red:#ef2418;--line:#cbd5e1;--soft:#f1f5f9}
*{box-sizing:border-box}
html,body{margin:0;background:#e9edf2;color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.bar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:600 .9rem inherit;cursor:pointer;color:var(--ink)}
.bar button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar .pr{background:var(--red);border-color:var(--red);color:#fff}
.sheet{width:min(210mm,100%);min-height:297mm;margin:16px auto 40px;padding:16mm 16mm 12mm;background:#fff;box-shadow:0 10px 40px -20px rgba(0,0,0,.4);display:flex;flex-direction:column}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:3px solid var(--red);padding-bottom:8px;margin-bottom:6mm}
.hd h1{margin:0;font-size:28pt;font-weight:900;letter-spacing:-.02em}
.hd .dt{font-size:12pt;font-weight:600;color:var(--muted);text-align:right}
.nm{display:flex;gap:10px;align-items:flex-end;font-size:12pt;font-weight:700;margin-bottom:7mm}
.nm span.l{flex:1;border-bottom:1.5px solid var(--ink);min-height:1.4em}
.nm input{flex:1;border:0;border-bottom:1.5px solid var(--ink);font:600 13pt inherit;padding:2px 4px;background:transparent}
.t{margin-bottom:7mm;break-inside:avoid}
.t h2{display:flex;gap:10px;align-items:center;margin:0 0 3mm;font-size:13pt}
.t h2 b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:11pt;flex:none}
.sums{display:grid;grid-template-columns:repeat(2,1fr);gap:4mm 10mm;font-size:16pt;font-weight:700;font-variant-numeric:tabular-nums}
.sums div{display:flex;align-items:flex-end;gap:8px;white-space:nowrap}
.sums .a,.ans{flex:1;min-width:20mm;border-bottom:1.5px solid var(--ink);min-height:1.2em}
input.a,input.ans,textarea.ans{border:0;border-bottom:1.5px solid var(--ink);font:600 15pt inherit;padding:2px 4px;background:transparent;color:#1d4ed8}
.seq{font-size:16pt;font-weight:700;letter-spacing:.04em;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.seq .ans{flex:none;width:28mm}
.lines{display:grid;gap:9mm;margin-top:2mm}
.lines span{border-bottom:1px solid #94a3b8;height:1px}
textarea.ans{width:100%;min-height:42mm;border:1px solid var(--line);border-radius:8px;font-size:13pt;line-height:1.6;resize:vertical;color:#1d4ed8}
.box{border:1.5px solid var(--ink);border-radius:10px;height:62mm;position:relative;overflow:hidden;touch-action:none;background:#fff}
.box canvas{position:absolute;inset:0;width:100%;height:100%}
.box .clr{position:absolute;right:6px;top:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font:600 .8rem inherit}
.stars{display:flex;flex-wrap:wrap;gap:6px;max-width:150mm;margin-bottom:3mm;color:#f59e0b;font-size:20pt;line-height:1}
.words{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14pt;font-weight:700;margin-bottom:3mm}
.pairs{display:grid;grid-template-columns:repeat(2,1fr);gap:4mm 10mm;font-size:14pt;font-weight:700}
.pairs div{display:flex;gap:8px;align-items:flex-end}
.ft{margin-top:auto;padding-top:6mm;display:flex;justify-content:space-between;font-size:9pt;color:var(--muted)}
.print-only{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  .bar,.screen-only,.box .clr{display:none!important}
  .print-only{display:block}
  .sheet{margin:0;box-shadow:none;width:210mm;height:297mm}
  input.a,input.ans{color:transparent}
}
@media (max-width:700px){.sheet{padding:18px 16px;min-height:0}.hd h1{font-size:22pt}.sums{font-size:14pt}}
</style>
</head>
<body>
<div class="bar screen-only" role="toolbar" aria-label="Morgunark">
  <button type="button" data-dl="g">1.–3. flokkur</button>
  <button type="button" data-dl="m">4.–6. flokkur</button>
  <button type="button" data-dl="h">7.–9. flokkur</button>
  <button type="button" class="pr" id="prentBtn">Prenta</button>
</div>
<main class="sheet" id="sheet"></main>
<script>
(function(){
var Q=new URLSearchParams(location.search),DL=/^[gmh]$/.test(Q.get('dl')||'')?Q.get('dl'):'m';
var DGD=['sunnudagur','mánadagur','týsdagur','mikudagur','hósdagur','fríggjadagur','leygardagur'],
  DGM=['januar','februar','mars','apríl','mai','juni','juli','august','september','oktober','november','desember'];
function today(){var p=(Q.get('d')||'').split('-').map(Number);if(p.length===3&&p[0]>2000)return new Date(p[0],p[1]-1,p[2]);var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
var T=today(),KEY=T.getFullYear()+'-'+(T.getMonth()+1)+'-'+T.getDate();
/* Sama ark allan dagin: tilvild úr degnum og flokkinum */
var seed=0;(KEY+DL).split('').forEach(function(c){seed=(seed*31+c.charCodeAt(0))>>>0;});
function rnd(){seed=(seed+0x6D2B79F5)>>>0;var t=seed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}
function ri(a,b){return a+Math.floor(rnd()*(b-a+1));}
function pick(L){return L[Math.floor(rnd()*L.length)];}
function shuffle(L){L=L.slice();for(var i=L.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1)),x=L[i];L[i]=L[j];L[j]=x;}return L;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var SCREEN=!Q.get('print');
function ans(w){return SCREEN?'<input class="ans" inputmode="numeric" aria-label="Svar"'+(w?' style="width:'+w+'"':'')+'>':'<span class="ans"'+(w?' style="flex:none;width:'+w+'"':'')+'></span>';}
function sums(L){return '<div class="sums">'+L.map(function(x){return '<div>'+x+' = '+(SCREEN?'<input class="a" inputmode="numeric" aria-label="Svar">':'<span class="a"></span>')+'</div>'}).join('')+'</div>';}
function lines(n){return SCREEN?'<textarea class="ans" aria-label="Skriva her"></textarea>':'<div class="lines">'+new Array(n+1).join('<span></span>')+'</div>';}
function box(){return '<div class="box"><canvas></canvas><button type="button" class="clr screen-only">Strika</button></div>';}
var n=0;function task(title,body){n++;return '<section class="t"><h2><b>'+n+'</b>'+title+'</h2>'+body+'</section>';}
/* Føroyski stavraðurin */
var ABC='aábdðefghiíjklmnoóprstuúvyýæø';
function fsort(L){return L.slice().sort(function(a,b){for(var i=0;i<Math.min(a.length,b.length);i++){var x=ABC.indexOf(a[i]),y=ABC.indexOf(b[i]);if(x!==y)return x-y;}return a.length-b.length;});}
var h='';
if(DL==='g'){
  var S=[];for(var i=0;i<3;i++){var a=ri(1,9),b=ri(1,10-a);S.push(a+' + '+b);}for(i=0;i<3;i++){var c=ri(4,10),d=ri(1,c-1);S.push(c+' − '+d);}
  h+=task('Rokna',sums(shuffle(S)));
  var st=ri(6,15);h+=task('Hvussu nógvar stjørnur eru her?','<div class="stars" aria-hidden="true">'+new Array(st+1).join('★')+'</div><div class="seq">Tað eru '+ans('28mm')+' stjørnur.</div>');
  var L=pick(['A','B','D','E','F','G','H','K','L','M','N','O','R','S','T','V']);
  h+=task('Skriva trý orð, ið byrja við '+L,lines(3));
  h+=task(pick(['Tekna húsið, tú býrt í.','Tekna eitt dýr, tú dámar.','Tekna veðrið í dag.','Tekna morgunmatin, tú át.','Tekna ein vin.','Tekna tað, tú vilt gera í frítíðini.']),box());
}else if(DL==='m'){
  var S=[];for(var i=0;i<2;i++){S.push(ri(3,9)+' · '+ri(3,9));}for(i=0;i<2;i++){var b=ri(3,9),q=ri(3,9);S.push(b*q+' : '+b);}
  S.push(ri(120,480)+' + '+ri(110,490));var x=ri(400,900);S.push(x+' − '+ri(120,x-100));
  h+=task('Rokna',sums(shuffle(S)));
  var s0=ri(2,9),k=pick([3,4,5,6,7,25]),dbl=rnd()<.3,seq=[];for(i=0;i<6;i++)seq.push(dbl?s0*Math.pow(2,i):s0+k*i);var hole=ri(2,5);
  h+=task('Hvat tal manglar?','<div class="seq">'+seq.map(function(v,j){return j===hole?ans('24mm'):v;}).join(', ')+'</div>');
  var W=shuffle(['bók','seyður','talva','epli','fiskur','hús','lundi','skúli','ferja','sól','vindur','blýantur','dagur','ørindi','drongur','áin']).slice(0,5);
  h+=task('Set orðini í stavrað','<div class="words">'+W.join(' · ')+'</div>'+(SCREEN?'<input class="ans" style="width:100%" aria-label="Orðini í stavrað">':'<div class="lines"><span></span></div>'));
  h+=task(pick(['Skriva tríggjar setningar um tað, tú gjørdi í gjár.','Skriva tríggjar setningar um eitt dýr, tú dámar.','Skriva eina stutta søgu, ið byrjar soleiðis: „Tá ið eg vaknaði í morgun …“','Skriva tríggjar setningar um veðrið í dag.','Skriva um ein dag, tú aldri fert at gloyma.']),lines(4));
}else{
  var S=[];var p=pick([10,20,25,50]),v=pick([40,80,120,200,360]);S.push(p+' % av '+v);
  var a=ri(2,6),xx=ri(2,9),bb=ri(1,12);S.push(a+'x + '+bb+' = '+(a*xx+bb)+' &nbsp; x');
  S.push('(−'+ri(3,12)+') + '+ri(2,15));S.push('¾ av '+(4*ri(3,12)));S.push(ri(11,19)+'²');S.push(pick([2,3,4,5])+'³');
  h+=task('Rokna',sums(S));
  var PR=[['heitur','kaldur'],['ljósur','myrkur'],['glaður','keddur'],['langur','stuttur'],['gamal','ungur'],['stórur','lítil'],['fyrst','seinast'],['ríkur','fátækur']];
  h+=task('Skriva mótsetningin','<div class="pairs">'+shuffle(PR).slice(0,4).map(function(x){return '<div>'+x[0]+' – '+ans()+'</div>'}).join('')+'</div>');
  h+=task('Skriva ein stuttan tekst (5–6 setningar) um '+pick(['tað, ið fær teg at gleðast.','hvussu skúlin kundi verið betri.','ein persón, tú hevur virðing fyri.','eitt stað í Føroyum, tú dámar.','framtíðina hjá tær.']),lines(7));
}
var dt=DGD[T.getDay()]+' '+T.getDate()+'. '+DGM[T.getMonth()]+' '+T.getFullYear();
document.getElementById('sheet').innerHTML='<div class="hd"><h1>Morgunark</h1><div class="dt">'+esc(dt)+'<br>'+({g:'1.–3. flokkur',m:'4.–6. flokkur',h:'7.–9. flokkur'})[DL]+'</div></div>'
  +'<div class="nm">Navn:'+(SCREEN?'<input aria-label="Navn">':'<span class="l"></span>')+'</div>'+h
  +'<div class="ft"><span>Snar · Talvan</span><span>Arbeið kvirt, til lærarin byrjar tíman.</span></div>';
/* Tekniflatin á iPad */
Array.prototype.forEach.call(document.querySelectorAll('.box'),function(bx){var c=bx.querySelector('canvas'),g=c.getContext('2d'),dr=false;
  function fit(){var r=bx.getBoundingClientRect(),k=window.devicePixelRatio||1;c.width=r.width*k;c.height=r.height*k;g.setTransform(k,0,0,k,0,0);g.lineWidth=3;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#1d4ed8';}
  fit();function pt(e){var r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
  c.addEventListener('pointerdown',function(e){dr=true;var p=pt(e);g.beginPath();g.moveTo(p[0],p[1]);c.setPointerCapture(e.pointerId);});
  c.addEventListener('pointermove',function(e){if(!dr)return;var p=pt(e);g.lineTo(p[0],p[1]);g.stroke();});
  ['pointerup','pointercancel'].forEach(function(t){c.addEventListener(t,function(){dr=false;});});
  bx.querySelector('.clr').addEventListener('click',function(){g.clearRect(0,0,c.width,c.height);});});
/* Knøttar ovast */
Array.prototype.forEach.call(document.querySelectorAll('[data-dl]'),function(b){b.setAttribute('aria-pressed',b.dataset.dl===DL?'true':'false');
  b.addEventListener('click',function(){Q.set('dl',b.dataset.dl);location.search=Q.toString();});});
document.getElementById('prentBtn').addEventListener('click',function(){if(SCREEN){Q.set('print','1');location.search=Q.toString();}else window.print();});
if(!SCREEN)setTimeout(function(){window.print();},400);
})();
</script>
</body>
</html>
