<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morgunark – Snar</title>
<!-- Morgunark til Talvuna: 200 ørk til hvønn floksbólk, eitt til hvønn skúladag.
     ?dl=g|m|h  (Byrjanarstig, Miðstig, Hástig)
     &n=1–200   (arkið; annars arkið til skúladagin í dag – talt frá 1. august, uttan leygardagar og sunnudagar)
     &d=ÁÁÁÁ-M-D (ein annar dagur)   &k=slag (bert til roynd)   &print=1 (prentar beinanvegin)   &v=5 (fimm ørk í senn)
     &slag=rokning|sudoku|labyrint|tabell|prikkar|ordaleiting|klokkan|ord (øll 25 ørkini av slagnum; knøtturin er á snar.fo/um-talvuna)
     Arkini verða gjørd við kotu: arkið nr. n er altíð tað sama, so lærarin kann prenta frammanundan.
     Á skíggja (iPad) eru svarteigar og ein blýantur yvir alt arkið; á pappíri eru linjur og kassar. -->
<style>
:root{--ink:#1f2937;--muted:#64748b;--red:#ef2418;--line:#cbd5e1;--soft:#f1f5f9}
*{box-sizing:border-box}
html,body{margin:0;background:#e9edf2;color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.bar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:600 .9rem inherit;cursor:pointer;color:var(--ink)}
.bar button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar button:disabled{opacity:.35;cursor:default}
.bar .pr{background:var(--red);border-color:var(--red);color:#fff}
.bar .nr{font-weight:800;min-width:7em;text-align:center}
.bar .sep{width:1px;height:26px;background:var(--line)}
.sheet{width:min(210mm,100%);min-height:297mm;margin:16px auto 40px;padding:16mm 16mm 12mm;background:#fff;box-shadow:0 10px 40px -20px rgba(0,0,0,.4);display:flex;flex-direction:column}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:3px solid var(--red);padding-bottom:8px;margin-bottom:6mm}
.hd h1{margin:0;font-size:28pt;font-weight:900;letter-spacing:-.02em}
.hd .kd{font-size:14pt;font-weight:800;color:var(--red);margin-top:2px}
.hd .dt{font-size:12pt;font-weight:600;color:var(--muted);text-align:right}
.nm{display:flex;gap:10px;align-items:flex-end;font-size:12pt;font-weight:700;margin-bottom:7mm}
.nm span.l{flex:1;border-bottom:1.5px solid var(--ink);min-height:1.4em}
.nm input{flex:1;border:0;border-bottom:1.5px solid var(--ink);font:600 13pt inherit;padding:2px 4px;background:transparent}
.t{margin-bottom:7mm;break-inside:avoid}
.t h2{display:flex;gap:10px;align-items:center;margin:0 0 3mm;font-size:13pt}
.t h2 b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:11pt;flex:none}
.rule{margin:0 0 4mm;font-size:12pt;color:#334155;line-height:1.45}
.sums{display:grid;grid-template-columns:repeat(2,1fr);gap:4mm 10mm;font-size:16pt;font-weight:700;font-variant-numeric:tabular-nums}
.sums div{display:flex;align-items:flex-end;gap:8px;white-space:nowrap}
.sums .a,.ans{flex:1;min-width:16mm;border-bottom:1.5px solid var(--ink);min-height:1.2em}
input.a,input.ans,textarea.ans{border:0;border-bottom:1.5px solid var(--ink);font:600 15pt inherit;padding:2px 4px;background:transparent;color:#1d4ed8;min-width:0}
.seq{font-size:16pt;font-weight:700;letter-spacing:.04em;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.seq .ans{flex:none;width:28mm}
.lines{display:grid;gap:9mm;margin-top:2mm}
.lines span{border-bottom:1px solid #94a3b8;height:1px}
textarea.ans{width:100%;min-height:42mm;border:1px solid var(--line);border-radius:8px;font-size:13pt;line-height:1.6;resize:vertical}
.box{border:1.5px solid var(--ink);border-radius:10px;height:62mm;position:relative;overflow:hidden;background:#fff}
.stars{display:flex;flex-wrap:wrap;gap:6px;max-width:150mm;margin-bottom:3mm;color:#f59e0b;font-size:20pt;line-height:1}
.words{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14pt;font-weight:700;margin-bottom:3mm}
.pairs{display:grid;grid-template-columns:repeat(2,1fr);gap:4mm 10mm;font-size:14pt;font-weight:700}
.pairs div{display:flex;gap:8px;align-items:flex-end}
.sdk{display:grid;grid-template-columns:repeat(var(--n),1fr);width:min(100%,calc(var(--n) * 15mm));border:2.5px solid var(--ink);margin:0 auto}
.sdk-row{display:flex;gap:12mm;justify-content:center;flex-wrap:wrap}.sdk-row .sdk{margin:0}
.sc{aspect-ratio:1;border:1px solid #94a3b8;display:grid;place-items:center;font-size:18pt;font-weight:800}
.sc.br{border-right:2.5px solid var(--ink)}.sc.bb{border-bottom:2.5px solid var(--ink)}
.sc.giv{background:#f1f5f9}
.sc input{width:100%;height:100%;border:0;text-align:center;font:700 18pt inherit;color:#1d4ed8;background:transparent;padding:0}
.draw{position:relative;width:100%;margin:0 auto}
.draw svg{display:block;width:100%;height:auto;font-family:Inter,Arial,sans-serif}
.ws{display:grid;grid-template-columns:repeat(var(--n),1fr);width:min(100%,calc(var(--n) * 12mm));margin:0 auto 5mm;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.ws span{aspect-ratio:1;display:grid;place-items:center;font-size:15pt;font-weight:800;border:.5px solid #e2e8f0;user-select:none;cursor:pointer}
.ws span.on{background:#fde68a}
.wl{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:13pt;font-weight:700}
.wl span::before{content:"☐ ";color:var(--muted)}
.clocks{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm 8mm}
.clocks div{display:flex;flex-direction:column;align-items:center;gap:3mm;font-size:15pt;font-weight:700}
.clocks svg{width:42mm;height:42mm}
.clocks .tm{display:flex;align-items:flex-end;gap:4px}
.clocks .tm .ans{flex:none;width:12mm;min-width:12mm}
.ft{margin-top:auto;padding-top:6mm;display:flex;justify-content:space-between;font-size:9pt;color:var(--muted)}
/* Blýanturin: skriva og tekna allastaðni á arkinum */
.sheet{position:relative}
.penc{position:absolute;left:0;top:0;pointer-events:none;z-index:4}
body.pen .penc{pointer-events:auto;touch-action:none;cursor:crosshair}
/* „Eg havi gjørt arkið“ kann trýstast á, eisini meðan blýanturin er tendraður */
.doneBtn{position:relative;z-index:5}
.penbar{position:fixed;right:14px;bottom:14px;z-index:10;display:flex;gap:6px;padding:6px;background:#fff;border-radius:16px;box-shadow:0 10px 30px -10px rgba(0,0,0,.45)}
.penbar button{display:flex;align-items:center;gap:6px;border:0;border-radius:12px;background:var(--soft);padding:10px 14px;font:700 .95rem inherit;color:var(--ink);cursor:pointer}
.penbar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.penbar #penOn[aria-pressed=true]{background:#1d4ed8;color:#fff}
body:not(.pen) #penUndo,body:not(.pen) #penClear{display:none}
@media screen and (max-width:760px){.penbar{left:8px;right:8px;justify-content:center}.penbar button{padding:10px 12px}.sheet{margin-bottom:84px}}
/* Liðugt, yvirlit og prógv */
.done{display:flex;justify-content:center;margin:2mm 0 4mm}
.done button{border:0;border-radius:999px;padding:12px 22px;font:800 1.05rem inherit;cursor:pointer;background:#16a34a;color:#fff;box-shadow:0 8px 20px -10px rgba(22,163,74,.8)}
.done button.is{background:#dcfce7;color:#166534;box-shadow:none}
.yv h2{margin:0 0 4mm;font-size:16pt}
.yv .big{font-size:20pt;font-weight:900;margin:0 0 2mm}.yv .big b{color:#16a34a}
.yv .sub{margin:0 0 6mm;color:#475569;font-size:12pt}
.grid200{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin-bottom:5mm}
.grid200 a{aspect-ratio:1;display:grid;place-items:center;border-radius:4px;font-size:8pt;font-weight:700;text-decoration:none;color:#334155;background:#e2e8f0}
.grid200 a.ok{background:#16a34a;color:#fff}.grid200 a.fut{background:#f8fafc;color:#cbd5e1}.grid200 a.now{outline:2.5px solid var(--red);outline-offset:1px}
.flyt{margin:0 0 6mm;padding:12px 14px;border:1.5px dashed #94a3b8;border-radius:10px;background:#f8fafc}
.flyt b{display:block;font-size:12pt;margin-bottom:2px}
.flyt p{margin:0 0 8px;color:#475569;font-size:10.5pt}
.flyt button,.flyt-ja button{font:600 10.5pt Inter,Arial,sans-serif;border:0;border-radius:999px;padding:8px 16px;background:#1d4ed8;color:#fff;cursor:pointer}
.flyt button.sec,.flyt-ja button.sec{background:#e2e8f0;color:#1f2937}
.flyt-out{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:10px}
.flyt-out svg{width:150px;height:150px;flex:none}
.flyt-out .lk{flex:1;min-width:200px;font-size:9.5pt;color:#475569;word-break:break-all}
.flyt-ja{display:flex;gap:10px;margin-top:6mm}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:10.5pt;color:#475569;margin-bottom:6mm}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.kinds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6mm}
.kinds div{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:10.5pt}.kinds b{display:block;font-size:16pt}
.pg{display:flex;flex-wrap:wrap;gap:8px}
.pg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:700 .95rem inherit;cursor:pointer}
.pg button:not(:disabled){background:#fef3c7;border-color:#f59e0b}
.pg button:disabled{opacity:.45;cursor:default}
.cert{justify-content:center;align-items:center;text-align:center;border:0;position:relative}
.cert:before{content:"";position:absolute;inset:10mm;border:3px solid var(--red);border-radius:6mm;box-shadow:inset 0 0 0 4mm #fff,inset 0 0 0 5mm #fca5a5}
.cert .st{font-size:40pt;color:#f59e0b;letter-spacing:8px}
.cert h1{margin:4mm 0 2mm;font-size:52pt;font-weight:900;letter-spacing:-.02em}
.cert .who{margin:10mm 0 2mm;font-size:13pt;color:#475569}
.cert .nmc{font:italic 700 34pt Georgia,serif;border-bottom:2px solid var(--ink);min-width:120mm;padding:0 6mm 2mm;margin:0 auto}
.cert .why{margin:8mm 0 4mm;font-size:16pt;font-weight:700}
.cert .kl{font-size:11pt;color:#475569;max-width:150mm;margin:0 auto;line-height:1.6}
.cert .sig{display:flex;justify-content:space-between;gap:20mm;width:150mm;margin:22mm auto 0;font-size:10.5pt;color:#475569}
.cert .sig span{flex:1;border-top:1.5px solid var(--ink);padding-top:2mm}
@media screen and (max-width:760px){.grid200{grid-template-columns:repeat(10,1fr)}.kinds{grid-template-columns:repeat(2,1fr)}.cert{min-height:150vw;padding:14vw 8vw}.cert:before{inset:4vw}.cert h1{font-size:13vw}.cert .st{font-size:9vw}.cert .nmc{min-width:0;width:100%;font-size:8vw}.cert .why{font-size:5vw}.cert .sig{width:100%;gap:8vw;margin-top:10vw}}
@media print{
  /* Kagarnir (serliga Safari á iPad) leggja ofta egnar breddar afturat. Tí er arkið ikki ein fastur 210×297 mm
     kassi, men fyllir bert tað, sum er eftir innan fyri breddarnar, so einki fer yvir á eina nýggja síðu. */
  @page{size:A4;margin:12mm}
  html,body{background:#fff}
  .bar,.screen-only{display:none!important}
  .sheet{margin:0 auto;box-shadow:none;width:auto;max-width:178mm;min-height:0;height:auto;padding:0;break-after:page;break-inside:avoid}
  .sheet.cert{height:255mm}
  .sheet:last-child{break-after:auto}
  body.blank input.a,body.blank input.ans{color:transparent}
  .penbar,.done{display:none!important}
  .ws span.on{background:none}
}
/* Til at máta, hvussu høgt arkið verður á pappíri (sí fitPrint) */
.pfit .sheet{margin:0 auto;width:178mm;max-width:none;min-height:0;height:auto;padding:0}
.pfit .done,.pfit .screen-only{display:none!important}
/* Telefon og iPad á langs: alt innan fyri arkið (bert á skíggja, ikki tá ið prentað verður) */
@media screen and (max-width:760px){
  .bar{gap:6px;padding:8px}.bar button{padding:6px 10px;font-size:.8rem}.bar .sep{display:none}.bar .nr{min-width:0}
  .sheet{width:auto;min-height:0;margin:8px;padding:16px 14px 12px}
  .hd{flex-direction:column;align-items:flex-start;gap:4px}.hd .dt{text-align:left;font-size:10.5pt}.hd h1{font-size:22pt}
  .t h2{font-size:12pt}.rule{font-size:11pt}
  .sums,.pairs{grid-template-columns:1fr;font-size:14pt;gap:4mm}
  .sums div,.pairs div{white-space:normal}
  .seq{font-size:14pt}
  .clocks{grid-template-columns:repeat(2,1fr);gap:5mm}.clocks svg{width:34vw;height:34vw}.clocks div{font-size:13pt}
  .ws{width:100%}.ws span{font-size:11pt}.wl{font-size:11pt}
  .sc,.sc input{font-size:14pt}
  .sdk-row{gap:6mm}
  textarea.ans{min-height:30mm}
}
</style>
</head>
<body>
<div class="bar screen-only" role="toolbar" aria-label="Morgunark">
  <button type="button" data-dl="g">Byrjanarstig</button>
  <button type="button" data-dl="m">Miðstig</button>
  <button type="button" data-dl="h">Hástig</button>
  <span class="sep"></span>
  <button type="button" id="prev" aria-label="Undanfarna ark">‹</button>
  <span class="nr" id="nr"></span>
  <button type="button" id="next" aria-label="Næsta ark">›</button>
  <button type="button" id="today">Í dag</button>
  <span class="sep"></span>
  <button type="button" id="yvBtn">Mítt yvirlit</button>
  <button type="button" id="mittBtn">Prenta mítt ark</button>
  <span class="sep"></span>
  <button type="button" class="pr" id="prentBtn" title="Tómt ark til at prenta">Prenta tómt ark</button>
</div>
<div id="sheets"></div>
<div class="penbar screen-only" role="toolbar" aria-label="Blýantur">
  <button type="button" id="penOn" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M14 6l4 4"/></svg><span>Blýantur</span></button>
  <button type="button" id="penUndo" aria-label="Angra"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Angra</span></button>
  <button type="button" id="penClear"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg><span>Strika alt</span></button>
</div>
<script>
(function(){
var Q=new URLSearchParams(location.search),DL=/^[gmh]$/.test(Q.get('dl')||'')?Q.get('dl'):'m',SCREEN=!Q.get('print'),MAX=200;
var DGD=['sunnudagur','mánadagur','týsdagur','mikudagur','hósdagur','fríggjadagur','leygardagur'],
  DGM=['januar','februar','mars','apríl','mai','juni','juli','august','september','oktober','november','desember'],
  DLN={g:'Byrjanarstig',m:'Miðstig',h:'Hástig'};
function dayOf(){var p=(Q.get('d')||'').split('-').map(Number);if(p.length===3&&p[0]>2000)return new Date(p[0],p[1]-1,p[2]);var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
/* Skúladagur nr.: mánadagar–fríggjadagar frá 1. august (Talvan roknar tað sama) */
function schoolDay(t){var y=t.getMonth()>=7?t.getFullYear():t.getFullYear()-1,d=new Date(y,7,1),n=0;while(d<=t){var w=d.getDay();if(w>0&&w<6)n++;d.setDate(d.getDate()+1);}return Math.max(1,((n-1)%MAX)+1);}
var T=dayOf(),TODAYN=schoolDay(T),N=+Q.get('n')||TODAYN;N=Math.min(MAX,Math.max(1,N));
var KIND=['rokning','sudoku','labyrint','tabell','prikkar','ordaleiting','klokkan','ord'],
  KN={rokning:'Rokning',sudoku:'Sudoku',labyrint:'Villiniborg',tabell:'Tabellvenjing',prikkar:'Tekna eftir prikkum',ordaleiting:'Orðaleiting',klokkan:'Klokkan',ord:'Lesa og skriva'};
/* Tilvild, sum altíð gevur tað sama til sama ark */
var seed=0;
function setSeed(str){seed=0;str.split('').forEach(function(c){seed=(seed*31+c.charCodeAt(0))>>>0;});}
function rnd(){seed=(seed+0x6D2B79F5)>>>0;var t=seed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}
function ri(a,b){return a+Math.floor(rnd()*(b-a+1));}
function pick(L){return L[Math.floor(rnd()*L.length)];}
function shuffle(L){L=L.slice();for(var i=L.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1)),x=L[i];L[i]=L[j];L[j]=x;}return L;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function ans(w){return SCREEN?'<input class="ans" inputmode="numeric" aria-label="Svar"'+(w?' style="flex:none;width:'+w+'"':'')+'>':'<span class="ans"'+(w?' style="flex:none;width:'+w+'"':'')+'></span>';}
function sums(L){return '<div class="sums">'+L.map(function(x){return '<div>'+x+' = '+(SCREEN?'<input class="a" inputmode="numeric" aria-label="Svar">':'<span class="a"></span>')+'</div>'}).join('')+'</div>';}
function fill(L){return '<div class="sums">'+L.map(function(x){return '<div>'+x.replace('__',ans('18mm'))+'</div>'}).join('')+'</div>';}
function lines(n){return SCREEN?'<textarea class="ans" aria-label="Skriva her"></textarea>':'<div class="lines">'+new Array(n+1).join('<span></span>')+'</div>';}
/* Kassar og tekningar hava ikki egnan blýant longur: Blýanturin niðri til høgru tekur alt arkið (og verður goymdur). */
function box(){return '<div class="box"></div>';}
function draw(svg){return '<div class="draw">'+svg+'</div>';}
var tn=0;function task(title,body){tn++;return '<section class="t"><h2><b>'+tn+'</b>'+title+'</h2>'+body+'</section>';}

/* ---------- Sudoku ---------- */
function sudoku(br,bc,keep){var N=br*bc,r,c;
  function perm(n){return shuffle(Array.from({length:n},function(_,i){return i;}));}
  var rows=[],cols=[];perm(bc).forEach(function(b){perm(br).forEach(function(x){rows.push(b*br+x);});});perm(br).forEach(function(s){perm(bc).forEach(function(x){cols.push(s*bc+x);});});
  var dig=perm(N),P=[];for(r=0;r<N;r++){P.push([]);for(c=0;c<N;c++){var rr=rows[r],cc=cols[c];P[r].push(dig[(bc*(rr%br)+Math.floor(rr/br)+cc)%N]+1);}}
  function ok(B,r,c,v){for(var k=0;k<N;k++)if(B[r][k]===v||B[k][c]===v)return false;var r0=r-r%br,c0=c-c%bc;for(var a=0;a<br;a++)for(var b=0;b<bc;b++)if(B[r0+a][c0+b]===v)return false;return true;}
  function count(B,lim){for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(!B[r][c]){var n=0;for(var v=1;v<=N;v++)if(ok(B,r,c,v)){B[r][c]=v;n+=count(B,lim-n);B[r][c]=0;if(n>=lim)return n;}return n;}return 1;}
  var left=N*N;shuffle(Array.from({length:N*N},function(_,i){return i;})).forEach(function(k){if(left<=keep)return;var r=Math.floor(k/N),c=k%N,v=P[r][c];P[r][c]=0;if(count(P.map(function(x){return x.slice();}),2)!==1)P[r][c]=v;else left--;});
  var h='<div class="sdk" style="--n:'+N+'">';for(r=0;r<N;r++)for(c=0;c<N;c++){var v=P[r][c],cl=(c%bc===bc-1&&c<N-1?' br':'')+(r%br===br-1&&r<N-1?' bb':'');
    h+='<div class="sc'+cl+(v?' giv':'')+'">'+(v?v:(SCREEN?'<input inputmode="numeric" maxlength="1" aria-label="Linja '+(r+1)+', rútur '+(c+1)+'">':''))+'</div>';}return h+'</div>';}
function sdkRule(n){return 'Tølini 1–'+n+' skulu standa eina ferð í hvørjari linju, bæði vatnrætt og loddrætt, og í hvørjum tjúkkum kassa.';}

/* ---------- Labyrint ---------- */
function maze(W,H){var g=[],st=[[0,0]],i,x,y;for(i=0;i<W*H;i++)g.push({n:1,s:1,e:1,w:1,v:0});g[0].v=1;
  while(st.length){var cu=st[st.length-1];x=cu[0];y=cu[1];var nb=[];

  return '<main class="sheet">'+h+'</div><div class="ft"><span>Snar · Talvan</span><span>Goymt á hesum iPadinum</span></div></main>';}
/* slag=sudoku o.s.fr. (frá síðuni um Talvuna): øll ørkini av hesum slagi á hesum stiginum, t.d. til at prenta */
var SLAG=KIND.indexOf(Q.get('slag'))>=0?Q.get('slag'):'';
var V=Math.min(10,Math.max(1,+Q.get('v')||1)),out='',MODE=Q.get('flyt')?'flyt':Q.get('yvirlit')?'yv':Q.get('progv')?'pg':'ark',FLYT=MODE==='flyt'?flytLes(Q.get('flyt')):null;
if(MODE==='flyt')out=flytSida(FLYT);else if(MODE==='yv')out=overview();else if(MODE==='pg')out=certificate(+Q.get('progv')||10);else if(SLAG)for(var k=1;k<=MAX;k++){if(KIND[(k-1)%KIND.length]===SLAG)out+=sheet(k);}
else for(var k=0;k<V&&N+k<=MAX;k++)out+=sheet(N+k);
document.getElementById('sheets').innerHTML=out;if(!SCREEN)document.body.classList.add('blank');
/* Navn og svar verða goymd, so arkið kann prentast ella gerast lidnað seinni */
if(SCREEN&&MODE==='ark')Array.prototype.forEach.call(document.querySelectorAll('.sheet'),function(sh){
  var nm=sh.querySelector('.nm input');if(nm){nm.value=NAME;nm.addEventListener('input',function(){NAME=nm.value;lsSet('morgunark-navn',NAME);});}
  var F=Array.prototype.slice.call(sh.querySelectorAll('input,textarea')).filter(function(x){return x!==nm;}),SK='morgunark-svar-'+DL+'-'+N,SV=lsGet(SK,[]);
  F.forEach(function(x,i){if(SV[i])x.value=SV[i];x.addEventListener('input',function(){SV[i]=x.value;lsSet(SK,SV);});});
  var db=sh.querySelector('.doneBtn');if(db){var n=+db.dataset.n;function upd(){var on=!!DONE[n];db.classList.toggle('is',on);db.textContent=on?'✓ Arkið er gjørt – trýst fyri at taka merkið burtur':'Eg havi gjørt arkið ✓';}upd();
    db.addEventListener('click',function(){if(DONE[n])delete DONE[n];else DONE[n]=dgIso();lsSet(DONEK,DONE);upd();});}});
function dgIso(){var t=new Date();return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate();}
/* Flyt mítt yvirlit: vís QR-kotu og leinki */
var fb=document.getElementById('flytBtn');
if(fb)fb.addEventListener('click',function(){var o=document.getElementById('flytOut'),u=flytUrl();o.hidden=false;o.innerHTML='<span class="lk">…</span>';
  qrLoad(function(){o.innerHTML=(window.qrcode?qrSvg(u):'')+'<div class="lk">Ella opna hetta leinkið á nýggja iPadinum:<br>'+esc(u)+'<br><button type="button" class="sec" id="flytAvrita" style="margin-top:8px">Avrita leinkið</button></div>';
    document.getElementById('flytAvrita').addEventListener('click',function(){var b=this;function ok(){b.textContent='Avritað ✓';}
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(ok,function(){});});});});
/* Á nýggja tólinum: tak yvirlitið inn */
var fj=document.getElementById('flytJa');
if(fj&&FLYT){fj.addEventListener('click',function(){var best='m',mest=-1;
    FLYT_DL.forEach(function(dl){var k='morgunark-gjort-'+dl,d=lsGet(k,{});FLYT.ark[dl].forEach(function(n){if(!d[n])d[n]=dgIso();});lsSet(k,d);
      if(FLYT.ark[dl].length>mest){mest=FLYT.ark[dl].length;best=dl;}});
    if(FLYT.navn)lsSet('morgunark-navn',FLYT.navn);
    go({flyt:null,dl:best,yvirlit:1,n:null});});
  document.getElementById('flytNei').addEventListener('click',function(){go({flyt:null});});}
Array.prototype.forEach.call(document.querySelectorAll('[data-progv]'),function(b){b.addEventListener('click',function(){var u=new URLSearchParams();u.set('dl',DL);u.set('progv',b.dataset.progv);u.set('print','1');location.search=u.toString();});});

/* Orðaleiting á skíggja: trýst á bókstavirnar */
if(SCREEN)Array.prototype.forEach.call(document.querySelectorAll('.ws span'),function(s){s.addEventListener('click',function(){s.classList.toggle('on');});});
/* Knøttar ovast */
function go(o){if(!('print' in o))Q.delete('print');Object.keys(o).forEach(function(k){if(o[k]==null)Q.delete(k);else Q.set(k,o[k]);});location.search=Q.toString();}
Array.prototype.forEach.call(document.querySelectorAll('[data-dl]'),function(b){b.setAttribute('aria-pressed',b.dataset.dl===DL?'true':'false');b.addEventListener('click',function(){go({dl:b.dataset.dl,progv:null});});});
document.getElementById('nr').textContent=MODE==='ark'?'Ark '+N+' av '+MAX:MODE==='yv'?'Yvirlit':MODE==='flyt'?'Flyt':'Prógv';
document.getElementById('prev').disabled=N<=1;document.getElementById('next').disabled=N>=MAX;
document.getElementById('prev').addEventListener('click',function(){go({n:N-1});});
document.getElementById('next').addEventListener('click',function(){go({n:N+1});});
document.getElementById('today').addEventListener('click',function(){go({n:null,d:null,yvirlit:null,progv:null,print:null,v:null});});
document.getElementById('yvBtn').addEventListener('click',function(){go({yvirlit:1,n:null,progv:null,print:null,v:null});});
document.getElementById('mittBtn').addEventListener('click',function(){window.print();});
if(MODE!=='ark'){['mittBtn'].concat(MODE==='yv'||MODE==='flyt'?['prentBtn']:[]).forEach(function(id){document.getElementById(id).style.display='none';});}
if(MODE==='pg'){var pbn=document.getElementById('prentBtn');pbn.textContent='Prenta prógv';pbn.onclick=function(e){e.stopImmediatePropagation();window.print();};}
document.getElementById('prentBtn').addEventListener('click',function(){if(SCREEN)go({print:1,n:N,v:null});else window.print();});
/* Hvørt ark skal vera á einari síðu: er arkið hægri enn 255 mm á pappíri, verður tað gjørt eitt sindur minni */
function fitPrint(){var L=255*96/25.4;document.body.classList.add('pfit');
  Array.prototype.forEach.call(document.querySelectorAll('.sheet:not(.cert)'),function(s){s.style.zoom='';var h=s.offsetHeight;if(h>L)s.style.zoom=(L/h).toFixed(3);});
  document.body.classList.remove('pfit');}
window.addEventListener('beforeprint',fitPrint);
if(SCREEN)window.addEventListener('afterprint',function(){Array.prototype.forEach.call(document.querySelectorAll('.sheet'),function(s){s.style.zoom='';});});
if(!SCREEN)setTimeout(function(){fitPrint();window.print();},500);

/* ---------- Blýanturin yvir allt arkið (navn, uppgávur og tekningar) ---------- */
if(MODE!=='ark'){document.querySelector('.penbar').style.display='none';['prev','next'].forEach(function(id){document.getElementById(id).style.display='none';});}
if(SCREEN&&MODE==='ark'){var KEYP='morgunark-'+DL+'-'+N,PEN=[];
  Array.prototype.forEach.call(document.querySelectorAll('.sheet'),function(sh,si){
    var c=document.createElement('canvas');c.className='penc';sh.appendChild(c);var g=c.getContext('2d'),W=1,cur=null,hist=[],strokes=[];
    try{strokes=JSON.parse(localStorage.getItem(KEYP+'-'+si)||'[]');}catch(e){}
    function save(){try{localStorage.setItem(KEYP+'-'+si,JSON.stringify(strokes));}catch(e){}}
    function line(st){if(!st.length)return;g.beginPath();g.moveTo(st[0][0]*W,st[0][1]*W);for(var i=1;i<st.length;i++)g.lineTo(st[i][0]*W,st[i][1]*W);if(st.length===1)g.lineTo(st[0][0]*W+.1,st[0][1]*W);g.stroke();}
    function redraw(){g.clearRect(0,0,c.width,c.height);strokes.forEach(line);}
    function fit(){W=sh.offsetWidth;var H=sh.offsetHeight,k=window.devicePixelRatio||1;c.width=W*k;c.height=H*k;c.style.width=W+'px';c.style.height=H+'px';
      g.setTransform(k,0,0,k,0,0);g.lineWidth=Math.max(2,W/280);g.lineCap='round';g.lineJoin='round';g.strokeStyle='#1d4ed8';redraw();}
    fit();window.addEventListener('resize',fit);window.addEventListener('load',fit);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
    function pt(e){var r=c.getBoundingClientRect();return[(e.clientX-r.left)/W,(e.clientY-r.top)/W];}
    c.addEventListener('pointerdown',function(e){e.preventDefault();hist.push(strokes.slice());cur=[pt(e)];strokes.push(cur);try{c.setPointerCapture(e.pointerId);}catch(x){}line(cur);});
    c.addEventListener('pointermove',function(e){if(!cur)return;var p=pt(e),l=cur[cur.length-1];g.beginPath();g.moveTo(l[0]*W,l[1]*W);g.lineTo(p[0]*W,p[1]*W);g.stroke();cur.push(p);});
    ['pointerup','pointercancel','pointerleave'].forEach(function(t){c.addEventListener(t,function(){if(cur){cur=null;save();}});});
    PEN.push({undo:function(){if(hist.length){strokes=hist.pop();redraw();save();}},clear:function(){if(strokes.length){hist.push(strokes.slice());strokes=[];redraw();save();}}});});
  var pb=document.getElementById('penOn');
  function setPen(on){document.body.classList.toggle('pen',on);pb.setAttribute('aria-pressed',on?'true':'false');try{localStorage.setItem('morgunark-pen',on?'1':'');}catch(e){}}
  pb.addEventListener('click',function(){setPen(!document.body.classList.contains('pen'));});
  document.getElementById('penUndo').addEventListener('click',function(){PEN.forEach(function(p){p.undo();});});
  document.getElementById('penClear').addEventListener('click',function(){PEN.forEach(function(p){p.clear();});});
  try{if(localStorage.getItem('morgunark-pen'))setPen(true);}catch(e){}
}
})();
</script>
