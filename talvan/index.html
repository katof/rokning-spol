<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Talvan er flutt – Snar</title>
<!-- Verður index.html á GAMLA staðnum (katof.github.io/rokning-spol/talvan/), tá ið rammin á snar.fo/talvan er dagførdur.
     Hevur kagin einki goymt av Talvuni her, fer síðan beint til nýggja staðið. Annars kann lærarin flyta talvurnar:
     nýggja Talvan verður opnað í nýggjum vindeyga, sigur frá, at hon er klár, og fær so talvurnar beinleiðis. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
<style>
:root{--ink:#202124;--muted:#5f6368}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;font-family:Inter,Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,#eff6ff,#fdf4ff)}
main{max-width:560px;background:#fff;border-radius:20px;padding:32px 28px;box-shadow:0 20px 50px -24px rgba(0,0,0,.35)}
h1{margin:0 0 12px;font-size:1.8rem}
p{line-height:1.55;margin:0 0 14px}
.btn{display:inline-block;font:800 1.05rem Inter,Arial,sans-serif;border:0;border-radius:14px;background:#ef2418;color:#fff;padding:14px 22px;cursor:pointer;text-decoration:none}
.msg{font-weight:700;color:var(--muted);min-height:1.4em;margin-top:14px}
a{color:#1559e8;font-weight:700}
</style>
<script src="flyt.js"></script>
</head>
<body>
<main id="m"><p>Bíða eina løtu …</p></main>
<script>
(function () {
  var LOC = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  var NEW = LOC ? 'http://127.0.0.1:8825' : 'https://snar-talvan.github.io';
  var url = NEW + '/' + location.search + location.hash;
  /* Í eini ramma (gamal rammi á snar.fo): beint til nýggja staðið */
  if (window.parent !== window) { location.replace(url); return; }
  var M = document.getElementById('m');
  window.SnarFlyt().then(function (d) {
    if (!d.n) { location.replace(url); return; }
    M.innerHTML = '<h1>Talvan er flutt</h1>'
      + '<p>Talvan hevur fingið nýggja adressu hjá Snar: <a href="' + NEW + '/">snar-talvan.github.io</a>.</p>'
      + '<p>Tínar talvur eru goymdar í hesum kaganum. Trýst á knøttin, so verða tær fluttar við til nýggju Talvuna.</p>'
      + '<button class="btn" type="button" id="go">Flyt talvurnar og lat Talvuna upp</button>'
      + '<p class="msg" id="msg"></p>'
      + '<p style="font-size:.9rem;color:#5f6368;margin-top:18px">Brúkar tú Talvuna á snar.fo/talvan, verða talvurnar fluttar av sær sjálvum, fyrstu ferð tú letur hana upp.</p>';
    var msg = document.getElementById('msg'), w = null, sent = false;
    window.addEventListener('message', function (e) {
      if (!w || e.source !== w || e.origin !== NEW || !e.data) return;
      if (e.data.snar === 'talvan-flyt-klar' && !sent) { sent = true; w.postMessage({ snar: 'talvan-flyt-data', d: d }, NEW); msg.textContent = 'Flyti …'; }
      if (e.data.snar === 'talvan-flyt-takk') {
        M.innerHTML = '<h1>Talvurnar eru fluttar</h1><p>Talvan er nú opin í nýggjum vindeyga. Tú kanst lata hetta vindeygað aftur.</p>'
          + '<p>Goym nýggju adressuna: <a href="' + NEW + '/">snar-talvan.github.io</a></p>';
      }
    });
    document.getElementById('go').addEventListener('click', function () {
      sent = false; w = window.open(url, '_blank');
      msg.textContent = w ? 'Letur nýggju Talvuna upp …' : 'Kagin steðgaði nýggja vindeyganum. Trýst á knøttin aftur.';
    });
  });
})();
</script>
</body>
</html>
