<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talvan – Snar</title>
<!-- Telefonir fáa hesa síðuna í staðin fyri Talvuna (index.html sendir tær higar), tí Talvan er ov tung og ov stór til eina telefon.
     Hundurin og spælið eru tikin úr Spøl til Rokning 1a og 1b á snar.fo/rokning. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
html, body { height: 100%; margin: 0; }
body { background: #f7f7f7; font-family: Inter, Arial, Helvetica, sans-serif; }
.phone {
    display: grid; align-content: center; justify-items: center; gap: 18px; min-height: 100%; box-sizing: border-box;
    padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
  }
.phone p { margin: 0; max-width: 30ch; font-size: clamp(17px, 4.6vw, 22px); line-height: 1.4; font-weight: 700; color: #3a3a3a; text-wrap: balance; }
.phone svg { width: 100%; max-width: 640px; height: auto; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; cursor: pointer; }
.phone .px { font-family: "Press Start 2P", ui-monospace, monospace; }
.phone .hint { font-size: clamp(11px, 3vw, 13px); color: #757575; font-family: "Press Start 2P", ui-monospace, monospace; line-height: 1.6; }
document.querySelector(".phone").addEventListener("pointerdown", jump);
  addEventListener("keydown", ev => { if (ev.code === "Space" || ev.code === "ArrowUp") jump(ev); }
</style>
</head>
<body>
<section class="phone" aria-label="Talvan riggar bara við teldu">
  <p>Talvan riggar bara við teldu – og best á stórskíggja, men tú kanst spæla við Snar.</p>
  <svg id="run" viewBox="0 0 600 200" shape-rendering="crispEdges" role="img" aria-label="Snar hoppar. Trýst fyri at hoppa.">
    <rect width="600" height="200" fill="#f7f7f7"/>
    <g id="clouds" fill="#dcdcdc"></g>
    <text id="score" class="px" x="588" y="26" text-anchor="end" font-size="14" fill="#535353">00000</text>
    <text id="best" class="px" x="470" y="26" text-anchor="end" font-size="14" fill="#a0a0a0"></text>
    <g id="ground"></g>
    <g id="obstacles"></g>
    <g id="dog">
      <g fill="#535353">
        <path id="back-legs" d="M28 46h8v6h-8zm-4 4h12v4H24z"/>
        <path id="front-legs" d="M54 46h8v6h-8zm0 4h12v4H54z"/>
        <path id="tail" d="M24 34h8v10h-8zm-6-2h6v6h-6zm-4-4h6v6h-6z"/>
        <path d="M30 32h32v18H30zm-4 4h8v10h-8zm12-6h22v6H38zm22-4h10v24H60z"/>
        <path d="M66 18h12v4H66zm-4 4h20v20H62zm16 8h12v12H78zm10 0h4v6h-4z"/>
        <path d="M60 20h6v18h-6zm-2 4h4v10h-4z"/>
      </g>
      <path id="eye-open" d="M73 25h4v4h-4z" fill="#1a5ce6"/>
      <path id="eye-shut" d="M72 28h6v2h-6z" fill="#1a5ce6" visibility="hidden"/>
      <path d="M62 38h10v4H62z" fill="#ef2418"/>
      <text id="woof" class="px" x="96" y="14" font-size="10" fill="#ef2418" visibility="hidden">VOFF!</text>
    </g>
    <text id="msg" class="px" x="300" y="92" text-anchor="middle" font-size="13" fill="#535353">Trýst fyri at byrja</text>
  </svg>
  <div class="hint">Trýst á skermin fyri at hoppa</div>
</section>

<script>
// Snar hoppar: spælið, sum telefonir fáa í staðin fyri Talvuna.
(() => {

  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const dog = $("dog"), obstaclesG = $("obstacles"), cloudsG = $("clouds"), scoreEl = $("score"), bestEl = $("best"), msg = $("msg");
  const GROUND = 170, DOG_X = 30, GRAVITY = .0026, JUMP = .74, S = 1.3;  // S: Snar and the obstacles are drawn 1.3× size

  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  // Ground line with pebbles; the pebble strip is two screens wide so it can scroll forever.
  const groundG = $("ground");
  el("rect", { x: 0, y: GROUND, width: 600, height: 2, fill: "#535353" }, groundG);
  const pebbles = el("g", { fill: "#a3a3a3" }, groundG);
  for (let x = 0; x < 1200; x += 37) el("rect", { x: x % 600 + (x >= 600 ? 600 : 0), y: GROUND + 6 + (x % 3) * 5, width: x % 5 + 2, height: 2 }, pebbles);

  const clouds = [[80, 50], [330, 34], [520, 62]].map(([x, y]) => {
    const g = el("g", {}, cloudsG);
    el("path", { d: "M8 0h20v4h6v4h6v8H0V8h4V4h4z" }, g);
    return { g, x, y };
  });

  // Obstacles, drawn in pixels: a red hydrant, a stone and two stones.
  const TYPES = [
    { w: 18, h: 30, draw: g => el("path", { d: "M5 0h8v4H5zM3 4h12v22H3zM0 12h18v4H0zM1 26h16v4H1z", fill: "#d43a2f" }, g) },
    { w: 20, h: 14, draw: g => el("path", { d: "M4 0h12v4H4zM0 4h20v10H0z", fill: "#8a8a8a" }, g) },
    { w: 34, h: 18, draw: g => el("path", { d: "M4 4h10v4H4zM0 8h18v10H0zM20 0h10v4H20zM18 4h16v14H18z", fill: "#8a8a8a" }, g) },
  ];

  let state = "ready", y = 0, vy = 0, dist = 0, speed = 0, last = 0, legT = 0, obstacles = [], gap = 0, best = 0;
  try { best = +localStorage.getItem("talvan/snar-best") || 0; } catch (e) {}
  const pad = n => String(Math.floor(n)).padStart(5, "0");
  bestEl.textContent = best ? `HI ${pad(best)}` : "";

  function show(id, on) { $(id).setAttribute("visibility", on ? "visible" : "hidden"); }

  function drawDog() {
    dog.setAttribute("transform", `translate(${DOG_X} ${GROUND - 54 * S - y}) scale(${S})`);
    const step = y === 0 && state === "run" ? Math.floor(legT / 90) % 2 : -1;
    $("back-legs").setAttribute("transform", step === 0 ? "translate(0 -2)" : "");
    $("front-legs").setAttribute("transform", step === 1 ? "translate(0 -2)" : "");
    $("tail").setAttribute("transform", state === "run" && Math.floor(legT / 150) % 2 ? "translate(0 -2)" : "");
  }

  function start() {
    obstacles.forEach(o => o.g.remove());
    obstacles = []; y = vy = dist = legT = 0; gap = 300;
    state = "run";
    msg.setAttribute("visibility", "hidden");
    show("eye-open", true); show("eye-shut", false);
    show("woof", true); setTimeout(() => state === "run" && show("woof", false), 700);
    last = performance.now();
    requestAnimationFrame(loop);
  }

  function over() {
    state = "over";
    show("eye-open", false); show("eye-shut", true); show("woof", true);
    msg.textContent = "Aj! Trýst fyri at royna aftur";
    msg.setAttribute("visibility", "visible");
    const score = dist / 12;
    if (score > best) {
      best = Math.floor(score);
      bestEl.textContent = `HI ${pad(best)}`;
      try { localStorage.setItem("talvan/snar-best", best); } catch (e) {}
    }
    drawDog();
  }

  function loop(t) {
    if (state !== "run") return;
    const dt = Math.min(40, t - last);
    last = t;
    speed = Math.min(.75, .33 + dist * .000012);
    dist += speed * dt;
    legT += dt;
    // jump arc
    if (y > 0 || vy > 0) { vy -= GRAVITY * dt; y = Math.max(0, y + vy * dt); if (y === 0) vy = 0; }
    // obstacles roll in from the right, further apart as the game speeds up
    obstacles.forEach(o => { o.x -= speed * dt; o.g.setAttribute("transform", `translate(${o.x.toFixed(1)} ${GROUND - o.t.h * S}) scale(${S})`); });
    while (obstacles.length && obstacles[0].x < -60) obstacles.shift().g.remove();
    const lastX = obstacles.length ? obstacles[obstacles.length - 1].x : -Infinity;
    if (600 - lastX > gap) {
      const t2 = TYPES[Math.floor(Math.random() * TYPES.length)];
      const g = el("g", {}, obstaclesG);
      t2.draw(g);
      obstacles.push({ g, t: t2, x: 610 });
      gap = 240 + Math.random() * 260 + speed * 260;
    }
    pebbles.setAttribute("transform", `translate(${-(dist % 600).toFixed(1)} 0)`);
    clouds.forEach(c => { c.x -= speed * .15 * dt; if (c.x < -50) c.x = 620; c.g.setAttribute("transform", `translate(${c.x.toFixed(1)} ${c.y})`); });
    scoreEl.textContent = pad(dist / 12);
    drawDog();
    // the dog's body is roughly x 26–90 and 36 tall in its own drawing
    const dx0 = DOG_X + 30 * S, dx1 = DOG_X + 88 * S, dTop = GROUND - y - 34 * S, dBottom = GROUND - y - 2;
    if (obstacles.some(o => o.x + 3 < dx1 && o.x + o.t.w * S - 3 > dx0 && GROUND - o.t.h * S + 3 < dBottom && dTop < GROUND)) { over(); return; }
    requestAnimationFrame(loop);
  }

  function jump(ev) {
    ev?.preventDefault?.();
    if (state !== "run") { start(); return; }
    if (y === 0) vy = JUMP;
  }

  document.querySelector(".phone").addEventListener("pointerdown", jump);
  addEventListener("keydown", ev => { if (ev.code === "Space" || ev.code === "ArrowUp") jump(ev); });
  clouds.forEach(c => c.g.setAttribute("transform", `translate(${c.x} ${c.y})`));
  drawDog();
})();
</script>
</body>
</html>
