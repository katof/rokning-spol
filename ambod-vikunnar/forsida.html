<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amboð vikunnar – forsíðuelementið (prototypa)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Bert til royndarsíðuna: ein eftirgjørd forsíða, so elementið sæst í samanhangi */
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#fff;color:#1b1b1b}
.mock{max-width:1040px;margin:0 auto;padding:28px clamp(16px,3vw,40px)}
.mock-h{font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-.03em;margin:10px 0 6px}
.mock-s{height:56px;border:1px solid #cfcfcb;max-width:560px;display:flex;align-items:center;padding:0 1rem;color:#8a8a86;margin:14px 0 30px}
.mock-g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}
.mock-g div{height:120px;background:#f6f6f3;border:1px solid #e2e2de}
.mock-n{font-size:.85rem;color:#8a8a86;border:1px dashed #c4c4be;padding:8px 12px;margin-bottom:22px}
</style>
</head>
<body>
<div class="mock">
 <p class="mock-n">Royndarsíða: alt uttan um spjaldrið „Amboð vikunnar“ er bert ein eftirgjørd forsíða. Sjálvt elementið er millum viðmerkingarnar „ELEMENT BYRJAR“ og „ELEMENT ENDAR“ í kelduni.</p>
 <p class="mock-h">Snar.</p>
 <div class="mock-s">Leita á Snar …</div>

<!-- ELEMENT BYRJAR: Amboð vikunnar á forsíðuni. Lím hetta inn í eitt HTML-element. -->
<style>
.avf{--ink:#1b1b1b;--muted:#5f5f5b;--line:#e2e2de;--red:#ef2418;--a:#1f8a5b;--a-soft:#e6f4ec;
 font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;color:var(--ink);line-height:1.5}
.avf *,.avf *::before,.avf *::after{box-sizing:border-box}
.avf[hidden]{display:none!important}
.avf[data-c=bla]{--a:#2a5fb0;--a-soft:#e8effa}
.avf[data-c=reydgult]{--a:#c9600f;--a-soft:#fdf0e3}
.avf[data-c=lilla]{--a:#7a4bb5;--a-soft:#f1eafa}
.avf-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 22px;align-items:center;border:1.5px solid var(--line);border-left:8px solid var(--a);background:#fff;padding:16px 20px}
.avf-lab{display:flex;flex-direction:column;gap:5px;align-items:flex-start;padding-right:22px;border-right:1px solid var(--line)}
.avf-new{background:var(--red);color:#fff;font-weight:800;font-size:.72rem;letter-spacing:.06em;padding:2px 8px}
.avf-lab b{font-weight:800;font-size:1.02rem;line-height:1.15}
.avf-lab small{color:var(--muted);font-size:.8rem}
.avf-t{margin:0;font-weight:800;font-size:1.3rem;letter-spacing:-.01em;line-height:1.2}
.avf-t span{font-weight:600;color:var(--a);font-size:1rem;margin-left:8px;letter-spacing:0}
.avf-p{margin:3px 0 0;color:#3c3c39;font-size:.97rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.avf-b{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.avf .avf-go{display:inline-flex;justify-content:center;align-items:center;min-height:42px;padding:.4rem 1.1rem;background:var(--a);color:#fff;font-weight:700;text-decoration:none;white-space:nowrap}
.avf .avf-go:hover{filter:brightness(.92)}
.avf .avf-all{color:var(--ink);font-weight:600;font-size:.9rem;text-align:center;text-underline-offset:3px}
@media (max-width:760px){
 .avf-in{grid-template-columns:minmax(0,1fr)}
 .avf-lab{flex-direction:row;align-items:center;gap:10px;border-right:0;padding-right:0}
 .avf-t span{display:block;margin-left:0}
 .avf-b{flex-direction:row;align-items:center;gap:14px}
}
</style>
<section class="avf" id="snar-ambod-forsida" hidden aria-label="Amboð vikunnar">
 <div class="avf-in">
  <div class="avf-lab"><span class="avf-new">NÝTT</span><b>Amboð<br>vikunnar</b><small id="avf-d"></small></div>
  <div><p class="avf-t" id="avf-t"></p><p class="avf-p" id="avf-p"></p></div>
  <div class="avf-b"><a class="avf-go" id="avf-go" href="#">Sí amboðið →</a><a class="avf-all" id="avf-all" href="#">Øll amboðini</a></div>
 </div>
</section>
<script>
(function(){
/* Sama fíla sum savnssíðan lesur. Um hon ikki kann lesast, verður elementið verandi fjalt. */
var DATA_URL='stubbar.json';
var SAVN_URL='index.html';   /* á Snar: slóðin til savnssíðuna, t.d. /ambod-vikunnar */
var el=document.getElementById('snar-ambod-forsida');
var MAN=['januar','februar','mars','apríl','mai','juni','juli','august','september','oktober','november','desember'];
function date(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
var q=new URLSearchParams(location.search).get('dagur');
var today=q?date(q):new Date();today.setHours(0,0,0,0);
fetch(DATA_URL).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(all){
 var out=all.filter(function(s){return date(s.d)<=today}).sort(function(a,b){return a.d<b.d?-1:1});
 if(!out.length)return;
 var s=out[out.length-1],d=date(s.d);
 el.dataset.c=s.c;
 document.getElementById('avf-d').textContent=d.getDate()+'. '+MAN[d.getMonth()];
 var t=document.getElementById('avf-t');t.textContent=s.heiti;
 var u=document.createElement('span');u.textContent=s.undir;t.appendChild(u);
 document.getElementById('avf-p').textContent=s.stutt;
 document.getElementById('avf-go').href=SAVN_URL+'#ambod-'+s.nr;
 document.getElementById('avf-all').href=SAVN_URL;
 /* «NÝTT» sæst bert fyrstu fýra dagarnar */
 if((today-d)/864e5>3)el.querySelector('.avf-new').hidden=true;
 el.hidden=false;
}).catch(function(){});
})();
</script>
<!-- ELEMENT ENDAR -->

 <div class="mock-g"><div></div><div></div><div></div></div>
</div>
</body>
</html>
