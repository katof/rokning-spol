<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sólskipanin – Karin Kvant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap">
<link rel="stylesheet" href="karin.css">
<style>
  /* Stage: the sun at the left edge, empty slots in a row, the jumbled planets below; tap a planet to put it in the next free slot, tap it again to take it back */
  .slot circle { fill: #fff; stroke: #c9c3d0; stroke-width: 3; stroke-dasharray: 10 8; }
  .slot text { font-size: 24px; font-weight: 800; fill: var(--muted); text-anchor: middle; }
  .slot.wrong circle { stroke: var(--wrong); stroke-dasharray: none; stroke-width: 6; }
  .slot.right circle { stroke: var(--ok); stroke-dasharray: none; stroke-width: 6; }
  .body { cursor: pointer; }
  .body:hover { filter: brightness(1.08); }
  .body .nm { font-size: 24px; font-weight: 800; fill: var(--ink); text-anchor: middle; pointer-events: none; }
  .body .em { font-size: 64px; text-anchor: middle; dominant-baseline: central; }
  .sunlbl { font-size: 28px; font-weight: 900; fill: var(--sun-dark); }
</style>
</head>
<body class="alheim">
<div class="page">
  <header>
    <div class="num">☀</div>
    <h1>Sólskipanin</h1>
    <span class="book">Karin Kvant</span>
    <p class="task" id="task"></p>
    <div class="tools">
      <span class="stars" id="score">0 / 8</span>
      <a id="home" class="home" href="https://snardev.ctrl.fo/temasavn/karin-kvant" aria-label="Heim til filmarnar" title="Heim til filmarnar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8M5 10v11h5v-6h4v6h5V10"/></svg></a>
      <button id="again" type="button">Byrja umaftur</button>
    </div>
  </header>

  <div class="stage">
    <svg id="board" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="Sólin, tómir plássir í røð og gongustjørnurnar at leggja í rætta raðfylgju">
      <rect width="1600" height="900" fill="#fffafc"/>
      <g id="scene"></g>
      <g id="bubble" class="bubble"></g>
      <g id="actions"></g>
    </svg>
    <p class="done-msg" id="done" hidden>Flott! Tú kennir sólskipanina. ☀ Ljósið frá sólini er 8 minuttir á veg til tín.</p>
  </div>

  <footer>
    <span class="pg">Filmur 11 · 7 · 9</span>
    <span>Tá ið tú tosar um sólina · Hví er náttin so myrk? · Á tíðarferð!</span>
    <span class="tab">Náttúra og tøkni 4.–6.: sólin, sólskipanin og himmalin</span>
  </footer>
</div>

<script src="karin.js"></script>
<script>
const { el, shuffle, say } = K;
const sceneG = document.getElementById("scene");
K.setBubble({ x: 1200, y: 60, w: 380 });

// gongustjørnurnar í røð frá sólini: navn, litur, stødd á skíggjanum
const PLANETS = [
  { name: "Merkur", fill: "#9e9e9e", r: 18 },
  { name: "Venus", fill: "#e3c16f", r: 30 },
  { name: "Jørðin", fill: "#3b7dd8", r: 32, earth: true },
  { name: "Mars", fill: "#d2553a", r: 22 },
  { name: "Jupiter", fill: "#d9a066", r: 62, bands: true },
  { name: "Saturn", fill: "#e6cf8e", r: 52, ring: true },
  { name: "Uranus", fill: "#8fd3e0", r: 42 },
  { name: "Neptun", fill: "#3f54c9", r: 40 },
];
const byName = n => PLANETS.find(p => p.name === n);

function drawBody(item, cx, cy, parent, labelY) {
  const g = el("g", { class: "body", role: "button", "aria-label": item.name }, parent);
  if (item.emoji) {
    el("circle", { cx, cy, r: 50, fill: "#fff", stroke: "#e9dfe5", "stroke-width": 3 }, g);
    el("text", { class: "em", x: cx, y: cy + 2 }, g).textContent = item.emoji;
  } else {
    if (item.ring) el("ellipse", { cx, cy, rx: item.r * 1.9, ry: item.r * .45, fill: "none", stroke: "#c9b170", "stroke-width": 8 }, g);
    el("circle", { cx, cy, r: item.r, fill: item.fill }, g);
    if (item.bands) { el("path", { d: `M${cx - item.r * .95} ${cy - 14} Q${cx} ${cy - 4} ${cx + item.r * .95} ${cy - 14}`, stroke: "#b07a45", "stroke-width": 7, fill: "none" }, g); el("path", { d: `M${cx - item.r * .9} ${cy + 22} Q${cx} ${cy + 30} ${cx + item.r * .9} ${cy + 22}`, stroke: "#b07a45", "stroke-width": 6, fill: "none" }, g); }
    if (item.earth) el("path", { d: `M${cx - 14} ${cy - 18} q10 -6 18 4 q8 12 -4 18 q-10 2 -14 -8 z M${cx + 4} ${cy + 6} q10 2 8 12 q-10 6 -12 -4 z`, fill: "#5aa84a" }, g);
    if (item.ring) el("path", { d: `M${cx - item.r * 1.9} ${cy} A${item.r * 1.9} ${item.r * .45} 0 0 0 ${cx + item.r * 1.9} ${cy}`, fill: "none", stroke: "#c9b170", "stroke-width": 8 }, g);
  }
  el("text", { class: "nm", x: cx, y: labelY || cy + Math.max(item.r || 50, 50) + 32 }, g).textContent = item.name;
  return g;
}

// ---- ordering rounds ----------------------------------------------------------
let items = [], slots = [], locked = false;   // slots[i] = item or null
function drawOrder() {
  sceneG.replaceChildren();
  const r = current;
  // sólin til vinstru, um hon er við
  if (r.sun) {
    el("circle", { cx: 40, cy: 330, r: 150, fill: "var(--sun)" }, sceneG);
    el("circle", { cx: 40, cy: 330, r: 110, fill: "#ffd25a" }, sceneG);
    el("text", { class: "sunlbl", x: 60, y: 520 }, sceneG).textContent = "Sólin";
  }
  const n = items.length, w = r.sun ? 1300 : 1100, x0 = r.sun ? 300 : 320;
  const step = n > 1 ? w / (n - 1) : 0;
  slots.forEach((it, i) => {
    const cx = x0 + i * step, cy = 330;
    const g = el("g", { class: "slot", "data-i": i }, sceneG);
    el("circle", { cx, cy, r: 70 }, g);
    // tómt pláss: talið; fult pláss: navnið á gongustjørnuni í staðin, so tað ikki liggur oman á talinum
    el("text", { x: cx, y: cy + 120 }, g).textContent = (i + 1) + "." + (r.labels && r.labels[i] ? " " + r.labels[i] : "");
    if (it) { const b = drawBody(it, cx, cy, sceneG, cy + 150); b.addEventListener("click", () => { if (locked) return; slots[i] = null; drawOrder(); }); }
  });
  // pool
  const pool = items.filter(it => !slots.includes(it));
  pool.forEach((it, i) => {
    const cx = x0 + i * step, cy = 660;
    const b = drawBody(it, cx, cy, sceneG);
    b.addEventListener("click", () => { if (locked) return; const free = slots.indexOf(null); if (free === -1) return; slots[free] = it; drawOrder(); });
  });
  if (!pool.length) K.clearActions(), K.button("Kanna", check, { x: 1390, y: 792 });
  else K.clearActions();
}
function check() {
  if (locked) return;
  const wrong = slots.map((it, i) => it !== current.order[i]);
  document.querySelectorAll(".slot").forEach((g, i) => g.classList.add(wrong[i] ? "wrong" : "right"));
  if (wrong.includes(true)) {
    const first = wrong.indexOf(true);
    say(`Nr. ${first + 1} er ikki rætt. ${current.hint}`);
    locked = true;
    setTimeout(() => { document.querySelectorAll(".slot").forEach(g => g.classList.remove("wrong", "right")); locked = false; }, 1200);
    return;
  }
  locked = true;
  say("Rætt! " + current.say);
  K.clearActions(); K.tick(1390, 830);
  round++;
  setTimeout(next, 4000);
}

// ---- rounds -------------------------------------------------------------------
const ROUNDS = [
  { type: "order", sun: true, items: PLANETS, order: PLANETS, task: "Legg gongustjørnurnar í rætta raðfylgju frá sólini. Trýst á eina gongustjørnu, so fer hon í næsta tóma pláss.", hint: "Hugsa: Merkur, Venus, Jørðin, Mars – og so teir stóru.", say: "Merkur, Venus, Jørðin, Mars, Jupiter, Saturn, Uranus, Neptun. Jørðin er nr. 3 frá sólini." },
  { type: "quiz", q: "Hvat er sólin?", options: ["Ein gongustjørna", "Ein stjørna", "Ein máni", "Eitt svart hol"], answer: 1, say: "Sólin er ein stjørna – ein risastórur bóltur av gassi, sum lýsir, tí atomkjarnar smelta saman inni í henni. Hon er bara so nær, at hon sær so stór út." },
  { type: "quiz", q: "Ljósið frá sólini – hvussu leingi er tað á veg til jarðar?", options: ["Einki, tað er her beinanvegin", "Umleið 8 minuttir", "Umleið 8 tímar", "Umleið 8 ár"], answer: 1, say: "150 milliónir km við 300 000 km um sekundið: umleið 8 minuttir. Tú sært sólina, sum hon var fyri 8 minuttum síðani!" },
  { type: "order", items: [{ name: "Mánin", emoji: "🌙" }, { name: "Sólin", emoji: "☀️" }, { name: "Neptun", emoji: "🔵" }, { name: "Næsta stjørna", emoji: "⭐" }], orderNames: ["Mánin", "Sólin", "Neptun", "Næsta stjørna"], labels: ["næst", "", "", "longst burtur"],
    task: "Legg í raðfylgju eftir, hvussu langt tey eru frá jørðini – tað næsta fyrst.", hint: "Mánin er tað næsta. Næsta stjørnan eftir sólini er nógv longri burtur enn Neptun.", say: "Mánin: 1 sekund fyri ljósið. Sólin: 8 minuttir. Neptun: 4 tímar. Næsta stjørnan, Proxima Centauri: 4 ár!" },
  { type: "quiz", q: "Tú hyggur at eini stjørnu, sum er 1000 ljósár burtur. Hvat sært tú?", options: ["Stjørnuna, sum hon er nú", "Stjørnuna, sum hon var fyri 1000 árum síðani", "Einki – ljósið er ikki komið", "Stjørnuna, sum hon verður um 1000 ár"], answer: 1, say: "Ljósið hevur verið 1000 ár á veg. Tú hyggur aftur í tíðina – ein tíðarferð uttan rúmskootara!" },
  { type: "quiz", q: "Alheimurin er fullur av stjørnum. Hví er náttin so myrk?", options: ["Stjørnurnar sløkna um náttina", "Alheimurin hevur ein aldur – ljósið frá teimum fjarstu stjørnunum er ikki komið higar enn", "Skýggini fjala tær", "Tað er bara soleiðis"], answer: 1, say: "Alheimurin er umleið 14 milliardir ára gamal, og hann víðkast. Ljósið frá teimum fjarstu stjørnunum hevur ikki havt tíð at koma higar – tí er náttin myrk." },
  { type: "order", items: [byName("Jupiter"), byName("Saturn"), byName("Jørðin"), byName("Mars")], orderNames: ["Jupiter", "Saturn", "Jørðin", "Mars"], labels: ["størst", "", "", "minst"],
    task: "Legg hesar fýra í raðfylgju eftir stødd – ta størstu fyrst.", hint: "Jupiter er størst av øllum. Mars er minni enn Jørðin.", say: "Jupiter er so stórur, at 1300 jarðir kundu ligið inni í honum. Mars er bara helvtina so breiður sum Jørðin." },
  { type: "quiz", q: "Hvat fer fram inni í sólini, so hon lýsir?", options: ["Hon brennur sum eitt bál", "Atomkjarnar smelta saman – hydrogen verður til helium", "Ravmagn", "Hon speglar ljós frá stjørnunum"], answer: 1, say: "Í miðjuni á sólini er so heitt og so stórt trýst, at hydrogen-kjarnar smelta saman til helium. Tað gevur orkuna – ljós og hita í milliardir av árum." },
];
let round = 0, current = null;

function start() { K.done(false); round = 0; next(); }
function next() {
  locked = false;
  K.clearActions();
  K.score(round, ROUNDS.length);
  if (round === ROUNDS.length) { sceneG.replaceChildren(); K.task("Liðugt!"); K.done(true); say("Tú kennir sólskipanina!"); return; }
  current = ROUNDS[round];
  if (current.type === "quiz") {
    locked = true;
    sceneG.replaceChildren();
    K.task("Svara spurninginum.");
    K.lines(current.q, 760, 300, 1100, sceneG, { class: "q" });
    say("Hvat heldur tú?");
    K.options(current.options.map((o, i) => ({ label: o, right: i === current.answer })), { onRight: () => { say(current.say); round++; setTimeout(next, 4500); }, onWrong: () => say("Nei, royn umaftur.") });
    return;
  }
  items = shuffle([...current.items]);
  current.order = current.orderNames ? current.orderNames.map(n => current.items.find(it => it.name === n)) : current.order;
  slots = current.items.map(() => null);
  K.task(current.task);
  say("Trýst á tey niðanfyri – og trýst á Kanna, tá ið øll eru komin á pláss.");
  drawOrder();
}

K.init({ again: start });
start();
</script>
</body>
</html>
