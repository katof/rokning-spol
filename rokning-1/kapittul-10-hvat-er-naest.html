<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skap og myndir – hvat er næst</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
  /* Layout: classroom screen — one landscape book page filling the viewport: header row, a row of three turning shapes and an empty box, three answer cards beneath, a sheep with a speech bubble at the right, green footer band like Rokning 1 */
  :root {
    color-scheme: light;
    --paper: #fffdf8;
    --ink: #24303f;
    --pencil: #2c3f9e;
    --chapter: #f06fa8;
    --leaf: #7fae3a;
    --wrong: #d23a2f;
    --font: "Andika", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--paper); color: var(--ink); }
  body { margin: 0; font-family: var(--font); overflow: hidden; }
  .page {
    height: 100%; box-sizing: border-box;
    padding-block: 1.2vh 1vh;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 1vh;
  }
  header { display: flex; align-items: center; gap: clamp(12px, 1.5vw, 28px); flex-wrap: wrap; }
  .num {
    width: clamp(48px, 5vw, 84px); aspect-ratio: 1; border-radius: 50%; flex: none;
    background: var(--chapter); color: var(--ink);
    display: grid; place-items: center; font-size: clamp(28px, 3.2vw, 54px); font-weight: 700;
  }
  h1 { margin: 0; font-size: clamp(28px, 3.4vw, 58px); letter-spacing: .02em; }
  .book { flex: none; padding: .15em .7em; border-radius: 999px; background: #eef2f6; color: var(--ink);
    font-size: clamp(14px, 1.4vw, 24px); font-weight: 700; letter-spacing: .03em; white-space: nowrap; }
  .task { margin: 0; font-size: clamp(18px, 2.2vw, 38px); line-height: 1.25; flex: 1 1 320px; min-width: 0; }
  .tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  .stars { font-size: clamp(18px, 1.8vw, 32px); font-weight: 700; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-size: clamp(16px, 1.5vw, 26px); font-weight: 700; cursor: pointer;
    border: 3px solid var(--leaf); background: #fff; color: var(--ink);
    padding: .3em .9em; border-radius: 999px;
  }
  button:hover { background: #f1f7e4; }
  button:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home { display: grid; place-items: center; padding: .3em .45em; align-self: stretch; border: 3px solid var(--leaf);
    border-radius: 999px; background: #fff; color: var(--ink); font-size: clamp(16px, 1.5vw, 26px); }
  a.home:hover { background: #f1f7e4; }
  a.home:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  button.icon { display: grid; place-items: center; padding: .3em .45em; align-self: stretch; }
  button.icon svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stage { position: relative; min-height: 0; }
  svg#board { width: 100%; height: 100%; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .question { font-size: 60px; font-weight: 700; fill: var(--ink); }
  .slot { fill: #fff; stroke: #9ec3e6; stroke-width: 5; stroke-dasharray: 18 12; }
  .slot.right { stroke: var(--leaf); stroke-dasharray: none; stroke-width: 7; fill: #f3f8e8; }
  .qmark { font-size: 140px; font-weight: 700; fill: #9ec3e6; text-anchor: middle; dominant-baseline: central; }
  .rule { stroke: #e3e7ea; stroke-width: 3; }
  .card { cursor: pointer; }
  .card > rect { fill: #fff; stroke: #b8c0c8; stroke-width: 4; }
  .card:hover > rect { stroke: var(--pencil); }
  .card.wrong > rect { stroke: var(--wrong); stroke-width: 7; fill: #fdf0ee; }
  .card.shake { animation: shake .45s; }
  @keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
  .check { font-size: 80px; fill: var(--leaf); font-weight: 700; }
  .bubble rect { fill: #fff; stroke: #3b4450; stroke-width: 3; }
  .bubble text { font-size: 32px; fill: var(--ink); text-anchor: middle; }
  .done-msg {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    margin: 0; padding: .6em 1.2em; border-radius: 20px; max-width: 90%;
    background: #f1f7e4; border: 5px solid var(--leaf);
    font-size: clamp(24px, 3.4vw, 60px); font-weight: 700; text-align: center;
    box-shadow: 0 10px 40px rgba(60, 80, 30, .25);
  }
  footer { display: flex; align-items: center; gap: 12px; border-top: 3px solid var(--leaf); padding-top: .5vh; font-size: clamp(13px, 1.1vw, 20px); }
  footer .pg { width: 2em; height: 2em; border-radius: 50%; border: 3px solid var(--leaf); display: grid; place-items: center; font-weight: 700; flex: none; }
  footer .tab { margin-left: auto; background: #dbe9b8; padding: 2px 12px; }
  @media (prefers-reduced-motion: reduce) { .card.shake { animation: none; } }
</style>
</head>

<script>
// Progress is kept in this browser only, so the class can leave mid-game and carry on later.
const SAVE_KEY = "rokning-spol/kapittul-10-hvat-er-naest";
const store = {
  get() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(v)); } catch (e) {} },
  clear() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} },
};

const NS = "http://www.w3.org/2000/svg";
const rowG = document.getElementById("row");
const cardsG = document.getElementById("cards");
const scoreEl = document.getElementById("score");
const doneEl = document.getElementById("done");

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function say(a, b) {
  document.getElementById("say1").textContent = a;
  document.getElementById("say2").textContent = b;
}

// The six rows from page 95. Each pattern has a number of states; the row shows
// three steps and the answer is the fourth. Each draws one state centred on (0, 0).
const STROKE = { stroke: "rgba(0,0,0,.25)", "stroke-width": 2 };
const PATTERNS = [
  { states: 2, color: "#f6a9c9", alt: "#a9dcf5", draw(g, s, c) {      // square and diamond
    el("rect", { x: -55, y: -55, width: 110, height: 110, fill: c, transform: `rotate(${45 * s})`, ...STROKE }, g); } },
  { states: 2, color: "#a9dcf5", alt: "#f6a9c9", draw(g, s, c) {      // standing and lying rectangle
    el("rect", { x: -32, y: -70, width: 64, height: 140, fill: c, transform: `rotate(${90 * s})`, ...STROKE }, g); } },
  { states: 4, color: "#fbb817", draw(g, s, c) {                      // dot walking round the corners
    el("rect", { x: -62, y: -62, width: 124, height: 124, fill: c, ...STROKE }, g);
    const [dx, dy] = [[-1, -1], [1, -1], [1, 1], [-1, 1]][s];
    el("circle", { cx: dx * 40, cy: dy * 40, r: 13, fill: "#1d1d1d" }, g); } },
  { states: 3, color: "#c4d93a", draw(g, s, c) {                      // line through the triangle turning
    el("polygon", { points: "0,-70 72,55 -72,55", fill: c, ...STROKE }, g);
    const v = [[0, -70], [72, 55], [-72, 55]], a = v[s], b = v[(s + 1) % 3], o = v[(s + 2) % 3];
    el("path", { d: `M${a[0]} ${a[1]} L${(b[0] + o[0]) / 2} ${(b[1] + o[1]) / 2}`, stroke: "#1d1d1d", "stroke-width": 9, "stroke-linecap": "round" }, g); } },
  { states: 4, color: "#ee4035", draw(g, s, c) {                      // T turning a quarter at a time
    el("path", { d: "M-70 -60 H70 V-26 H17 V72 H-17 V-26 H-70 Z", fill: c, transform: `rotate(${90 * s})`, ...STROKE }, g); } },
  { states: 4, color: "#3aa35a", draw(g, s, c) {                      // arrow turning a quarter at a time
    el("path", { d: "M-70 -18 H18 V-52 L72 0 L18 52 V18 H-70 Z", fill: c, transform: `rotate(${90 * s})`, ...STROKE }, g); } },
];

const ROW_X = [230, 490, 750, 1010], ROW_Y = 270, CELL = 210;
const CARD_X = [330, 650, 970], CARD_Y = 650, CARD = 230;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

let order = [], round = 0, busy = false;

// saved: the order of the rows and how far the class got, from an earlier visit.
function start(saved) {
  doneEl.hidden = true;
  if (saved?.order?.length === PATTERNS.length) {
    round = saved.round;
    order = saved.order.map(i => PATTERNS[i]);
  } else {
    round = 0;
    order = shuffle(PATTERNS.slice());
  }
  next();
}

function save() { store.set({ order: order.map(p => PATTERNS.indexOf(p)), round }); }

function next() {
  busy = false;
  rowG.replaceChildren(); cardsG.replaceChildren();
  scoreEl.textContent = `${round} / ${order.length}`;
  if (round === order.length) { doneEl.hidden = false; say("Tú sást", "mynstrini!"); return; }
  say("Hvat kemur", "so?");
  const p = order[round];
  const k0 = Math.floor(Math.random() * p.states);
  const state = k => (k0 + k) % p.states;
  for (let k = 0; k < 3; k++) p.draw(el("g", { transform: `translate(${ROW_X[k]} ${ROW_Y})` }, rowG), state(k), p.color);
  const slot = el("rect", { class: "slot", x: ROW_X[3] - CELL / 2, y: ROW_Y - CELL / 2, width: CELL, height: CELL, rx: 18 }, rowG);
  const q = el("text", { class: "qmark", x: ROW_X[3], y: ROW_Y + 6 }, rowG);
  q.textContent = "?";

  // The answer and two wrong ones: other states, or the right state in the wrong colour.
  const answer = { s: state(3), c: p.color };
  const wrong = [];
  for (let s = 0; s < p.states; s++) if (s !== answer.s) wrong.push({ s, c: p.color });
  if (p.alt) wrong.push({ s: answer.s, c: p.alt });
  const options = shuffle([answer, ...shuffle(wrong).slice(0, 2)]);
  options.forEach((o, i) => {
    const g = el("g", { class: "card", role: "button", "aria-label": `Møguleiki ${i + 1}` }, cardsG);
    el("rect", { x: CARD_X[i] - CARD / 2, y: CARD_Y - CARD / 2, width: CARD, height: CARD, rx: 22 }, g);
    p.draw(el("g", { transform: `translate(${CARD_X[i]} ${CARD_Y})` }, g), o.s, o.c);
    g.addEventListener("click", () => choose(g, o === answer, p, answer, slot, q));
  });
}

function choose(g, ok, p, answer, slot, q) {
  if (busy) return;
  if (ok) {
    busy = true;
    q.remove();
    slot.classList.add("right");
    p.draw(el("g", { transform: `translate(${ROW_X[3]} ${ROW_Y})` }, rowG), answer.s, answer.c);
    el("text", { class: "check", x: ROW_X[3] + 130, y: ROW_Y + 20 }, rowG).textContent = "✓";
    say("Ja! Tað", "er rætt.");
    round++;
    save();
    setTimeout(next, 1500);
  } else {
    g.classList.remove("shake"); void g.getBBox(); g.classList.add("shake", "wrong");
    say("Hygg eftir,", "hvussu tað broytist.");
  }
}

document.getElementById("again").addEventListener("click", () => { store.clear(); start(); save(); });
doneEl.addEventListener("click", () => { doneEl.hidden = true; });
start(store.get());
save();

// Opened inside the start page, "home" asks that page to close the game, so the address bar keeps showing Snar.
let embedded = false;
window.addEventListener("message", ev => { if (ev.data === "rokning-spol:hello") embedded = true; });
document.getElementById("home").addEventListener("click", ev => {
  if (!embedded) return;
  ev.preventDefault();
  parent.postMessage("rokning-spol:home", "*");
});

// Full screen for the classroom screen; hidden where the browser does not allow it.
const fullBtn = document.getElementById("full");
const FULL_ON = "M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5", FULL_OFF = "M3 8h5V3m8 0v5h5M3 16h5v5m13-5h-5v5";
if (document.fullscreenEnabled) {
  fullBtn.addEventListener("click", () => {
    (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
  });
  document.addEventListener("fullscreenchange", () => {
    const on = !!document.fullscreenElement;
    fullBtn.querySelector("path").setAttribute("d", on ? FULL_OFF : FULL_ON);
    fullBtn.title = on ? "Far úr fullum skermi" : "Fullur skermur";
    fullBtn.setAttribute("aria-label", fullBtn.title);
  });
} else fullBtn.hidden = true;
</script>
