<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tølini 4−6 – góðgætispostar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
  /* Layout: classroom screen — one landscape book page filling the viewport: header row, scattered sweets above three numbered bags, green footer band like Rokning 1 */
  :root {
    color-scheme: light;
    --paper: #fffdf8;
    --ink: #24303f;
    --pencil: #2c3f9e;
    --chapter: #a9739f;
    --leaf: #7fae3a;
    --wrong: #d23a2f;
    --font: "Andika", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--paper); color: var(--ink); }
  body { margin: 0; font-family: var(--font); overflow: hidden; }
  .page {
    height: 100%; box-sizing: border-box;
    padding-block: 1.2vh 1vh;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 1vh;
  }
  header { display: flex; align-items: center; gap: clamp(12px, 1.5vw, 28px); flex-wrap: wrap; }
  .num {
    width: clamp(48px, 5vw, 84px); aspect-ratio: 1; border-radius: 50%; flex: none;
    background: var(--chapter); color: #fff;
    display: grid; place-items: center; font-size: clamp(28px, 3.2vw, 54px); font-weight: 700;
  }
  h1 { margin: 0; font-size: clamp(28px, 3.4vw, 58px); letter-spacing: .02em; }
  .book { flex: none; padding: .15em .7em; border-radius: 999px; background: #eef2f6; color: var(--ink);
    font-size: clamp(14px, 1.4vw, 24px); font-weight: 700; letter-spacing: .03em; white-space: nowrap; }
  .task { margin: 0; font-size: clamp(18px, 2.2vw, 38px); line-height: 1.25; flex: 1 1 320px; min-width: 0; }
  .tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  .stars { font-size: clamp(18px, 1.8vw, 32px); font-weight: 700; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-size: clamp(16px, 1.5vw, 26px); font-weight: 700; cursor: pointer;
    border: 3px solid var(--leaf); background: #fff; color: var(--ink);
    padding: .3em .9em; border-radius: 999px;
  }
  button:hover { background: #f1f7e4; }
  button:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home { display: grid; place-items: center; padding: .3em .45em; align-self: stretch; border: 3px solid var(--leaf);
    border-radius: 999px; background: #fff; color: var(--ink); font-size: clamp(16px, 1.5vw, 26px); }
  a.home:hover { background: #f1f7e4; }
  a.home:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  button.icon { display: grid; place-items: center; padding: .3em .45em; align-self: stretch; }
  button.icon svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stage { position: relative; min-height: 0; }
  svg#board { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  .candy { cursor: grab; }
  .candy.dragging { cursor: grabbing; }
  .candy.in { cursor: default; pointer-events: none; }
  .candy .wrap { stroke: rgba(40, 40, 60, .35); stroke-width: 2; }
  .candy .stripe { fill: #fff; }
  .shake { animation: shake .45s; }
  @keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
  .bag .front { stroke: rgba(0, 0, 0, .25); stroke-width: 3; }
  .bag text { font-size: 120px; text-anchor: middle; dominant-baseline: central; fill: var(--ink); }
  .bag.hot .front { stroke: var(--pencil); stroke-width: 8; }
  .done-msg {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
    margin: 0; padding: .6em 1.2em; border-radius: 20px; max-width: 90%;
    background: #f1f7e4; border: 5px solid var(--leaf);
    font-size: clamp(24px, 3.4vw, 60px); font-weight: 700; text-align: center;
    box-shadow: 0 10px 40px rgba(60, 80, 30, .25);
  }
  footer { display: flex; align-items: center; gap: 12px; border-top: 3px solid var(--leaf); padding-top: .5vh; font-size: clamp(13px, 1.1vw, 20px); }
  footer .pg { width: 2em; height: 2em; border-radius: 50%; border: 3px solid var(--leaf); display: grid; place-items: center; font-weight: 700; flex: none; }
  footer .tab { margin-left: auto; background: #dbe9b8; padding: 2px 12px; }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
</style>
</head>

<script>
// Progress is kept in this browser only, so the class can leave mid-game and carry on later.
const SAVE_KEY = "rokning-spol/kapittul-5";
const store = {
  get() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(v)); } catch (e) {} },
  clear() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} },
};

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("board");
const bagsG = document.getElementById("bags");
const candiesG = document.getElementById("candies");
const scoreEl = document.getElementById("score");
const doneEl = document.getElementById("done");

// The three bags from page 37: yellow 4, red 5, green 6.
const BW = 210, BH = 230, BY = 630;
const BAGS = [
  { n: 4, x: 395,  color: "#f6d21c", dark: "#d9a90f" },
  { n: 5, x: 695,  color: "#ee4a3a", dark: "#c22f22" },
  { n: 6, x: 995,  color: "#b7d334", dark: "#8fae1c" },
];

const COLORS = ["#b58ac8", "#7cc2e8", "#eeae00", "#f297bb", "#a9c62a"];

// Sweets are scattered over a 4 × 3 grid above the bags.
const SLOTS = [];
for (const y of [100, 290, 480]) for (const x of [230, 610, 990, 1370]) SLOTS.push([x, y]);

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

BAGS.forEach(b => {
  const g = el("g", { class: "bag" }, bagsG);
  el("ellipse", { cx: b.x + BW / 2, cy: BY + BH + 4, rx: BW * .75, ry: 26, fill: "#dceef7" }, g);
  // back flap, where sweets land
  el("path", { d: `M${b.x + 10} ${BY + 30} L${b.x + 40} ${BY} L${b.x + BW - 40} ${BY} L${b.x + BW - 10} ${BY + 30} Z`, fill: b.dark }, g);
  b.inside = el("g", {}, g);
  el("path", { class: "front", d: `M${b.x} ${BY + 30} l35 -18 l35 18 l35 -18 l35 18 l35 -18 l35 18 V${BY + BH} H${b.x} Z`, fill: b.color }, g);
  el("text", { x: b.x + BW / 2, y: BY + 135 }, g).textContent = b.n;
  b.g = g;
});

function drawCandy(parent, n, color) {
  const g = el("g", {}, parent);
  // twisted ends
  el("path", { class: "wrap", d: "M-80 0 L-135 -38 Q-122 0 -135 38 Z", fill: color }, g);
  el("path", { class: "wrap", d: "M80 0 L135 -38 Q122 0 135 38 Z", fill: color }, g);
  el("rect", { class: "wrap", x: -88, y: -30, width: 176, height: 60, rx: 22, fill: color }, g);
  // n white stripes, evenly spaced and slanted
  const step = 150 / n;
  for (let i = 0; i < n; i++) {
    const x = -75 + step * (i + .5);
    el("path", { class: "stripe", d: `M${x - 3} -26 h11 l-10 52 h-11 Z` }, g);
  }
  return g;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

let state = [];

function place(item, x, y, rot, scale = 1) {
  item.cx = x; item.cy = y;
  item.g.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot}) scale(${scale})`);
}

let drops = 0;  // order the sweets went into the bags, so a saved game refills them the same way

// saved: each sweet and which are in a bag, from an earlier visit.
function start(saved) {
  candiesG.replaceChildren();
  BAGS.forEach(b => b.inside.replaceChildren());
  doneEl.hidden = true;
  drops = 0;
  const counts = shuffle([4, 4, 4, 4, 5, 5, 5, 5, 6, 6, 6, 6]);
  const sweets = saved?.sweets?.length === SLOTS.length
    ? saved.sweets
    : SLOTS.map(([sx, sy], i) => ({
        n: counts[i], color: COLORS[Math.floor(Math.random() * COLORS.length)], rot: Math.round(Math.random() * 70 - 35),
        home: [Math.round(sx + Math.random() * 60 - 30), Math.round(sy + Math.random() * 40 - 20)], dropped: 0,
      }));
  state = sweets.map(s => {
    const g = el("g", { class: "candy" }, candiesG);
    const inner = el("g", {}, g);
    drawCandy(inner, s.n, s.color);
    const item = { n: s.n, color: s.color, rot: s.rot, home: s.home, g, inner, done: false, dropped: 0 };
    place(item, ...item.home, item.rot);
    g.addEventListener("pointerdown", ev => begin(ev, item));
    return item;
  });
  // Put saved sweets back in their bags, in the order they were dropped.
  sweets.map((s, i) => [s.dropped, state[i]]).filter(([d]) => d > 0).sort((a, b) => a[0] - b[0])
    .forEach(([, item]) => drop(item, BAGS.find(b => b.n === item.n)));
  updateScore();
}

function save() {
  store.set({ sweets: state.map(({ n, color, rot, home, dropped }) => ({ n, color, rot, home, dropped })) });
}

// The sweet drops into the bag and sticks out over the edge.
function drop(item, bag) {
  item.done = true;
  item.dropped = ++drops;
  item.g.classList.add("in");
  bag.inside.appendChild(item.g);
  const k = bag.inside.children.length - 1;
  place(item, bag.x + 45 + (k % 4) * 40, BY + 8 - Math.floor(k / 4) * 14, -70 + (k % 4) * 45, .42);
}

function toSvg(ev) {
  const p = svg.createSVGPoint();
  p.x = ev.clientX; p.y = ev.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}

function bagAt(pt) {
  return BAGS.find(b => pt.x >= b.x - 30 && pt.x <= b.x + BW + 30 && pt.y >= BY - 60 && pt.y <= BY + BH + 20);
}

let drag = null;

function begin(ev, item) {
  if (item.done) return;
  ev.preventDefault();
  svg.setPointerCapture(ev.pointerId);
  const p = toSvg(ev);
  drag = { item, dx: item.cx - p.x, dy: item.cy - p.y };
  candiesG.appendChild(item.g);  // bring to front
  item.g.classList.add("dragging");
}

svg.addEventListener("pointermove", ev => {
  if (!drag) return;
  const p = toSvg(ev);
  place(drag.item, p.x + drag.dx, p.y + drag.dy, drag.item.rot);
  const over = bagAt(p);
  BAGS.forEach(b => b.g.classList.toggle("hot", b === over));
});

function finish(ev) {
  if (!drag) return;
  const { item } = drag; drag = null;
  item.g.classList.remove("dragging");
  BAGS.forEach(b => b.g.classList.remove("hot"));
  const bag = bagAt(toSvg(ev));
  if (bag && bag.n === item.n) {
    drop(item, bag);
    updateScore();
    save();
  } else {
    place(item, ...item.home, item.rot);
    if (bag) { item.inner.classList.remove("shake"); void item.inner.getBBox(); item.inner.classList.add("shake"); }
  }
}
svg.addEventListener("pointerup", finish);
svg.addEventListener("pointercancel", () => { if (drag) { place(drag.item, ...drag.item.home, drag.item.rot); drag = null; } });

function updateScore() {
  const n = state.filter(a => a.done).length;
  scoreEl.textContent = `${n} / ${state.length}`;
  doneEl.hidden = n !== state.length;
}

document.getElementById("again").addEventListener("click", () => { store.clear(); start(); save(); });
doneEl.addEventListener("click", () => { doneEl.hidden = true; });
start(store.get());
save();
// Opened inside the start page, "home" asks that page to close the game, so the address bar keeps showing Snar.
let embedded = false;
window.addEventListener("message", ev => { if (ev.data === "rokning-spol:hello") embedded = true; });
document.getElementById("home").addEventListener("click", ev => {
  if (!embedded) return;
  ev.preventDefault();
  parent.postMessage("rokning-spol:home", "*");
});

// Full screen for the classroom screen; hidden where the browser does not allow it.
const fullBtn = document.getElementById("full");
const FULL_ON = "M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5", FULL_OFF = "M3 8h5V3m8 0v5h5M3 16h5v5m13-5h-5v5";
if (document.fullscreenEnabled) {
  fullBtn.addEventListener("click", () => {
    (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
  });
  document.addEventListener("fullscreenchange", () => {
    const on = !!document.fullscreenElement;
    fullBtn.querySelector("path").setAttribute("d", on ? FULL_OFF : FULL_ON);
    fullBtn.title = on ? "Far úr fullum skermi" : "Fullur skermur";
    fullBtn.setAttribute("aria-label", fullBtn.title);
  });
} else fullBtn.hidden = true;
</script>
<script src="toolbox.js"></script>
</body>
