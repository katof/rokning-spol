<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vit skilja – dýragarðurin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
  /* Layout: classroom screen — one landscape book page filling the viewport: header row, watercolour zoo, green footer band like Rokning 1 */
  :root {
    color-scheme: light;
    --paper: #fffdf8;
    --ink: #24303f;
    --pencil: #2c3f9e;
    --chapter: #ec6a26;
    --leaf: #7fae3a;
    --wrong: #d23a2f;
    --font: "Andika", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--paper); color: var(--ink); }
  body { margin: 0; font-family: var(--font); overflow: hidden; }
  .page {
    height: 100%; box-sizing: border-box;
    padding-block: 1.2vh 1vh;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 1vh;
  }
  header { display: flex; align-items: center; gap: clamp(12px, 1.5vw, 28px); flex-wrap: wrap; }
  .num {
    width: clamp(48px, 5vw, 84px); aspect-ratio: 1; border-radius: 50%; flex: none;
    background: var(--chapter); color: #fff;
    display: grid; place-items: center; font-size: clamp(28px, 3.2vw, 54px); font-weight: 700;
  }
  h1 { margin: 0; font-size: clamp(28px, 3.4vw, 58px); letter-spacing: .02em; }
  .book { flex: none; padding: .15em .7em; border-radius: 999px; background: #eef2f6; color: var(--ink);
    font-size: clamp(14px, 1.4vw, 24px); font-weight: 700; letter-spacing: .03em; white-space: nowrap; }
  .task { margin: 0; font-size: clamp(18px, 2.2vw, 38px); line-height: 1.25; flex: 1 1 320px; min-width: 0; }
  .tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  .stars { font-size: clamp(18px, 1.8vw, 32px); font-weight: 700; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-size: clamp(16px, 1.5vw, 26px); font-weight: 700; cursor: pointer;
    border: 3px solid var(--leaf); background: #fff; color: var(--ink);
    padding: .3em .9em; border-radius: 999px;
  }
  button:hover { background: #f1f7e4; }
  button:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home { display: grid; place-items: center; padding: .3em .45em; align-self: stretch; border: 3px solid var(--leaf);
    border-radius: 999px; background: #fff; color: var(--ink); font-size: clamp(16px, 1.5vw, 26px); }
  a.home:hover { background: #f1f7e4; }
  a.home:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stage { position: relative; min-height: 0; }
  svg#zoo { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  .animal { cursor: grab; }
  .animal text { font-size: 100px; dominant-baseline: central; text-anchor: middle; }
  .animal.done { cursor: default; }
  .animal.done text { opacity: .55; }
  .animal.shake { animation: shake .45s; }
  @keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
  .house.hot .body { stroke: var(--pencil); stroke-width: 6; }
  .line { fill: none; stroke: var(--pencil); stroke-width: 9; stroke-linecap: round; opacity: .9; }
  .line.wrong { stroke: var(--wrong); transition: opacity .6s .3s; opacity: 0; }
  .check { font-size: 48px; fill: var(--leaf); font-weight: 700; }
  .done-msg {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    margin: 0; padding: .6em 1.2em; border-radius: 20px; max-width: 90%;
    background: #f1f7e4; border: 5px solid var(--leaf);
    font-size: clamp(24px, 3.4vw, 60px); font-weight: 700; text-align: center;
    box-shadow: 0 10px 40px rgba(60, 80, 30, .25);
  }
  footer { display: flex; align-items: center; gap: 12px; border-top: 3px solid var(--leaf); padding-top: .5vh; font-size: clamp(13px, 1.1vw, 20px); }
  footer .pg { width: 2em; height: 2em; border-radius: 50%; border: 3px solid var(--leaf); display: grid; place-items: center; font-weight: 700; flex: none; }
  footer .tab { margin-left: auto; background: #dbe9b8; padding: 2px 12px; }
  /* the sheep: tap it for a funny reaction, drag from it like any other animal */
  .sheep .pic { transform-box: fill-box; transform-origin: 50% 100%; }
  .sheep .pic.wiggle { animation: wiggle .7s; }
  .sheep .pic.jump { animation: jump .8s; }
  .sheep .pic.squash { animation: squash .8s; }
  @keyframes wiggle { 20% { transform: rotate(-10deg); } 40% { transform: rotate(9deg); } 60% { transform: rotate(-7deg); } 80% { transform: rotate(5deg); } }
  @keyframes jump { 25% { transform: translateY(-45px); } 50% { transform: translateY(0); } 70% { transform: translateY(-20px); } }
  @keyframes squash { 30% { transform: scale(1.16, .8); } 60% { transform: scale(.9, 1.12); } }
  .say { opacity: 0; transition: opacity .2s; pointer-events: none; }
  .say.on { opacity: 1; }
  .say rect, .say path { fill: #fff; stroke: #3b4450; stroke-width: 3; }
  .say text { font-size: 32px; font-weight: 700; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
  @media (prefers-reduced-motion: reduce) { .animal.shake, .sheep .pic { animation: none !important; } .line.wrong { transition: none; } }
</style>
</head>

        <path d="M1146 62 L1124 74 L1150 80"/>
        <rect x="1145" y="22" width="300" height="88" rx="24"/>
        <path d="M1147 64 V78" stroke="#fff" stroke-width="6"/>

  <footer>
    <span class="pg">2</span>

<script>
// Progress is kept in this browser only, so the class can leave mid-game and carry on later.
const SAVE_KEY = "rokning-spol/kapittul-1";
const store = {
  get() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(v)); } catch (e) {} },
  clear() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} },
};

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("zoo");
const housesG = document.getElementById("houses");
const linesG = document.getElementById("lines");
const animalsG = document.getElementById("animals");
const live = document.getElementById("live");
const scoreEl = document.getElementById("score");
const doneEl = document.getElementById("done");

// Each house is drawn 200×150 at its own origin, then scaled up by S.
const W = 200, H = 150, S = 1.5;
// The four houses, one per corner, as on page 2 of the book.
const HOUSES = [
  { id: "fuglar",  name: "Fuglahúsið",     x: 40,   y: 190, flag: "🐦", body: "#cfe3c6", roof: "#c9a05a", wall: "url(#mesh)", dome: true },
  { id: "fiskar",  name: "Fiskahúsið",     x: 1250, y: 190, flag: "🐟", body: "#bcdcf0", roof: "#f0c75a", wall: "water" },
  { id: "sugdyr",  name: "Súgdýrahúsið",   x: 40,   y: 650, flag: "🐘", body: "#f3d2c4", roof: "#e6c48a", wall: "url(#bars)" },
  { id: "skridyr", name: "Skriðdýrahúsið", x: 1250, y: 650, flag: "🐊", body: "#f6e7a6", roof: "#e3c070", wall: "glass" },
];

const ANIMALS = [
  { e: "🦩", h: "fuglar" }, { e: "🦜", h: "fuglar" }, { e: "🦉", h: "fuglar" },
  { e: "🦈", h: "fiskar" }, { e: "🐠", h: "fiskar" }, { e: "🐡", h: "fiskar" },
  { e: "🦁", h: "sugdyr" }, { e: "🦓", h: "sugdyr" }, { e: "🦒", h: "sugdyr" },
  { e: "🐍", h: "skridyr" }, { e: "🐢", h: "skridyr" }, { e: "🦎", h: "skridyr" },
];

// Open grass between the houses; 12 of these 14 are used each round.
const SPOTS = [
  [480, 240], [700, 260], [920, 240], [1130, 260],
  [130, 510], [380, 480], [620, 510], [860, 480], [1100, 510], [1460, 500],
  [480, 740], [700, 720], [920, 740], [1130, 720],
];

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function drawHouse(h) {
  const g = el("g", { class: "house", transform: `translate(${h.x} ${h.y}) scale(${S})` }, housesG);
  el("title", {}, g).textContent = h.name;
  const wc = el("g", { filter: "url(#wc)" }, g);
  // flag
  el("path", { d: "M150 -10 V-95", stroke: "#8a6d4a", "stroke-width": 4 }, wc);
  el("rect", { x: 152, y: -95, width: 54, height: 40, fill: "#fff", stroke: "#9aa", "stroke-width": 2 }, wc);
  // roof
  if (h.dome) el("path", { d: `M-6 10 Q${W / 2} -110 ${W + 6} 10 Z`, fill: h.roof, stroke: "#8a6d4a", "stroke-width": 3 }, wc);
  else el("path", { d: `M-10 10 L30 -50 L${W - 30} -50 L${W + 10} 10 Z`, fill: h.roof, stroke: "#8a6d4a", "stroke-width": 3 }, wc);
  // body
  el("rect", { class: "body", x: 0, y: 10, width: W, height: H - 10, fill: h.body, stroke: "#6d7a6a", "stroke-width": 3 }, wc);
  if (h.wall === "water") {
    el("path", { d: `M0 70 q25 -14 50 0 t50 0 t50 0 t50 0 V${H} H0 Z`, fill: "#5ea6d4", opacity: .75 }, wc);
  } else if (h.wall === "glass") {
    el("rect", { x: 14, y: 28, width: W - 28, height: H - 46, fill: "#e8f6f3", stroke: "#8fb8b0", "stroke-width": 3, opacity: .85 }, wc);
  } else {
    el("rect", { x: 8, y: 18, width: W - 16, height: H - 26, fill: h.wall, opacity: .7 }, wc);
  }
  // window
  el("rect", { x: 120, y: 30, width: 56, height: 50, fill: "#fff", stroke: "#6d7a6a", "stroke-width": 3 }, wc);
  el("path", { d: "M148 30 V80 M120 55 H176", stroke: "#6d7a6a", "stroke-width": 2 }, wc);
  // flag symbol + resident
  el("text", { x: 179, y: -74, "font-size": 30, "text-anchor": "middle", "dominant-baseline": "central" }, g).textContent = h.flag;
  el("text", { x: 60, y: 95, "font-size": 58, "text-anchor": "middle", "dominant-baseline": "central" }, g).textContent = h.flag;
  h.g = g;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

let state = [];

// saved: where each animal stood and which are home, from an earlier visit.
function start(saved) {
  linesG.replaceChildren(); animalsG.replaceChildren();
  doneEl.hidden = true;
  const spots = shuffle(SPOTS.slice());
  const animals = saved?.animals?.length === ANIMALS.length
    ? saved.animals
    : shuffle(ANIMALS.slice()).map((a, i) => ({ ...a, x: spots[i][0], y: spots[i][1], done: false }));
  state = animals.map(a => {
    const { x, y } = a;
    const g = el("g", { class: "animal" }, animalsG);
    el("circle", { cx: x, cy: y, r: 66, fill: "transparent" }, g);
    el("text", { x, y }, g).textContent = a.e;
    const item = { e: a.e, h: a.h, x, y, g, done: false };
    g.addEventListener("pointerdown", ev => begin(ev, item));
    return item;
  });
  // The sheep by the gate is a mammal too, so it needs a line to the mammal house.
  const g = el("g", { class: "animal sheep" }, animalsG);
  el("circle", { cx: 1050, cy: 95, r: 85, fill: "transparent" }, g);
  g.appendChild(sheepPic);
  sheepPic.classList.remove("wiggle", "jump", "squash");
  const sheep = { h: "sugdyr", x: 1050, y: 100, g, done: false, sheep: true };
  g.addEventListener("pointerdown", ev => begin(ev, sheep));
  state.push(sheep);
  if (saved) {
    state.forEach((item, i) => {
      if (item.sheep ? saved.sheep : animals[i].done) home(item, HOUSES.find(h => h.id === item.h));
    });
  }
  updateScore();
}

function save() {
  store.set({
    animals: state.filter(a => !a.sheep).map(({ e, h, x, y, done }) => ({ e, h, x, y, done })),
    sheep: state.find(a => a.sheep).done,
  });
}

// An animal is home: its line stays and it gets a tick.
function home(item, house) {
  const end = { x: house.x + (W / 2) * S, y: house.y + (H / 2 + 20) * S };
  el("path", { class: "line", d: pencil(item.x, item.y, end.x, end.y) }, linesG);
  item.done = true;
  item.g.classList.add("done");
  el("text", { class: "check", x: item.x + 50, y: item.y - 44 }, item.g).textContent = "✓";
}

// Tapping the sheep (without dragging) makes it say something and move.
const sheepPic = document.getElementById("sheep");
const sayG = document.getElementById("say");
const REACTIONS = [
  { text: "Tú kitlar!", anim: "wiggle" },
  { text: "Mæææ!", anim: "jump" },
  { text: "Nú bleiv eg kløkk!", anim: "squash" },
];
let reaction = 0, sayTimer = 0;

function tickle() {
  const r = REACTIONS[reaction++ % REACTIONS.length];
  document.getElementById("sayText").textContent = r.text;
  sayG.classList.add("on");
  sheepPic.classList.remove("wiggle", "jump", "squash"); void sheepPic.getBBox(); sheepPic.classList.add(r.anim);
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => sayG.classList.remove("on"), 1800);
}

function toSvg(ev) {
  const p = svg.createSVGPoint();
  p.x = ev.clientX; p.y = ev.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}

function houseAt(pt) {
  return HOUSES.find(h => pt.x >= h.x - 20 && pt.x <= h.x + W * S + 20 && pt.y >= h.y - 80 && pt.y <= h.y + H * S + 20);
}

// A slightly wobbly pencil stroke between two points.
function pencil(x1, y1, x2, y2) {
  const mx = (x1 + x2) / 2 + (y2 - y1) * 0.06, my = (y1 + y2) / 2 - (x2 - x1) * 0.06;
  return `M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}`;
}

let drag = null, dragFrom = null;

function begin(ev, item) {
  if (item.done) { if (item.sheep) tickle(); return; }
  ev.preventDefault();
  svg.setPointerCapture(ev.pointerId);
  drag = item;
  dragFrom = toSvg(ev);
  live.setAttribute("d", "");
}

svg.addEventListener("pointermove", ev => {
  if (!drag) return;
  const p = toSvg(ev);
  live.setAttribute("d", pencil(drag.x, drag.y, p.x, p.y));
  const over = houseAt(p);
  HOUSES.forEach(h => h.g.classList.toggle("hot", h === over));
});

function finish(ev) {
  if (!drag) return;
  const item = drag; drag = null;
  HOUSES.forEach(h => h.g.classList.remove("hot"));
  const p = toSvg(ev);
  live.setAttribute("d", "");
  if (item.sheep && Math.hypot(p.x - dragFrom.x, p.y - dragFrom.y) < 15) { tickle(); return; }
  const target = houseAt(p);
  if (!target) return;
  if (target.id === item.h) {
    home(item, target);
    updateScore();
    save();
  } else {
    const end = { x: target.x + (W / 2) * S, y: target.y + (H / 2 + 20) * S };
    const line = el("path", { class: "line", d: pencil(item.x, item.y, end.x, end.y) }, linesG);
    requestAnimationFrame(() => line.classList.add("wrong"));
    setTimeout(() => line.remove(), 1000);
    item.g.classList.remove("shake"); void item.g.getBBox(); item.g.classList.add("shake");
  }
}
svg.addEventListener("pointerup", finish);
svg.addEventListener("pointercancel", () => { drag = null; live.setAttribute("d", ""); });

function updateScore() {
  const n = state.filter(a => a.done).length;
  scoreEl.textContent = `${n} / ${state.length}`;
  doneEl.hidden = n !== state.length;
}

document.getElementById("again").addEventListener("click", () => { store.clear(); start(); save(); });
HOUSES.forEach(drawHouse);
start(store.get());
save();
// Opened inside the start page, "home" asks that page to close the game, so the address bar keeps showing Snar.
let embedded = false;
window.addEventListener("message", ev => { if (ev.data === "rokning-spol:hello") embedded = true; });
document.getElementById("home").addEventListener("click", ev => {
  if (!embedded) return;
  ev.preventDefault();
  parent.postMessage("rokning-spol:home", "*");
});

</script>
<script src="toolbox.js"></script>
