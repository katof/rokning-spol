<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skap og mynstur – lita tekningina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
  /* Layout: classroom screen — one landscape book page filling the viewport: header row, colour palette left of a line drawing built from shapes, green footer band like Rokning 1 */
  :root {
    color-scheme: light;
    --paper: #fffdf8;
    --ink: #24303f;
    --pencil: #2c3f9e;
    --chapter: #44bdc3;
    --leaf: #7fae3a;
    --wrong: #d23a2f;
    --red: #e5262b;
    --green: #b5d334;
    --yellow: #ffe600;
    --blue: #00a6e2;
    --font: "Andika", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--paper); color: var(--ink); }
  body { margin: 0; font-family: var(--font); overflow: hidden; }
  .page {
    height: 100%; box-sizing: border-box;
    padding-block: 1.2vh 1vh;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 1vh;
  }
  header { display: flex; align-items: center; gap: clamp(12px, 1.5vw, 28px); flex-wrap: wrap; }
  .num {
    width: clamp(48px, 5vw, 84px); aspect-ratio: 1; border-radius: 50%; flex: none;
    background: var(--chapter); color: var(--ink);
    display: grid; place-items: center; font-size: clamp(28px, 3.2vw, 54px); font-weight: 700;
  }
  h1 { margin: 0; font-size: clamp(28px, 3.4vw, 58px); letter-spacing: .02em; }
  .book { flex: none; padding: .15em .7em; border-radius: 999px; background: #eef2f6; color: var(--ink);
    font-size: clamp(14px, 1.4vw, 24px); font-weight: 700; letter-spacing: .03em; white-space: nowrap; }
  .task { margin: 0; font-size: clamp(18px, 2.2vw, 38px); line-height: 1.25; flex: 1 1 320px; min-width: 0; }
  .tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  button {
    font: inherit; font-size: clamp(16px, 1.5vw, 26px); font-weight: 700; cursor: pointer;
    border: 3px solid var(--leaf); background: #fff; color: var(--ink);
    padding: .3em .9em; border-radius: 999px;
  }
  button:hover { background: #f1f7e4; }
  button:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home { display: grid; place-items: center; padding: .3em .45em; align-self: stretch; border: 3px solid var(--leaf);
    border-radius: 999px; background: #fff; color: var(--ink); font-size: clamp(16px, 1.5vw, 26px); }
  a.home:hover { background: #f1f7e4; }
  a.home:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stage { position: relative; min-height: 0; }
  svg#art { width: 100%; height: 100%; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .swatch { cursor: pointer; }
  .swatch .pick { fill: transparent; stroke: transparent; stroke-width: 6; }
  .swatch.on .pick { fill: #f1f7e4; stroke: var(--leaf); }
  .swatch text { font-size: 38px; fill: var(--ink); }
  .swatch .sub { font-size: 30px; fill: #5b6672; }
  .shape { fill: #fff; stroke: #3b4450; stroke-width: 3; cursor: pointer; transition: fill .25s; }
  .shape:hover { stroke-width: 5; }
  .shape.circle.filled { fill: var(--red); }
  .shape.square.filled { fill: var(--green); }
  .shape.triangle.filled { fill: var(--yellow); }
  .shape.rect.filled { fill: var(--blue); }
  .shape.filled { cursor: default; }
  .shape.miss { stroke: var(--wrong); stroke-width: 7; animation: blink .5s 2; }
  @keyframes blink { 50% { stroke-opacity: .2; } }
  .hint { font-size: 29px; font-weight: 700; fill: var(--wrong); }
  .progress { font-size: 40px; font-weight: 700; fill: var(--ink); font-variant-numeric: tabular-nums; }
  .done-msg {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    margin: 0; padding: .6em 1.2em; border-radius: 20px; max-width: 90%;
    background: #f1f7e4; border: 5px solid var(--leaf);
    font-size: clamp(24px, 3.4vw, 60px); font-weight: 700; text-align: center;
    box-shadow: 0 10px 40px rgba(60, 80, 30, .25);
  }
  footer { display: flex; align-items: center; gap: 12px; border-top: 3px solid var(--leaf); padding-top: .5vh; font-size: clamp(13px, 1.1vw, 20px); }
  footer .pg { width: 2em; height: 2em; border-radius: 50%; border: 3px solid var(--leaf); display: grid; place-items: center; font-weight: 700; flex: none; }
  footer .tab { margin-left: auto; background: #dbe9b8; padding: 2px 12px; }
  @media (prefers-reduced-motion: reduce) { .shape { transition: none; } .shape.miss { animation: none; } }
</style>
</head>

<script>
// Progress is kept in this browser only, so the class can leave mid-game and carry on later.
const SAVE_KEY = "rokning-spol/kapittul-3";
const store = {
  get() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(v)); } catch (e) {} },
  clear() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} },
};

const NS = "http://www.w3.org/2000/svg";
const paletteG = document.getElementById("palette");
const shapesG = document.getElementById("shapes");
const hintEl = document.getElementById("hint");
const progressEl = document.getElementById("progress");
const doneEl = document.getElementById("done");

const TYPES = {
  circle:   { name: "sirkul",    colour: "reyður", color: "var(--red)",    a: "ein" },
  square:   { name: "kvadrat",   colour: "grønur", color: "var(--green)",  a: "eitt" },
  triangle: { name: "tríkantur", colour: "gulur",  color: "var(--yellow)", a: "ein" },
  rect:     { name: "rektangul", colour: "bláur",  color: "var(--blue)",   a: "eitt" },
};

// The picture: a cat robot with a tree, a sun, bunting and presents. Listed back to front.
const SHAPES = [
  ["circle", 480, 110, 60],                                   // sun
  ["triangle", 1180, 44, 1240, 50, 1210, 110],                // bunting
  ["triangle", 1280, 54, 1340, 54, 1310, 114],
  ["triangle", 1380, 50, 1440, 44, 1410, 108],
  ["rect", 500, 790, 40, 80],                                  // tree trunk
  ["triangle", 420, 790, 520, 580, 620, 790],                  // tree
  ["square", 1300, 750, 120],                                  // presents
  ["square", 1330, 680, 60],
  ["rect", 835, 760, 70, 120],                                 // legs
  ["rect", 1015, 760, 70, 120],
  ["rect", 600, 490, 160, 60],                                 // arms
  ["rect", 1160, 490, 160, 60],
  ["circle", 580, 520, 42],                                    // hands
  ["circle", 1340, 520, 42],
  ["rect", 760, 470, 400, 290],                                // body
  ["circle", 960, 545, 50],                                    // buttons
  ["circle", 960, 685, 50],
  ["rect", 952, 80, 16, 70],                                   // antenna
  ["circle", 960, 70, 20],
  ["triangle", 810, 150, 870, 45, 930, 150],                   // ears
  ["triangle", 990, 150, 1050, 45, 1110, 150],
  ["square", 810, 150, 300],                                   // head
  ["circle", 885, 250, 42],                                    // eyes
  ["circle", 1035, 250, 42],
  ["triangle", 935, 335, 960, 290, 985, 335],                  // nose
  ["rect", 880, 375, 160, 32],                                 // mouth
];

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function shapeEl(type, v, parent, cls) {
  if (type === "circle") return el("circle", { class: cls, cx: v[0], cy: v[1], r: v[2] }, parent);
  if (type === "triangle") return el("polygon", { class: cls, points: `${v[0]},${v[1]} ${v[2]},${v[3]} ${v[4]},${v[5]}` }, parent);
  if (type === "square") return el("rect", { class: cls, x: v[0], y: v[1], width: v[2], height: v[2] }, parent);
  return el("rect", { class: cls, x: v[0], y: v[1], width: v[2], height: v[3] }, parent);
}

// Palette: one swatch per shape, in the order the book gives them.
let current = "circle";
const swatches = {};
Object.entries(TYPES).forEach(([type, t], i) => {
  const y = 20 + i * 175;
  const g = el("g", { class: "swatch", role: "button", "aria-label": `${t.name}, ${t.colour}` }, paletteG);
  el("rect", { class: "pick", x: 10, y, width: 340, height: 160, rx: 18 }, g);
  const icon = {
    circle: [90, y + 80, 52],
    square: [40, y + 30, 100],
    triangle: [32, y + 135, 90, y + 25, 148, y + 135],
    rect: [22, y + 50, 136, 60],
  }[type];
  shapeEl(type, icon, g).setAttribute("style", `fill:${t.color};stroke:#3b4450;stroke-width:3`);
  el("text", { x: 175, y: y + 72 }, g).textContent = t.name;
  el("text", { class: "sub", x: 175, y: y + 115 }, g).textContent = t.colour;
  g.addEventListener("click", () => select(type));
  swatches[type] = g;
});

function select(type) {
  current = type;
  for (const k in swatches) swatches[k].classList.toggle("on", k === type);
  hintEl.textContent = "";
}

let items = [];

// saved: which shapes are coloured, from an earlier visit.
function start(saved) {
  shapesG.replaceChildren();
  doneEl.hidden = true;
  hintEl.textContent = "";
  items = SHAPES.map(([type, ...v], i) => {
    const node = shapeEl(type, v, shapesG, `shape ${type}`);
    const item = { type, node, filled: !!saved?.filled?.[i] };
    if (item.filled) node.classList.add("filled");
    node.addEventListener("click", () => paint(item));
    return item;
  });
  select("circle");
  update();
}

function save() { store.set({ filled: items.map(i => i.filled) }); }

function paint(item) {
  if (item.filled) return;
  if (item.type === current) {
    item.filled = true;
    item.node.classList.add("filled");
    hintEl.textContent = "";
    update();
    save();
  } else {
    const t = TYPES[item.type];
    hintEl.textContent = `Hetta er ${t.a} ${t.name}.`;
    item.node.classList.remove("miss"); void item.node.getBBox(); item.node.classList.add("miss");
    setTimeout(() => item.node.classList.remove("miss"), 1000);
  }
}

function update() {
  const n = items.filter(i => i.filled).length;
  progressEl.textContent = `${n} / ${items.length}`;
  doneEl.hidden = n !== items.length;
}

document.getElementById("again").addEventListener("click", () => { store.clear(); start(); save(); });
doneEl.addEventListener("click", () => { doneEl.hidden = true; });
start(store.get());
save();
// Opened inside the start page, "home" asks that page to close the game, so the address bar keeps showing Snar.
let embedded = false;
window.addEventListener("message", ev => { if (ev.data === "rokning-spol:hello") embedded = true; });
document.getElementById("home").addEventListener("click", ev => {
  if (!embedded) return;
  ev.preventDefault();
  parent.postMessage("rokning-spol:home", "*");
});

</script>
