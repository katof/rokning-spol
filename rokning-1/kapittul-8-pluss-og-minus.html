<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pluss og minus – fiskar og kakur</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
  /* Layout: classroom screen — one landscape book page filling the viewport: header row, a picture to count (two fish bowls or a plate of cakes), the sum with three boxes beneath it, number tiles along the bottom, a sheep with a speech bubble at the right, green footer band like Rokning 1 */
  :root {
    color-scheme: light;
    --paper: #fffdf8;
    --ink: #24303f;
    --pencil: #2c3f9e;
    --chapter: #f7941d;
    --leaf: #7fae3a;
    --wrong: #d23a2f;
    --font: "Andika", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--paper); color: var(--ink); }
  body { margin: 0; font-family: var(--font); overflow: hidden; }
  .page {
    height: 100%; box-sizing: border-box;
    padding-block: 1.2vh 1vh;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 1vh;
  }
  header { display: flex; align-items: center; gap: clamp(12px, 1.5vw, 28px); flex-wrap: wrap; }
  .num {
    width: clamp(48px, 5vw, 84px); aspect-ratio: 1; border-radius: 50%; flex: none;
    background: var(--chapter); color: var(--ink);
    display: grid; place-items: center; font-size: clamp(28px, 3.2vw, 54px); font-weight: 700;
  }
  h1 { margin: 0; font-size: clamp(28px, 3.4vw, 58px); letter-spacing: .02em; }
  .book { flex: none; padding: .15em .7em; border-radius: 999px; background: #eef2f6; color: var(--ink);
    font-size: clamp(14px, 1.4vw, 24px); font-weight: 700; letter-spacing: .03em; white-space: nowrap; }
  .task { margin: 0; font-size: clamp(18px, 2.2vw, 38px); line-height: 1.25; flex: 1 1 320px; min-width: 0; }
  .tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  .stars { font-size: clamp(18px, 1.8vw, 32px); font-weight: 700; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-size: clamp(16px, 1.5vw, 26px); font-weight: 700; cursor: pointer;
    border: 3px solid var(--leaf); background: #fff; color: var(--ink);
    padding: .3em .9em; border-radius: 999px;
  }
  button:hover { background: #f1f7e4; }
  button:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home { display: grid; place-items: center; padding: .3em .45em; align-self: stretch; border: 3px solid var(--leaf);
    border-radius: 999px; background: #fff; color: var(--ink); font-size: clamp(16px, 1.5vw, 26px); }
  a.home:hover { background: #f1f7e4; }
  a.home:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  button.icon { display: grid; place-items: center; padding: .3em .45em; align-self: stretch; }
  button.icon svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stage { position: relative; min-height: 0; }
  svg#board { width: 100%; height: 100%; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .emoji { dominant-baseline: central; text-anchor: middle; }
  .eaten { opacity: .25; }
  .op { font-size: 110px; text-anchor: middle; dominant-baseline: central; fill: var(--ink); }
  .slot { cursor: pointer; }
  .slot rect { fill: #fff; stroke: #9ec3e6; stroke-width: 4; }
  .slot.active rect { stroke: var(--pencil); stroke-width: 8; }
  .slot.right rect { stroke: var(--leaf); stroke-width: 8; fill: #f3f8e8; }
  .slot.wrong rect { stroke: var(--wrong); stroke-width: 8; fill: #fdf0ee; }
  .slot text { font-size: 100px; text-anchor: middle; dominant-baseline: central; fill: var(--ink); font-variant-numeric: tabular-nums; }
  .tile { cursor: pointer; }
  .tile rect { fill: #fff8e8; stroke: var(--chapter); stroke-width: 4; }
  .tile:hover rect { fill: #ffe9c4; }
  .tile text { font-size: 60px; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: var(--ink); pointer-events: none; }
  .check { font-size: 90px; fill: var(--leaf); font-weight: 700; }
  .bubble rect { fill: #fff; stroke: #3b4450; stroke-width: 3; }
  .bubble text { font-size: 32px; fill: var(--ink); text-anchor: middle; }
  .done-msg {
    position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%);
    margin: 0; padding: .6em 1.2em; border-radius: 20px; max-width: 90%;
    background: #f1f7e4; border: 5px solid var(--leaf);
    font-size: clamp(24px, 3.4vw, 60px); font-weight: 700; text-align: center;
    box-shadow: 0 10px 40px rgba(60, 80, 30, .25);
  }
  footer { display: flex; align-items: center; gap: 12px; border-top: 3px solid var(--leaf); padding-top: .5vh; font-size: clamp(13px, 1.1vw, 20px); }
  footer .pg { width: 2em; height: 2em; border-radius: 50%; border: 3px solid var(--leaf); display: grid; place-items: center; font-weight: 700; flex: none; }
  footer .tab { margin-left: auto; background: #dbe9b8; padding: 2px 12px; }
</style>
</head>

<script>
// Progress is kept in this browser only, so the class can leave mid-game and carry on later.
const SAVE_KEY = "rokning-spol/kapittul-8";
const store = {
  get() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(v)); } catch (e) {} },
  clear() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} },
};

const NS = "http://www.w3.org/2000/svg";
const pictureG = document.getElementById("picture");
const sumG = document.getElementById("sum");
const tilesG = document.getElementById("tiles");
const scoreEl = document.getElementById("score");
const doneEl = document.getElementById("done");
const ROUNDS = 8;

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function say(a, b) {
  document.getElementById("say1").textContent = a;
  document.getElementById("say2").textContent = b;
}

function rnd(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }

// Spots for up to 5 fish in a bowl; plates hold up to 10 cakes in two rows.
const BOWL_SPOTS = [[-55, -40], [45, -45], [-5, 15], [-65, 55], [55, 50]];
const PLATE_SPOTS = [];
for (let r = 0; r < 2; r++) for (let c = 0; c < 5; c++) PLATE_SPOTS.push([(c - 2) * 115, r * 115 - 57]);

function bowl(cx, n) {
  el("ellipse", { cx, cy: 330, rx: 180, ry: 26, fill: "#dceef7" }, pictureG);
  el("path", { d: `M${cx - 110} 90 Q${cx - 205} 200 ${cx - 150} 290 Q${cx} 345 ${cx + 150} 290 Q${cx + 205} 200 ${cx + 110} 90 Z`, fill: "#cfe9f7", stroke: "#7fb6d6", "stroke-width": 5 }, pictureG);
  el("path", { d: `M${cx - 170} 150 Q${cx} 175 ${cx + 170} 150 Q${cx + 190} 230 ${cx + 150} 290 Q${cx} 345 ${cx - 150} 290 Q${cx - 190} 230 ${cx - 170} 150 Z`, fill: "#8fcdee", opacity: .55 }, pictureG);
  el("ellipse", { cx, cy: 90, rx: 112, ry: 16, fill: "#e8f5fc", stroke: "#7fb6d6", "stroke-width": 5 }, pictureG);
  for (let i = 0; i < n; i++) {
    const [dx, dy] = BOWL_SPOTS[i];
    el("text", { class: "emoji", x: cx + dx, y: 225 + dy, "font-size": 72, transform: i % 2 ? `scale(-1 1) translate(${-2 * (cx + dx)} 0)` : "" }, pictureG).textContent = "🐠";
  }
}

function plate(total, eaten) {
  const cx = 660;
  el("ellipse", { cx, cy: 215, rx: 380, ry: 165, fill: "#ffffff", stroke: "#c9c3b4", "stroke-width": 5 }, pictureG);
  el("ellipse", { cx, cy: 215, rx: 320, ry: 128, fill: "none", stroke: "#e4ded0", "stroke-width": 4 }, pictureG);
  for (let i = 0; i < total; i++) {
    // Centre each row: one row for up to 5 cakes, otherwise 5 on top and the rest below.
    const row = i < 5 ? 0 : 1, inRow = row ? total - 5 : Math.min(5, total);
    const dx = ((i % 5) - (inRow - 1) / 2) * 115, dy = total <= 5 ? 0 : PLATE_SPOTS[i][1];
    const gone = i >= total - eaten;
    el("text", { class: gone ? "emoji eaten" : "emoji", x: cx + dx, y: 215 + dy, "font-size": 84 }, pictureG).textContent = "🧁";
    // eaten cakes are crossed out, like crossing off in the book
    if (gone) el("path", { d: `M${cx + dx - 38} ${215 + dy - 38} l76 76 m0 -76 l-76 76`, stroke: "var(--wrong)", "stroke-width": 8, "stroke-linecap": "round" }, pictureG);
  }
}

// The sum: [ ] + [ ] = [ ]  or  [ ] − [ ] = [ ]
const SLOT_W = 150, SLOT_H = 140, SUM_Y = 420;
const SLOT_X = [300, 560, 820];
let slots = [], active = 0, answer = [], plan = [], round = 0, busy = false;

function drawSum(sign) {
  sumG.replaceChildren();
  slots = SLOT_X.map((x, i) => {
    const g = el("g", { class: "slot" }, sumG);
    el("rect", { x, y: SUM_Y, width: SLOT_W, height: SLOT_H, rx: 14 }, g);
    const t = el("text", { x: x + SLOT_W / 2, y: SUM_Y + SLOT_H / 2 + 4 }, g);
    g.addEventListener("click", () => { if (!busy) setActive(i); });
    return { g, t, value: null };
  });
  el("text", { class: "op", x: 505, y: SUM_Y + SLOT_H / 2 }, sumG).textContent = sign;
  el("text", { class: "op", x: 765, y: SUM_Y + SLOT_H / 2 }, sumG).textContent = "=";
  setActive(0);
}

function setActive(i) {
  active = i;
  slots.forEach((s, k) => s.g.classList.toggle("active", k === i));
}

// Number tiles 0–10 along the bottom.
for (let n = 0; n <= 10; n++) {
  const x = 40 + n * 112, y = 650;
  const g = el("g", { class: "tile", role: "button", "aria-label": String(n) }, tilesG);
  el("rect", { x, y, width: 100, height: 110, rx: 16 }, g);
  el("text", { x: x + 50, y: y + 58 }, g).textContent = n;
  g.addEventListener("click", () => enter(n));
}

function enter(n) {
  if (busy) return;
  const s = slots[active];
  s.value = n; s.t.textContent = n;
  s.g.classList.remove("wrong");
  const empty = slots.findIndex(x => x.value === null);
  if (empty === -1) check(); else setActive(empty);
}

function check() {
  const wrong = slots.map((s, i) => s.value !== answer[i]);
  slots.forEach((s, i) => s.g.classList.toggle(wrong[i] ? "wrong" : "right", true));
  slots.forEach(s => s.g.classList.remove("active"));
  if (!wrong.includes(true)) {
    busy = true;
    el("text", { class: "check", x: 1010, y: SUM_Y + SLOT_H / 2 + 30 }, sumG).textContent = "✓";
    say("Flott!", "Tað er rætt.");
    round++;
    save();
    setTimeout(next, 1600);
    return;
  }
  const first = wrong.indexOf(true);
  const { minus } = plan[round];
  const hints = minus
    ? ["Tel allar kakurnar.", "Tel tær, sum eru etnar.", "Tel tær, sum eru eftir."]
    : ["Tel fiskarnar í fyrsta bollanum.", "Tel fiskarnar í hinum bollanum.", "Tel allar fiskarnar."];
  const words = hints[first].split(" ");
  const mid = Math.ceil(words.length / 2);
  say(words.slice(0, mid).join(" "), words.slice(mid).join(" "));
  busy = true;
  setTimeout(() => {
    busy = false;
    slots.forEach((s, i) => { s.g.classList.remove("right"); if (wrong[i]) { s.value = null; s.t.textContent = ""; s.g.classList.remove("wrong"); } });
    setActive(first);
  }, 900);
}

// saved: the planned sums and how far the class got, from an earlier visit.
function start(saved) {
  doneEl.hidden = true;
  if (saved?.plan?.length === ROUNDS) {
    ({ plan, round } = saved);
    next();
    return;
  }
  round = 0;
  plan = Array.from({ length: ROUNDS }, (_, i) => {
    if (i % 2 === 0) { const a = rnd(1, 5), b = rnd(1, 5); return { minus: false, a, b, answer: [a, b, a + b] }; }
    const total = rnd(3, 10), eaten = rnd(1, total - 1);
    return { minus: true, a: total, b: eaten, answer: [total, eaten, total - eaten] };
  });
  next();
}

function next() {
  busy = false;
  pictureG.replaceChildren();
  scoreEl.textContent = `${round} / ${ROUNDS}`;
  if (round === ROUNDS) { sumG.replaceChildren(); doneEl.hidden = false; say("Tú dugir", "at rokna!"); return; }
  const p = plan[round];
  answer = p.answer;
  if (p.minus) {
    plate(p.a, p.b);
    say("Hvussu nógvar", "kakur eru eftir?");
    drawSum("−");
  } else {
    bowl(410, p.a);
    bowl(910, p.b);
    el("text", { class: "op", x: 660, y: 215 }, pictureG).textContent = "+";
    say("Hvussu nógvir", "fiskar til samans?");
    drawSum("+");
  }
}

function save() { store.set({ plan, round }); }

document.getElementById("again").addEventListener("click", () => { store.clear(); start(); save(); });
doneEl.addEventListener("click", () => { doneEl.hidden = true; });
start(store.get());
save();

// Opened inside the start page, "home" asks that page to close the game, so the address bar keeps showing Snar.
let embedded = false;
window.addEventListener("message", ev => { if (ev.data === "rokning-spol:hello") embedded = true; });
document.getElementById("home").addEventListener("click", ev => {
  if (!embedded) return;
  ev.preventDefault();
  parent.postMessage("rokning-spol:home", "*");
});

// Full screen for the classroom screen; hidden where the browser does not allow it.
const fullBtn = document.getElementById("full");
const FULL_ON = "M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5", FULL_OFF = "M3 8h5V3m8 0v5h5M3 16h5v5m13-5h-5v5";
if (document.fullscreenEnabled) {
  fullBtn.addEventListener("click", () => {
    (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
  });
  document.addEventListener("fullscreenchange", () => {
    const on = !!document.fullscreenElement;
    fullBtn.querySelector("path").setAttribute("d", on ? FULL_OFF : FULL_ON);
    fullBtn.title = on ? "Far úr fullum skermi" : "Fullur skermur";
    fullBtn.setAttribute("aria-label", fullBtn.title);
  });
} else fullBtn.hidden = true;
</script>
