<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vit telja – bóndagarðurin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
  /* Layout: classroom screen — one landscape book page filling the viewport: header row, watercolour farm with counting boxes beneath, green footer band like Rokning 1 */
  :root {
    color-scheme: light;
    --paper: #fffdf8;
    --ink: #24303f;
    --pencil: #2c3f9e;
    --chapter: #afcf5f;
    --leaf: #7fae3a;
    --wrong: #d23a2f;
    --font: "Andika", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--paper); color: var(--ink); }
  body { margin: 0; font-family: var(--font); overflow: hidden; }
  .page {
    height: 100%; box-sizing: border-box;
    padding-block: 1.2vh 1vh;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 1vh;
  }
  header { display: flex; align-items: center; gap: clamp(12px, 1.5vw, 28px); flex-wrap: wrap; }
  .num {
    width: clamp(48px, 5vw, 84px); aspect-ratio: 1; border-radius: 50%; flex: none;
    background: var(--chapter); color: var(--ink);
    display: grid; place-items: center; font-size: clamp(28px, 3.2vw, 54px); font-weight: 700;
  }
  h1 { margin: 0; font-size: clamp(28px, 3.4vw, 58px); letter-spacing: .02em; }
  .book { flex: none; padding: .15em .7em; border-radius: 999px; background: #eef2f6; color: var(--ink);
    font-size: clamp(14px, 1.4vw, 24px); font-weight: 700; letter-spacing: .03em; white-space: nowrap; }
  .task { margin: 0; font-size: clamp(18px, 2.2vw, 38px); line-height: 1.25; flex: 1 1 320px; min-width: 0; }
  .tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  button {
    font: inherit; font-size: clamp(16px, 1.5vw, 26px); font-weight: 700; cursor: pointer;
    border: 3px solid var(--leaf); background: #fff; color: var(--ink);
    padding: .3em .9em; border-radius: 999px;
  }
  button:hover { background: #f1f7e4; }
  button.main { background: var(--leaf); color: #fff; }
  button.main:hover { background: #6c9a2c; }
  button:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home { display: grid; place-items: center; padding: .3em .45em; align-self: stretch; border: 3px solid var(--leaf);
    border-radius: 999px; background: #fff; color: var(--ink); font-size: clamp(16px, 1.5vw, 26px); }
  a.home:hover { background: #f1f7e4; }
  a.home:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  button.icon { display: grid; place-items: center; padding: .3em .45em; align-self: stretch; }
  button.icon svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stage { position: relative; min-height: 0; }
  svg#farm { width: 100%; height: 100%; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .animal { cursor: pointer; }
  .animal text { font-size: 76px; dominant-baseline: central; text-anchor: middle; }
  .animal .mark { fill: var(--pencil); opacity: 0; }
  .animal.counted .mark { opacity: .85; }
  .box .frame { fill: #fff; stroke: #b8c0c8; stroke-width: 3; }
  .box.right .frame { stroke: var(--leaf); stroke-width: 7; fill: #f3f8e8; }
  .box.wrong .frame { stroke: var(--wrong); stroke-width: 7; fill: #fdf0ee; }
  .box .tally { stroke: var(--pencil); stroke-width: 6; stroke-linecap: round; }
  .box .count { font-size: 50px; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: var(--ink); font-variant-numeric: tabular-nums; }
  .step { cursor: pointer; }
  .step circle { fill: #fff; stroke: var(--leaf); stroke-width: 5; }
  .step:hover circle { fill: #f1f7e4; }
  .step text { font-size: 50px; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: var(--ink); pointer-events: none; }
  .done-msg {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
    margin: 0; padding: .6em 1.2em; border-radius: 20px; max-width: 90%;
    background: #f1f7e4; border: 5px solid var(--leaf);
    font-size: clamp(24px, 3.4vw, 60px); font-weight: 700; text-align: center;
    box-shadow: 0 10px 40px rgba(60, 80, 30, .25);
  }
  footer { display: flex; align-items: center; gap: 12px; border-top: 3px solid var(--leaf); padding-top: .5vh; font-size: clamp(13px, 1.1vw, 20px); }
  footer .pg { width: 2em; height: 2em; border-radius: 50%; border: 3px solid var(--leaf); display: grid; place-items: center; font-weight: 700; flex: none; }
  footer .tab { margin-left: auto; background: #dbe9b8; padding: 2px 12px; }
</style>
</head>

  <header>
    <div class="num">2</div>
    <h1>Vit telja</h1>
    <span class="book">Rokning 1A</span>

<script>
// Progress is kept in this browser only, so the class can leave mid-game and carry on later.
const SAVE_KEY = "rokning-spol/kapittul-2";
const store = {
  get() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(v)); } catch (e) {} },
  clear() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} },
};

const NS = "http://www.w3.org/2000/svg";
const animalsG = document.getElementById("animals");
const boxesG = document.getElementById("boxes");
const doneEl = document.getElementById("done");

const KINDS = [
  { e: "🐖", name: "Svín" },
  { e: "🐎", name: "Hestar" },
  { e: "🦆", name: "Dunnur" },
  { e: "🐓", name: "Hønur" },
  { e: "🐈", name: "Kettur" },
  { e: "🐄", name: "Kýr" },
];
const MAX = 10;

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

for (let x = 40; x < 1600; x += 130) el("path", { d: `M${x} 545 V600` }, document.getElementById("posts"));

// Places for animals on the grass, clear of the barn, tree and each other.
function placeAll(n) {
  for (let minD = 100; ; minD -= 6) {
    const pts = [];
    let tries = 0;
    while (pts.length < n && tries < 4000) {
      tries++;
      const x = 60 + Math.random() * 1480, y = 250 + Math.random() * 280;
      if (x < 470 && y < 380) continue;      // barn
      if (x > 1390 && y < 360) continue;     // tree
      if (pts.every(p => Math.hypot(p[0] - x, p[1] - y) >= minD)) pts.push([x, y]);
    }
    if (pts.length === n) return pts;
  }
}

let counts = [], answers = [], herd = [];

// saved: the animals, the counts and the tally marks from an earlier visit.
function newRound(saved) {
  doneEl.hidden = true;
  if (saved?.herd) {
    ({ counts, answers, herd } = saved);
  } else {
    counts = KINDS.map(() => 1 + Math.floor(Math.random() * 6));
    answers = KINDS.map(() => 0);
    const list = [];
    counts.forEach((c, k) => { for (let i = 0; i < c; i++) list.push(k); });
    const pts = placeAll(list.length).sort((a, b) => a[1] - b[1]);  // far ones drawn first
    list.sort(() => Math.random() - .5);
    herd = list.map((k, i) => ({ k, x: Math.round(pts[i][0]), y: Math.round(pts[i][1]), flip: Math.random() < .5 ? -1 : 1, counted: false }));
  }
  animalsG.replaceChildren();
  herd.forEach(a => {
    const g = el("g", { class: a.counted ? "animal counted" : "animal" }, animalsG);
    const t = el("text", { x: 0, y: 0, transform: `translate(${a.x} ${a.y}) scale(${a.flip} 1)` }, g);
    t.textContent = KINDS[a.k].e;
    el("circle", { class: "mark", cx: a.x + 34, cy: a.y - 34, r: 11 }, g);
    // Tap an animal to mark it as counted.
    g.addEventListener("click", () => { a.counted = g.classList.toggle("counted"); save(); });
  });
  drawBoxes();
}

function save() { store.set({ counts, answers, herd }); }

function tally(g, n, x, y) {
  for (let i = 0; i < n; i++) {
    const grp = Math.floor(i / 5), j = i % 5;
    const gx = x + grp * 78;
    if (j < 4) el("path", { class: "tally", d: `M${gx + j * 15} ${y} v62` }, g);
    else el("path", { class: "tally", d: `M${gx - 8} ${y + 50} L${gx + 54} ${y + 10}` }, g);
  }
}

const BW = 245, BGAP = 18, BX0 = (1600 - (6 * BW + 5 * BGAP)) / 2, BY = 615, BH = 280;

function drawBoxes(check) {
  boxesG.replaceChildren();
  KINDS.forEach((kind, k) => {
    const x = BX0 + k * (BW + BGAP);
    const cls = check ? (answers[k] === counts[k] ? "box right" : "box wrong") : "box";
    const g = el("g", { class: cls }, boxesG);
    el("title", {}, g).textContent = kind.name;
    el("rect", { class: "frame", x, y: BY, width: BW, height: BH, rx: 14 }, g);
    const icon = el("text", { x: x + 46, y: BY + 50, "font-size": 60, "text-anchor": "middle", "dominant-baseline": "central" }, g);
    icon.textContent = kind.e;
    tally(g, answers[k], x + 92, BY + 22);
    el("path", { d: `M${x + 20} ${BY + 110} H${x + BW - 20}`, stroke: "#9ec3e6", "stroke-width": 3 }, g);
    el("text", { class: "count", x: x + BW / 2, y: BY + 150 }, g).textContent = answers[k];
    if (check && answers[k] === counts[k]) {
      el("text", { x: x + BW - 30, y: BY + 150, "font-size": 48, fill: "var(--leaf)", "font-weight": 700, "text-anchor": "middle", "dominant-baseline": "central" }, g).textContent = "✓";
    }
    step(g, "−", x + 62, BY + 225, () => change(k, -1));
    step(g, "+", x + BW - 62, BY + 225, () => change(k, 1));
  });
}

function step(parent, label, cx, cy, fn) {
  const g = el("g", { class: "step", role: "button", "aria-label": label === "+" ? "Ein meira" : "Ein minni" }, parent);
  el("circle", { cx, cy, r: 38 }, g);
  el("text", { x: cx, y: cy + 2 }, g).textContent = label;
  g.addEventListener("click", fn);
}

function change(k, d) {
  answers[k] = Math.max(0, Math.min(MAX, answers[k] + d));
  doneEl.hidden = true;
  drawBoxes();
  save();
}

document.getElementById("check").addEventListener("click", () => {
  drawBoxes(true);
  doneEl.hidden = !answers.every((a, k) => a === counts[k]);
});
document.getElementById("again").addEventListener("click", () => { store.clear(); newRound(); save(); });
doneEl.addEventListener("click", () => { doneEl.hidden = true; });
newRound(store.get());
save();
// Opened inside the start page, "home" asks that page to close the game, so the address bar keeps showing Snar.
let embedded = false;
window.addEventListener("message", ev => { if (ev.data === "rokning-spol:hello") embedded = true; });
document.getElementById("home").addEventListener("click", ev => {
  if (!embedded) return;
  ev.preventDefault();
  parent.postMessage("rokning-spol:home", "*");
});

// Full screen for the classroom screen; hidden where the browser does not allow it.
const fullBtn = document.getElementById("full");
const FULL_ON = "M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5", FULL_OFF = "M3 8h5V3m8 0v5h5M3 16h5v5m13-5h-5v5";
if (document.fullscreenEnabled) {
  fullBtn.addEventListener("click", () => {
    (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
  });
  document.addEventListener("fullscreenchange", () => {
    const on = !!document.fullscreenElement;
    fullBtn.querySelector("path").setAttribute("d", on ? FULL_OFF : FULL_ON);
    fullBtn.title = on ? "Far úr fullum skermi" : "Fullur skermur";
    fullBtn.setAttribute("aria-label", fullBtn.title);
  });
} else fullBtn.hidden = true;
</script>
<script src="toolbox.js"></script>
</body>
