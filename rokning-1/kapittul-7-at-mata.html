<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>At máta – longst og stytst</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
  /* Layout: classroom screen — one landscape book page filling the viewport: header row, a big question over five things of different lengths, a sheep with a speech bubble at the right, green footer band like Rokning 1 */
  :root {
    color-scheme: light;
    --paper: #fffdf8;
    --ink: #24303f;
    --pencil: #2c3f9e;
    --chapter: #1a9ad7;
    --leaf: #7fae3a;
    --wrong: #d23a2f;
    --font: "Andika", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--paper); color: var(--ink); }
  body { margin: 0; font-family: var(--font); overflow: hidden; }
  .page {
    height: 100%; box-sizing: border-box;
    padding-block: 1.2vh 1vh;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 1vh;
  }
  header { display: flex; align-items: center; gap: clamp(12px, 1.5vw, 28px); flex-wrap: wrap; }
  .num {
    width: clamp(48px, 5vw, 84px); aspect-ratio: 1; border-radius: 50%; flex: none;
    background: var(--chapter); color: var(--ink);
    display: grid; place-items: center; font-size: clamp(28px, 3.2vw, 54px); font-weight: 700;
  }
  h1 { margin: 0; font-size: clamp(28px, 3.4vw, 58px); letter-spacing: .02em; }
  .book { flex: none; padding: .15em .7em; border-radius: 999px; background: #eef2f6; color: var(--ink);
    font-size: clamp(14px, 1.4vw, 24px); font-weight: 700; letter-spacing: .03em; white-space: nowrap; }
  .task { margin: 0; font-size: clamp(18px, 2.2vw, 38px); line-height: 1.25; flex: 1 1 320px; min-width: 0; }
  .tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  .stars { font-size: clamp(18px, 1.8vw, 32px); font-weight: 700; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-size: clamp(16px, 1.5vw, 26px); font-weight: 700; cursor: pointer;
    border: 3px solid var(--leaf); background: #fff; color: var(--ink);
    padding: .3em .9em; border-radius: 999px;
  }
  button:hover { background: #f1f7e4; }
  button:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home { display: grid; place-items: center; padding: .3em .45em; align-self: stretch; border: 3px solid var(--leaf);
    border-radius: 999px; background: #fff; color: var(--ink); font-size: clamp(16px, 1.5vw, 26px); }
  a.home:hover { background: #f1f7e4; }
  a.home:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  button.icon { display: grid; place-items: center; padding: .3em .45em; align-self: stretch; }
  button.icon svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stage { position: relative; min-height: 0; }
  svg#board { width: 100%; height: 100%; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .question { font-size: 68px; font-weight: 700; fill: var(--ink); }
  .item { cursor: pointer; }
  .item .hit { fill: transparent; }
  .ring { fill: none; stroke: var(--pencil); stroke-width: 7; stroke-linecap: round; }
  .ring.wrong { stroke: var(--wrong); transition: opacity .6s .5s; opacity: 0; }
  .check { font-size: 64px; fill: var(--leaf); font-weight: 700; }
  .bubble rect { fill: #fff; stroke: #3b4450; stroke-width: 3; }
  .bubble text { font-size: 34px; fill: var(--ink); text-anchor: middle; }
  .done-msg {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    margin: 0; padding: .6em 1.2em; border-radius: 20px; max-width: 90%;
    background: #f1f7e4; border: 5px solid var(--leaf);
    font-size: clamp(24px, 3.4vw, 60px); font-weight: 700; text-align: center;
    box-shadow: 0 10px 40px rgba(60, 80, 30, .25);
  }
  footer { display: flex; align-items: center; gap: 12px; border-top: 3px solid var(--leaf); padding-top: .5vh; font-size: clamp(13px, 1.1vw, 20px); }
  footer .pg { width: 2em; height: 2em; border-radius: 50%; border: 3px solid var(--leaf); display: grid; place-items: center; font-weight: 700; flex: none; }
  footer .tab { margin-left: auto; background: #dbe9b8; padding: 2px 12px; }
  @media (prefers-reduced-motion: reduce) { .ring.wrong { transition: none; } }
</style>
</head>

const NS = "http://www.w3.org/2000/svg";
const itemsG = document.getElementById("items");
const ringsG = document.getElementById("rings");
const questionEl = document.getElementById("question");
const scoreEl = document.getElementById("score");
const doneEl = document.getElementById("done");
const ROUNDS = 10;

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function say(a, b) {
  document.getElementById("say1").textContent = a;
  document.getElementById("say2").textContent = b;
}

// Each drawer draws one thing of length L along the x axis, centred on y = 0.
const SNAKE_COLORS = ["#e2402f", "#9cc63a", "#f2c81e", "#2fa3e0", "#e39a2c"];
function snake(g, L, i) {
  const c = SNAKE_COLORS[i % SNAKE_COLORS.length];
  let d = "M0 0";
  const bodyEnd = L - 40;
  for (let x = 20; x <= bodyEnd; x += 20) d += ` L${x} ${(Math.sin(x / 26) * 12).toFixed(1)}`;
  el("path", { d, fill: "none", stroke: c, "stroke-width": 28, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
  const hy = Math.sin(bodyEnd / 26) * 12;
  el("path", { d: `M${L - 6} ${hy} l22 -6 m-22 6 l22 6`, stroke: "#c8202a", "stroke-width": 3, fill: "none" }, g);
  el("ellipse", { cx: L - 30, cy: hy, rx: 34, ry: 22, fill: c }, g);
  el("circle", { cx: L - 24, cy: hy - 8, r: 5, fill: "#fff" }, g);
  el("circle", { cx: L - 23, cy: hy - 8, r: 2.5, fill: "#222" }, g);
}

const PENCIL_COLORS = ["#e2402f", "#2fa3e0", "#9cc63a", "#a46bc4", "#f2c81e"];
function pencil(g, L, i) {
  const c = PENCIL_COLORS[i % PENCIL_COLORS.length];
  el("rect", { x: 0, y: -20, width: 30, height: 40, rx: 6, fill: "#f4a7b9" }, g);
  el("rect", { x: 30, y: -20, width: 12, height: 40, fill: "#c9c9c9" }, g);
  el("rect", { x: 42, y: -20, width: L - 112, height: 40, fill: c }, g);
  el("rect", { x: 42, y: -8, width: L - 112, height: 7, fill: "#fff", opacity: .35 }, g);
  el("path", { d: `M${L - 70} -20 L${L} 0 L${L - 70} 20 Z`, fill: "#f1d3a3" }, g);
  el("path", { d: `M${L - 22} -6 L${L} 0 L${L - 22} 6 Z`, fill: c }, g);
}

// Crocodiles grow in every direction, like on page 58: drawn 600 long, then scaled.
function croc(g, L) {
  const s = L / 600;
  const c = el("g", { transform: `scale(${s.toFixed(3)} ${(s * .8).toFixed(3)})` }, g);
  const BODY = "#6e9a3a", DARK = "#4a6d24", BELLY = "#d3df8e";
  // far-side legs, behind the body
  for (const x of [262, 438]) {
    el("path", { d: `M${x} 12 q4 18 14 30`, fill: "none", stroke: DARK, "stroke-width": 17, "stroke-linecap": "round" }, c);
  }
  // body: tapering tail, round back, flat head and long snout
  const body = "M0 4 C60 -4 140 -18 220 -30 C300 -40 380 -40 432 -28 C455 -32 478 -38 500 -32 " +
    "C530 -22 570 -14 598 -8 C608 -4 608 6 598 9 C560 13 520 15 482 18 C440 28 380 34 300 34 C220 34 140 23 60 11 C30 7 10 6 0 4 Z";
  el("path", { d: body, fill: BODY, stroke: DARK, "stroke-width": 3, "stroke-linejoin": "round" }, c);
  // pale belly
  el("path", { d: "M150 20 C230 28 330 30 420 25 C445 23 465 21 480 19 C440 28 380 34 300 34 C230 34 180 28 150 20 Z", fill: BELLY }, c);
  // ridge of scutes along the back and tail
  for (let x = 40; x <= 420; x += 22) {
    const t = x / 420, y = 4 - 40 * Math.sin(Math.min(1, t * 1.15) * Math.PI / 2) * (x < 220 ? .5 + t : 1);
    el("path", { d: `M${x - 9} ${y + 3} L${x} ${y - 9 - 4 * t} L${x + 9} ${y + 3} Z`, fill: DARK }, c);
  }
  // spots
  [[260, -10, 18, 7], [320, -14, 14, 6], [370, -10, 16, 6], [180, -4, 12, 5]].forEach(([cx, cy, rx, ry]) => {
    el("ellipse", { cx, cy, rx, ry, fill: DARK, opacity: .35 }, c);
  });
  // near-side legs with claws
  for (const x of [232, 408]) {
    const leg = `M${x} 12 q-2 20 -14 34`;
    el("path", { d: leg, fill: "none", stroke: DARK, "stroke-width": 22, "stroke-linecap": "round" }, c);
    el("path", { d: leg, fill: "none", stroke: BODY, "stroke-width": 16, "stroke-linecap": "round" }, c);
    el("path", { d: `M${x - 20} 50 l-9 5 M${x - 14} 52 l-2 8 M${x - 7} 51 l5 7`, stroke: DARK, "stroke-width": 4, "stroke-linecap": "round" }, c);
  }
  // mouth with little teeth, nostril and eye
  el("path", { d: "M482 6 C520 6 560 4 598 2", fill: "none", stroke: DARK, "stroke-width": 3, "stroke-linecap": "round" }, c);
  for (let x = 500; x <= 588; x += 18) el("path", { d: `M${x} ${5 - (x - 482) * .03} l5 6 l5 -6.5 Z`, fill: "#fff" }, c);
  el("circle", { cx: 592, cy: -6, r: 2.5, fill: DARK }, c);
  el("circle", { cx: 494, cy: -32, r: 12, fill: BODY, stroke: DARK, "stroke-width": 2.5 }, c);
  el("circle", { cx: 495, cy: -33, r: 7.5, fill: "#f4e46a" }, c);
  el("ellipse", { cx: 496, cy: -33, rx: 2.2, ry: 6, fill: "#1d1d1d" }, c);
}

const KINDS = [
  { draw: snake, many: "Hvør slanga", long: "longstu", short: "stytstu", it: "slanguna." },
  { draw: pencil, many: "Hvør litblýantur", long: "longsta", short: "stytsta", it: "litblýantin." },
  { draw: croc, many: "Hvør krokodilla", long: "longstu", short: "stytstu", it: "krokodilluna." },
];

const ROWS = [180, 320, 460, 600, 740];

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// Five lengths between 300 and 1000, at least 80 apart, so the answer is clear but needs a look.
function lengths() {
  while (true) {
    const ls = Array.from({ length: 5 }, () => 300 + Math.round(Math.random() * 700)).sort((a, b) => a - b);
    if (ls.every((l, i) => i === 0 || l - ls[i - 1] >= 80)) return shuffle(ls);
  }
}

let round = 0, busy = false, plan = [];

// saved: the planned rounds and how far the class got, from an earlier visit.
function start(saved) {
  doneEl.hidden = true;
  if (saved?.kinds?.length === ROUNDS) {
    round = saved.round;
    plan = saved.kinds.map((k, i) => ({ kind: KINDS[k], longest: i % 2 === 0 }));
  } else {
    round = 0;
    // Alternate longest and shortest; vary the kind.
    plan = Array.from({ length: ROUNDS }, (_, i) => ({ kind: KINDS[(i + Math.floor(Math.random() * 3)) % 3], longest: i % 2 === 0 }));
  }
  next();
}

function save() { store.set({ kinds: plan.map(p => KINDS.indexOf(p.kind)), round }); }

function next() {
  busy = false;
  itemsG.replaceChildren(); ringsG.replaceChildren();
  scoreEl.textContent = `${round} / ${ROUNDS}`;
  if (round === ROUNDS) { doneEl.hidden = false; say("Tú dugir", "at máta!"); return; }
  const { kind, longest } = plan[round];
  questionEl.textContent = `${kind.many} er ${longest ? "longst" : "stytst"}?`;
  say(`Trýst á ${longest ? kind.long : kind.short}`, kind.it);
  const ls = lengths();
  const target = longest ? Math.max(...ls) : Math.min(...ls);
  ls.forEach((L, i) => {
    const x = 50 + Math.round(Math.random() * (1220 - 50 - L));
    const y = ROWS[i];
    const g = el("g", { class: "item", transform: `translate(${x} ${y})` }, itemsG);
    el("rect", { class: "hit", x: -20, y: -55, width: L + 40, height: 110 }, g);
    kind.draw(g, L, i);
    g.addEventListener("click", () => pick({ g, x, y, L }, L === target, longest));
  });
}

function ring(it, cls) {
  return el("ellipse", { class: `ring ${cls}`, cx: it.x + it.L / 2, cy: it.y + 4, rx: it.L / 2 + 40, ry: 62, transform: `rotate(-1.5 ${it.x + it.L / 2} ${it.y})` }, ringsG);
}

function pick(it, ok, longest) {
  if (busy) return;
  if (ok) {
    busy = true;
    ring(it, "");
    el("text", { class: "check", x: it.x + it.L + 50, y: it.y + 22 }, ringsG).textContent = "✓";
    say("Ja! Hendan", `er ${longest ? "longst" : "stytst"}.`);
    round++;
    save();
    setTimeout(next, 1400);
  } else {
    const r = ring(it, "");
    requestAnimationFrame(() => r.classList.add("wrong"));
    setTimeout(() => r.remove(), 1200);
    say("Nei, hygg", "eftir aftur.");
  }
}

document.getElementById("again").addEventListener("click", () => { store.clear(); start(); save(); });
doneEl.addEventListener("click", () => { doneEl.hidden = true; });
start(store.get());
save();

// Opened inside the start page, "home" asks that page to close the game, so the address bar keeps showing Snar.
let embedded = false;
window.addEventListener("message", ev => { if (ev.data === "rokning-spol:hello") embedded = true; });
document.getElementById("home").addEventListener("click", ev => {
  if (!embedded) return;
  ev.preventDefault();
  parent.postMessage("rokning-spol:home", "*");
});

// Full screen for the classroom screen; hidden where the browser does not allow it.
const fullBtn = document.getElementById("full");
const FULL_ON = "M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5", FULL_OFF = "M3 8h5V3m8 0v5h5M3 16h5v5m13-5h-5v5";
if (document.fullscreenEnabled) {
  fullBtn.addEventListener("click", () => {
    (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
  });
  document.addEventListener("fullscreenchange", () => {
    const on = !!document.fullscreenElement;
    fullBtn.querySelector("path").setAttribute("d", on ? FULL_OFF : FULL_ON);
    fullBtn.title = on ? "Far úr fullum skermi" : "Fullur skermur";
    fullBtn.setAttribute("aria-label", fullBtn.title);
  });
} else fullBtn.hidden = true;
</script>
<script src="toolbox.js"></script>
</body>
