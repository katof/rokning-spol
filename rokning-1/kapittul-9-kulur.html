<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tølini frá 0 til 20 – kúlur á tallinjuni</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
  /* Layout: classroom screen — one landscape book page filling the viewport: header row, a string of twenty beads with a peg, a number line 0–20 beneath it, green footer band like Rokning 1 */
  :root {
    color-scheme: light;
    --paper: #fffdf8;
    --ink: #24303f;
    --pencil: #2c3f9e;
    --chapter: #f06fa8;
    --leaf: #7fae3a;
    --wrong: #d23a2f;
    --bead: #e8177d;
    --font: "Andika", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--paper); color: var(--ink); }
  body { margin: 0; font-family: var(--font); overflow: hidden; }
  .page {
    height: 100%; box-sizing: border-box;
    padding-block: 1.2vh 1vh;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 1vh;
  }
  header { display: flex; align-items: center; gap: clamp(12px, 1.5vw, 28px); flex-wrap: wrap; }
  .num {
    width: clamp(48px, 5vw, 84px); aspect-ratio: 1; border-radius: 50%; flex: none;
    background: var(--chapter); color: var(--ink);
    display: grid; place-items: center; font-size: clamp(28px, 3.2vw, 54px); font-weight: 700;
  }
  h1 { margin: 0; font-size: clamp(28px, 3.4vw, 58px); letter-spacing: .02em; }
  .book { flex: none; padding: .15em .7em; border-radius: 999px; background: #eef2f6; color: var(--ink);
    font-size: clamp(14px, 1.4vw, 24px); font-weight: 700; letter-spacing: .03em; white-space: nowrap; }
  .task { margin: 0; font-size: clamp(18px, 2.2vw, 38px); line-height: 1.25; flex: 1 1 320px; min-width: 0; }
  .tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  .stars { font-size: clamp(18px, 1.8vw, 32px); font-weight: 700; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-size: clamp(16px, 1.5vw, 26px); font-weight: 700; cursor: pointer;
    border: 3px solid var(--leaf); background: #fff; color: var(--ink);
    padding: .3em .9em; border-radius: 999px;
  }
  button:hover { background: #f1f7e4; }
  button:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home { display: grid; place-items: center; padding: .3em .45em; align-self: stretch; border: 3px solid var(--leaf);
    border-radius: 999px; background: #fff; color: var(--ink); font-size: clamp(16px, 1.5vw, 26px); }
  a.home:hover { background: #f1f7e4; }
  a.home:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stage { position: relative; min-height: 0; }
  svg#board { width: 100%; height: 100%; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .question { font-size: 52px; font-weight: 700; fill: var(--ink); }
  .bead { stroke: rgba(0, 0, 0, .25); stroke-width: 2; }
  .tick { cursor: pointer; }
  .tick .hit { fill: transparent; }
  .tick:hover .mark { stroke: var(--pencil); }
  .tick .mark { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; }
  .tick text { font-size: 46px; text-anchor: middle; dominant-baseline: central; fill: var(--ink); font-variant-numeric: tabular-nums; }
  .tick .guess { font-weight: 700; }
  .tick .guess.wrong { fill: var(--wrong); }
  .tick .guess.right { fill: var(--leaf); }
  .pencil-line { fill: none; stroke: var(--pencil); stroke-width: 7; stroke-linecap: round; }
  .check { font-size: 70px; fill: var(--leaf); font-weight: 700; }
  .hint { font-size: 40px; font-weight: 700; fill: var(--wrong); }
  .done-msg {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    margin: 0; padding: .6em 1.2em; border-radius: 20px; max-width: 90%;
    background: #f1f7e4; border: 5px solid var(--leaf);
    font-size: clamp(24px, 3.4vw, 60px); font-weight: 700; text-align: center;
    box-shadow: 0 10px 40px rgba(60, 80, 30, .25);
  }
  footer { display: flex; align-items: center; gap: 12px; border-top: 3px solid var(--leaf); padding-top: .5vh; font-size: clamp(13px, 1.1vw, 20px); }
  footer .pg { width: 2em; height: 2em; border-radius: 50%; border: 3px solid var(--leaf); display: grid; place-items: center; font-weight: 700; flex: none; }
  footer .tab { margin-left: auto; background: #dbe9b8; padding: 2px 12px; }
</style>

<script>
// A short game: it starts fresh every time, so the next class never lands in a half-played round.
const SAVE_KEY = "rokning-spol/kapittul-9-kulur";
try { localStorage.removeItem(SAVE_KEY); } catch (e) {}   // drop anything saved by the older version
const store = {
  get() { return null; },
  set(v) {},
  clear() {},
};

const NS = "http://www.w3.org/2000/svg";
const pegG = document.getElementById("peg");
const answerG = document.getElementById("answer");
const lineG = document.getElementById("line");
const hintEl = document.getElementById("hint");
const scoreEl = document.getElementById("score");
const doneEl = document.getElementById("done");
const ROUNDS = 8;

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

// Twenty beads in fives, pink and white, as on page 80.
const BX0 = 140, BSTEP = 66, BY = 330;
const beadX = i => BX0 + i * BSTEP;
const beadsG = document.getElementById("beads");
el("path", { d: `M${beadX(0) - 60} ${BY} H${beadX(19) + 60}`, stroke: "#c28a3a", "stroke-width": 5 }, beadsG);
el("circle", { cx: beadX(0) - 64, cy: BY, r: 9, fill: "#c28a3a" }, beadsG);
el("circle", { cx: beadX(19) + 64, cy: BY, r: 9, fill: "#c28a3a" }, beadsG);
for (let i = 0; i < 20; i++) {
  const pink = Math.floor(i / 5) % 2 === 0;
  el("circle", { class: "bead", cx: beadX(i), cy: BY, r: 29, fill: pink ? "var(--bead)" : "#ffffff" }, beadsG);
  el("circle", { cx: beadX(i) - 9, cy: BY - 10, r: 7, fill: "#fff", opacity: pink ? .55 : .9 }, beadsG);
}

// Number line 0–20; only 0, 5, 10, 15 and 20 are written, like page 81.
const LX0 = 120, LSTEP = 68, LY = 640;
const lineX = n => LX0 + n * LSTEP;
const numberLine = el("g", {}, document.getElementById("board"));
el("path", { d: `M${lineX(0) - 30} ${LY} H${lineX(20) + 50}`, stroke: "var(--ink)", "stroke-width": 5 }, numberLine);
el("path", { d: `M${lineX(20) + 50} ${LY} l-18 -12 m18 12 l-18 12`, stroke: "var(--ink)", "stroke-width": 5, fill: "none", "stroke-linecap": "round" }, numberLine);
const ticks = [];
for (let n = 0; n <= 20; n++) {
  const x = lineX(n), big = n % 5 === 0;
  const g = el("g", { class: "tick", role: "button", "aria-label": String(n) }, numberLine);
  el("rect", { class: "hit", x: x - LSTEP / 2, y: LY - 80, width: LSTEP, height: 200 }, g);
  el("path", { class: "mark", d: `M${x} ${LY - (big ? 26 : 16)} V${LY + (big ? 26 : 16)}` }, g);
  if (big) el("text", { x, y: LY + 64 }, g).textContent = n;
  g.addEventListener("click", () => pick(n));
  ticks.push(g);
}

// The wooden peg sits between bead n and bead n + 1.
function drawPeg(n) {
  pegG.replaceChildren();
  const x = beadX(n - 1) + BSTEP / 2;
  const g = el("g", { transform: `translate(${x} ${BY}) rotate(6)` }, pegG);
  el("rect", { x: -12, y: -110, width: 13, height: 150, rx: 5, fill: "#f2c84b", stroke: "#b8902a", "stroke-width": 2 }, g);
  el("rect", { x: 1, y: -110, width: 13, height: 150, rx: 5, fill: "#f7d867", stroke: "#b8902a", "stroke-width": 2 }, g);
  el("circle", { cx: 1, cy: -50, r: 11, fill: "none", stroke: "#8a8f96", "stroke-width": 4 }, g);
  return x;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

let plan = [], round = 0, pegX = 0, busy = false;

// saved: the planned bead counts and how far the class got, from an earlier visit.
function start(saved) {
  doneEl.hidden = true;
  if (saved?.plan?.length === ROUNDS) ({ plan, round } = saved);
  else {
    round = 0;
    plan = shuffle(Array.from({ length: 18 }, (_, i) => i + 3)).slice(0, ROUNDS);
  }
  next();
}

function save() { store.set({ plan, round }); }

function next() {
  busy = false;
  answerG.replaceChildren(); lineG.replaceChildren();
  hintEl.textContent = "";
  scoreEl.textContent = `${round} / ${ROUNDS}`;
  if (round === ROUNDS) { pegG.replaceChildren(); doneEl.hidden = false; return; }
  pegX = drawPeg(plan[round]);
}

function guess(n, cls) {
  return el("text", { class: `guess ${cls}`, x: lineX(n), y: LY - 62, "font-size": 50, "text-anchor": "middle", "dominant-baseline": "central" }, answerG);
}

function pick(n) {
  if (busy) return;
  const want = plan[round];
  if (n === want) {
    busy = true;
    answerG.replaceChildren();
    guess(n, "right").textContent = n;
    el("path", { class: "pencil-line", d: `M${pegX} ${BY + 50} Q${(pegX + lineX(n)) / 2 + 20} ${(BY + LY) / 2} ${lineX(n)} ${LY - 92}` }, lineG);
    el("text", { class: "check", x: lineX(n) + 40, y: LY - 120 }, lineG).textContent = "✓";
    hintEl.textContent = "";
    round++;
    save();
    setTimeout(next, 1600);
  } else {
    answerG.replaceChildren();
    const t = guess(n, "wrong");
    t.textContent = n;
    hintEl.textContent = n < want ? "Tað eru fleiri kúlur. Tel aftur." : "Tað eru færri kúlur. Tel aftur.";
    setTimeout(() => t.remove(), 1200);
  }
}

document.getElementById("again").addEventListener("click", () => { store.clear(); start(); save(); });
doneEl.addEventListener("click", () => { doneEl.hidden = true; });
start(store.get());
save();

// Opened inside the start page, "home" asks that page to close the game, so the address bar keeps showing Snar.
let embedded = false;
window.addEventListener("message", ev => { if (ev.data === "rokning-spol:hello") embedded = true; });
document.getElementById("home").addEventListener("click", ev => {
  if (!embedded) return;
  ev.preventDefault();
  parent.postMessage("rokning-spol:home", "*");
});

</script>
