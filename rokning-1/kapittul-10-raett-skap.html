<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skap og myndir – tekna strikur til rætt skap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
  /* Layout: classroom screen — one landscape book page filling the viewport: header row, coloured things on the left and turned silhouettes on the right, green footer band like Rokning 1 */
  :root {
    color-scheme: light;
    --paper: #fffdf8;
    --ink: #24303f;
    --pencil: #2c3f9e;
    --chapter: #f06fa8;
    --leaf: #7fae3a;
    --wrong: #d23a2f;
    --font: "Andika", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--paper); color: var(--ink); }
  body { margin: 0; font-family: var(--font); overflow: hidden; }
  .page {
    height: 100%; box-sizing: border-box;
    padding-block: 1.2vh 1vh;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 1vh;
  }
  header { display: flex; align-items: center; gap: clamp(12px, 1.5vw, 28px); flex-wrap: wrap; }
  .num {
    width: clamp(48px, 5vw, 84px); aspect-ratio: 1; border-radius: 50%; flex: none;
    background: var(--chapter); color: var(--ink);
    display: grid; place-items: center; font-size: clamp(28px, 3.2vw, 54px); font-weight: 700;
  }
  h1 { margin: 0; font-size: clamp(28px, 3.4vw, 58px); letter-spacing: .02em; }
  .book { flex: none; padding: .15em .7em; border-radius: 999px; background: #eef2f6; color: var(--ink);
    font-size: clamp(14px, 1.4vw, 24px); font-weight: 700; letter-spacing: .03em; white-space: nowrap; }
  .task { margin: 0; font-size: clamp(18px, 2.2vw, 38px); line-height: 1.25; flex: 1 1 320px; min-width: 0; }
  .tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  .stars { font-size: clamp(18px, 1.8vw, 32px); font-weight: 700; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-size: clamp(16px, 1.5vw, 26px); font-weight: 700; cursor: pointer;
    border: 3px solid var(--leaf); background: #fff; color: var(--ink);
    padding: .3em .9em; border-radius: 999px;
  }
  button:hover { background: #f1f7e4; }
  button:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home { display: grid; place-items: center; padding: .3em .45em; align-self: stretch; border: 3px solid var(--leaf);
    border-radius: 999px; background: #fff; color: var(--ink); font-size: clamp(16px, 1.5vw, 26px); }
  a.home:hover { background: #f1f7e4; }
  a.home:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  button.icon { display: grid; place-items: center; padding: .3em .45em; align-self: stretch; }
  button.icon svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stage { position: relative; min-height: 0; }
  svg#board { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  .thing { cursor: grab; }
  .thing text, .shadow text { font-size: 120px; dominant-baseline: central; text-anchor: middle; }
  .thing.done { cursor: default; }
  .thing.done text { opacity: .55; }
  .thing.shake { animation: shake .45s; }
  @keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
  .shadow .sil { filter: url(#silhouette); }
  .shadow .real { opacity: 0; transition: opacity .8s; }
  .shadow.done .real { opacity: 1; }
  .shadow.hot .ring { stroke: var(--pencil); stroke-width: 6; }
  .shadow .ring { fill: transparent; stroke: transparent; }
  .line { fill: none; stroke: var(--pencil); stroke-width: 8; stroke-linecap: round; opacity: .9; }
  .line.wrong { stroke: var(--wrong); transition: opacity .6s .3s; opacity: 0; }
  .check { font-size: 56px; fill: var(--leaf); font-weight: 700; }
  .done-msg {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    margin: 0; padding: .6em 1.2em; border-radius: 20px; max-width: 90%;
    background: #f1f7e4; border: 5px solid var(--leaf);
    font-size: clamp(24px, 3.4vw, 60px); font-weight: 700; text-align: center;
    box-shadow: 0 10px 40px rgba(60, 80, 30, .25);
  }
  footer { display: flex; align-items: center; gap: 12px; border-top: 3px solid var(--leaf); padding-top: .5vh; font-size: clamp(13px, 1.1vw, 20px); }
  footer .pg { width: 2em; height: 2em; border-radius: 50%; border: 3px solid var(--leaf); display: grid; place-items: center; font-weight: 700; flex: none; }
  footer .tab { margin-left: auto; background: #dbe9b8; padding: 2px 12px; }
  @media (prefers-reduced-motion: reduce) { .thing.shake { animation: none; } .line.wrong, .shadow .real { transition: none; } }
</style>
</head>

<script>
// Progress is kept in this browser only, so the class can leave mid-game and carry on later.
const SAVE_KEY = "rokning-spol/kapittul-10-raett-skap";
const store = {
  get() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(v)); } catch (e) {} },
  clear() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} },
};

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("board");
const shadowsG = document.getElementById("shadows");
const linesG = document.getElementById("lines");
const thingsG = document.getElementById("things");
const live = document.getElementById("live");
const scoreEl = document.getElementById("score");
const doneEl = document.getElementById("done");

// Household things with clear outlines; six are picked each round.
const POOL = ["🥄", "🍳", "🔑", "✂️", "🔨", "🎸", "☂️", "🔧", "🧹", "🍴"];

// Things in two columns on the left, silhouettes in two columns on the right.
const LEFT = [[170, 170], [400, 170], [170, 420], [400, 420], [170, 670], [400, 670]];
const RIGHT = [[1060, 170], [1330, 200], [1060, 430], [1330, 450], [1060, 690], [1330, 700]];

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

let things = [], shadows = [];

let layout = null;

// saved: which things, how each silhouette is turned, and which are matched, from an earlier visit.
function start(saved) {
  linesG.replaceChildren(); thingsG.replaceChildren(); shadowsG.replaceChildren();
  doneEl.hidden = true;
  if (saved?.pick?.length === 6) layout = saved;
  else {
    // Silhouettes are turned, flipped and resized, so the class has to look at the outline.
    const spots = shuffle(RIGHT.slice());
    layout = {
      pick: shuffle(POOL.slice()).slice(0, 6),
      turn: spots.slice(0, 6).map(([x, y]) => ({ x, y, rot: Math.round(Math.random() * 120 - 60), flip: Math.random() < .5 ? -1 : 1, sc: +(.85 + Math.random() * .35).toFixed(2) })),
      done: Array(6).fill(false),
    };
  }
  const { pick } = layout;
  shadows = pick.map((e, i) => {
    const { x, y, rot, flip, sc } = layout.turn[i];
    const g = el("g", { class: "shadow" }, shadowsG);
    el("circle", { class: "ring", cx: x, cy: y, r: 95 }, g);
    const t = `translate(${x} ${y}) rotate(${rot}) scale(${flip * sc} ${sc})`;
    el("text", { class: "sil", transform: t }, g).textContent = e;
    el("text", { class: "real", transform: t }, g).textContent = e;
    return { e, x, y, g };
  });
  things = pick.map((e, i) => {
    const [x, y] = LEFT[i];
    const g = el("g", { class: "thing" }, thingsG);
    el("circle", { cx: x, cy: y, r: 80, fill: "transparent" }, g);
    el("text", { x, y }, g).textContent = e;
    const item = { e, x, y, g, done: false };
    g.addEventListener("pointerdown", ev => begin(ev, item));
    return item;
  });
  things.forEach((t, i) => { if (layout.done[i]) matched(t, shadows.find(s => s.e === t.e)); });
  updateScore();
}

function save() { layout.done = things.map(t => t.done); store.set(layout); }

// A thing is matched: the line stays and the silhouette gets its colours.
function matched(item, target) {
  el("path", { class: "line", d: pencil(item.x + 70, item.y, target.x - 90, target.y) }, linesG);
  item.done = true;
  item.g.classList.add("done");
  target.g.classList.add("done");
  el("text", { class: "check", x: target.x + 80, y: target.y - 70 }, target.g).textContent = "✓";
}

function toSvg(ev) {
  const p = svg.createSVGPoint();
  p.x = ev.clientX; p.y = ev.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}

function shadowAt(pt) {
  return shadows.find(s => Math.hypot(pt.x - s.x, pt.y - s.y) < 110);
}

// A slightly wobbly pencil stroke between two points.
function pencil(x1, y1, x2, y2) {
  const mx = (x1 + x2) / 2 + (y2 - y1) * 0.06, my = (y1 + y2) / 2 - (x2 - x1) * 0.06;
  return `M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}`;
}

let drag = null;

function begin(ev, item) {
  if (item.done) return;
  ev.preventDefault();
  svg.setPointerCapture(ev.pointerId);
  drag = item;
  live.setAttribute("d", "");
}

svg.addEventListener("pointermove", ev => {
  if (!drag) return;
  const p = toSvg(ev);
  live.setAttribute("d", pencil(drag.x + 70, drag.y, p.x, p.y));
  const over = shadowAt(p);
  shadows.forEach(s => s.g.classList.toggle("hot", s === over));
});

function finish(ev) {
  if (!drag) return;
  const item = drag; drag = null;
  shadows.forEach(s => s.g.classList.remove("hot"));
  const target = shadowAt(toSvg(ev));
  live.setAttribute("d", "");
  if (!target || target.g.classList.contains("done")) return;
  if (target.e === item.e) {
    matched(item, target);
    updateScore();
    save();
  } else {
    const line = el("path", { class: "line", d: pencil(item.x + 70, item.y, target.x - 90, target.y) }, linesG);
    requestAnimationFrame(() => line.classList.add("wrong"));
    setTimeout(() => line.remove(), 1000);
    item.g.classList.remove("shake"); void item.g.getBBox(); item.g.classList.add("shake");
  }
}
svg.addEventListener("pointerup", finish);
svg.addEventListener("pointercancel", () => { drag = null; live.setAttribute("d", ""); });

function updateScore() {
  const n = things.filter(t => t.done).length;
  scoreEl.textContent = `${n} / ${things.length}`;
  doneEl.hidden = n !== things.length;
}

document.getElementById("again").addEventListener("click", () => { store.clear(); start(); save(); });
doneEl.addEventListener("click", () => { doneEl.hidden = true; });
start(store.get());
save();

// Opened inside the start page, "home" asks that page to close the game, so the address bar keeps showing Snar.
let embedded = false;
window.addEventListener("message", ev => { if (ev.data === "rokning-spol:hello") embedded = true; });
document.getElementById("home").addEventListener("click", ev => {
  if (!embedded) return;
  ev.preventDefault();
  parent.postMessage("rokning-spol:home", "*");
});

// Full screen for the classroom screen; hidden where the browser does not allow it.
const fullBtn = document.getElementById("full");
const FULL_ON = "M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5", FULL_OFF = "M3 8h5V3m8 0v5h5M3 16h5v5m13-5h-5v5";
if (document.fullscreenEnabled) {
  fullBtn.addEventListener("click", () => {
    (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
  });
  document.addEventListener("fullscreenchange", () => {
    const on = !!document.fullscreenElement;
    fullBtn.querySelector("path").setAttribute("d", on ? FULL_OFF : FULL_ON);
    fullBtn.title = on ? "Far úr fullum skermi" : "Fullur skermur";
    fullBtn.setAttribute("aria-label", fullBtn.title);
  });
} else fullBtn.hidden = true;
</script>
</body>
</html>
