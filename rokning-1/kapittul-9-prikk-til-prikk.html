<style>
  /* Layout: classroom screen — one landscape book page filling the viewport: header row, twenty numbered dots that outline a hidden sheep, a hint column at the right, green footer band like Rokning 1 */
  :root {
    color-scheme: light;
    --paper: #fffdf8;
    --ink: #24303f;
    --pencil: #2c3f9e;
    --chapter: #f06fa8;
    --leaf: #7fae3a;
    --wrong: #d23a2f;
    --red: #d4282e;
    --font: "Andika", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--paper); color: var(--ink); }
  body { margin: 0; font-family: var(--font); overflow: hidden; }
  .page {
    height: 100%; box-sizing: border-box;
    padding-block: 1.2vh 1vh;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 1vh;
  }
  header { display: flex; align-items: center; gap: clamp(12px, 1.5vw, 28px); flex-wrap: wrap; }
  .num {
    width: clamp(48px, 5vw, 84px); aspect-ratio: 1; border-radius: 50%; flex: none;
    background: var(--chapter); color: var(--ink);
    display: grid; place-items: center; font-size: clamp(28px, 3.2vw, 54px); font-weight: 700;
  }
  h1 { margin: 0; font-size: clamp(28px, 3.4vw, 58px); letter-spacing: .02em; }
  .book { flex: none; padding: .15em .7em; border-radius: 999px; background: #eef2f6; color: var(--ink);
    font-size: clamp(14px, 1.4vw, 24px); font-weight: 700; letter-spacing: .03em; white-space: nowrap; }
  .task { margin: 0; font-size: clamp(18px, 2.2vw, 38px); line-height: 1.25; flex: 1 1 320px; min-width: 0; }
  .tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  .stars { font-size: clamp(18px, 1.8vw, 32px); font-weight: 700; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-size: clamp(16px, 1.5vw, 26px); font-weight: 700; cursor: pointer;
    border: 3px solid var(--leaf); background: #fff; color: var(--ink);
    padding: .3em .9em; border-radius: 999px;
  }
  button:hover { background: #f1f7e4; }
  button:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home { display: grid; place-items: center; padding: .3em .45em; align-self: stretch; border: 3px solid var(--leaf);
    border-radius: 999px; background: #fff; color: var(--ink); font-size: clamp(16px, 1.5vw, 26px); }
  a.home:hover { background: #f1f7e4; }
  a.home:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
  a.home svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  button.icon { display: grid; place-items: center; padding: .3em .45em; align-self: stretch; }
  button.icon svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stage { position: relative; min-height: 0; }
  svg#board { width: 100%; height: 100%; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .picture { opacity: 0; transition: opacity 1.4s; }
  .picture.show { opacity: 1; }
  .line { fill: none; stroke-width: 6; stroke-linecap: round; transition: opacity 1.4s; }
  .lines.faded .line { opacity: .25; }
  .dot { cursor: pointer; }
  .dot .hit { fill: transparent; }
  .dot circle.pt { fill: var(--ink); }
  .dot text { font-size: 40px; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: var(--ink); }
  .dot.high text, .dot.high circle.pt { fill: var(--red); }
  .dot.done circle.pt { fill: var(--leaf); }
  .dot.miss text { fill: var(--wrong); animation: blink .5s 2; }
  .dots.faded { opacity: .35; transition: opacity 1.4s; }
  .start-ring { fill: none; stroke: var(--pencil); stroke-width: 5; animation: pulse 1.2s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { transform: scale(1.35); opacity: .3; } }
  @keyframes blink { 50% { opacity: .2; } }
  .hint { font-size: 54px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
  .hint.big { font-size: 150px; fill: var(--pencil); }
  .done-msg {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    margin: 0; padding: .6em 1.2em; border-radius: 20px; max-width: 90%;
    background: #f1f7e4; border: 5px solid var(--leaf);
    font-size: clamp(24px, 3.4vw, 60px); font-weight: 700; text-align: center;
    box-shadow: 0 10px 40px rgba(60, 80, 30, .25);
  }
  footer { display: flex; align-items: center; gap: 12px; border-top: 3px solid var(--leaf); padding-top: .5vh; font-size: clamp(13px, 1.1vw, 20px); }
  footer .pg { width: 2em; height: 2em; border-radius: 50%; border: 3px solid var(--leaf); display: grid; place-items: center; font-weight: 700; flex: none; }
  footer .tab { margin-left: auto; background: #dbe9b8; padding: 2px 12px; }
  @media (prefers-reduced-motion: reduce) { .start-ring, .dot.miss text { animation: none; } .picture, .line { transition: none; } }
</style>

// Progress is kept in this browser only, so the class can leave mid-game and carry on later.
const SAVE_KEY = "rokning-spol/kapittul-9-prikk-til-prikk";
const store = {
  get() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(v)); } catch (e) {} },
  clear() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} },
};

const NS = "http://www.w3.org/2000/svg";
const picture = document.getElementById("picture");
const linesG = document.getElementById("lines");
const dotsG = document.getElementById("dots");
const scoreEl = document.getElementById("score");
const doneEl = document.getElementById("done");
const PH = 640, PY = 120, CX = 640;  // picture height, top and centre

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function hint(a, b) {
  document.getElementById("hint1").textContent = a;
  document.getElementById("hint2").textContent = b;
}

let pic = 0, next = 1, pts = [], dots = [], busy = false;

// saved: which picture the class is on and how many dots are joined, from an earlier visit.
function start(saved) {
  doneEl.hidden = true;
  const finished = saved?.pic >= SHEEP.length;
  pic = finished ? SHEEP.length - 1 : (saved?.pic ?? 0);
  load();
  if (finished) { pic = SHEEP.length; busy = true; doneEl.hidden = false; return; }
  for (let n = 1; n < (saved?.next ?? 1); n++) tap(n);
}

function save() { store.set({ pic, next }); }

function load() {
  busy = false;
  next = 1;
  linesG.replaceChildren(); dotsG.replaceChildren();
  linesG.classList.remove("faded"); dotsG.classList.remove("faded");
  picture.classList.remove("show");
  scoreEl.textContent = `${pic + 1} / ${SHEEP.length}`;
  const s = SHEEP[pic];
  const pw = PH * s.w / s.h, x0 = CX - pw / 2;
  Object.entries({ x: x0, y: PY, width: pw, height: PH, href: s.src }).forEach(([k, v]) => picture.setAttribute(k, v));
  pts = s.dots.map(([fx, fy]) => [x0 + fx * pw, PY + fy * PH]);
  const mx = pts.reduce((a, p) => a + p[0], 0) / pts.length, my = pts.reduce((a, p) => a + p[1], 0) / pts.length;
  dots = pts.map(([x, y], i) => {
    const n = i + 1;
    const g = el("g", { class: n > 10 ? "dot high" : "dot" }, dotsG);
    el("circle", { class: "hit", cx: x, cy: y, r: 42 }, g);
    el("circle", { class: "pt", cx: x, cy: y, r: 11 }, g);
    // number sits just outside the outline
    const dx = x - mx, dy = y - my, len = Math.hypot(dx, dy) || 1;
    el("text", { x: x + dx / len * 38, y: y + dy / len * 38 }, g).textContent = n;
    g.addEventListener("click", () => tap(n));
    return g;
  });
  el("circle", { class: "start-ring", id: "ring", cx: pts[0][0], cy: pts[0][1], r: 26 }, dotsG);
  hint("Byrja við", "1");
}

function line(a, b, n) {
  el("path", { class: "line", d: `M${pts[a][0]} ${pts[a][1]} L${pts[b][0]} ${pts[b][1]}`, stroke: n > 10 ? "var(--red)" : "var(--ink)" }, linesG);
}

function tap(n) {
  if (busy) return;
  if (n !== next) {
    const d = dots[n - 1];
    d.classList.remove("miss"); void d.getBBox(); d.classList.add("miss");
    hint("Finn talið", String(next));
    return;
  }
  document.getElementById("ring")?.remove();
  dots[n - 1].classList.add("done");
  if (n > 1) line(n - 2, n - 1, n);
  next++;
  hint("", "");
  save();
  if (n === pts.length) finish();
}

function finish() {
  busy = true;
  line(pts.length - 1, 0, pts.length);
  setTimeout(() => {
    picture.classList.add("show");
    linesG.classList.add("faded"); dotsG.classList.add("faded");
    hint("Ein seyður!", "");
  }, 400);
  setTimeout(() => {
    pic++;
    if (pic === SHEEP.length) { save(); doneEl.hidden = false; return; }
    load();
    save();
  }, 3200);
}

document.getElementById("again").addEventListener("click", () => { store.clear(); start(); save(); });
doneEl.addEventListener("click", () => { doneEl.hidden = true; });
start(store.get());
save();

// Opened inside the start page, "home" asks that page to close the game, so the address bar keeps showing Snar.
let embedded = false;
window.addEventListener("message", ev => { if (ev.data === "rokning-spol:hello") embedded = true; });
document.getElementById("home").addEventListener("click", ev => {
  if (!embedded) return;
  ev.preventDefault();
  parent.postMessage("rokning-spol:home", "*");
});

// Full screen for the classroom screen; hidden where the browser does not allow it.
const fullBtn = document.getElementById("full");
const FULL_ON = "M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5", FULL_OFF = "M3 8h5V3m8 0v5h5M3 16h5v5m13-5h-5v5";
if (document.fullscreenEnabled) {
  fullBtn.addEventListener("click", () => {
    (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
  });
  document.addEventListener("fullscreenchange", () => {
    const on = !!document.fullscreenElement;
    fullBtn.querySelector("path").setAttribute("d", on ? FULL_OFF : FULL_ON);
    fullBtn.title = on ? "Far úr fullum skermi" : "Fullur skermur";
    fullBtn.setAttribute("aria-label", fullBtn.title);
  });
} else fullBtn.hidden = true;
</script>
